<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSL Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6763; --line:#dcd9d1; --line2:#ebe8e1;
  --brand:#0f5c4d; --brand-ink:#ffffff; --brand-soft:#e3efeb;
  --good:#1d7a45; --good-bg:#e4f3e9; --warn:#a15c00; --warn-bg:#fdf1dc; --bad:#b3261e; --bad-bg:#fbe6e4;
  --focus:#2b6fd6; --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.livebox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--good-bg);border:1px solid #b9dcc6;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(29,122,69,.5);animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(29,122,69,.5)}70%{box-shadow:0 0 0 8px rgba(29,122,69,0)}100%{box-shadow:0 0 0 0 rgba(29,122,69,0)}}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink)}
.bar{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;max-width:1500px;margin:0 auto}
.logo{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.logo span{opacity:.7;font-weight:500}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:var(--brand-ink);text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;opacity:.85;font-weight:500}
nav a:hover{background:rgba(255,255,255,.12);opacity:1}
nav a.active{background:rgba(255,255,255,.2);opacity:1}
.who{font-size:13px;white-space:nowrap;display:flex;gap:10px;align-items:center}
.who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}

main{max-width:1500px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;min-height:42px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#bdb9ae}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0b4a3e}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--bad-bg)}
.hint{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* login */
.login{max-width:380px;margin:9vh auto;}
.login h1{font-size:22px;margin-bottom:4px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.msg{padding:10px 12px;border-radius:8px;font-size:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--good-bg);color:var(--good)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;align-self:flex-start}
.pwwrap{position:relative}
.pwwrap input{padding-right:46px}
.pweye{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;border-radius:6px}
.pweye:hover{color:var(--ink)}
.pweye svg{width:20px;height:20px}
/* rejected keystroke / paste: red box + message under the box */
input.inbad{box-shadow:0 0 0 2px var(--bad) inset;background:var(--bad-bg)}
#inmsg{position:fixed;z-index:60;background:var(--bad);color:#fff;font-size:13px;line-height:1.35;padding:6px 10px;border-radius:6px;max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.2);pointer-events:none}
/* OK / Cancel box (double entries) */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;color:var(--bad)}
.modal .mbody{font-size:14px;max-height:50vh;overflow:auto}
.modal .mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.datebar{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.pwrules{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.pwrules li.ok{color:var(--good)}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14px}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--good)}

/* shift entry cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-h h3{font-size:16px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--muted);font-weight:500}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.todo{background:var(--warn-bg);color:var(--warn)}
.card-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.plan{font-size:13px;color:var(--muted);background:#faf9f6;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.plan b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.existing{font-size:13px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.existing .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stops{display:flex;flex-direction:column;gap:6px}
.stoprow{display:grid;grid-template-columns:1fr 92px 32px;gap:6px;align-items:center}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.card-f{padding:10px 14px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;margin-top:auto}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font-weight:600;padding:8px 0}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#f7f6f2;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;z-index:2;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:#f0eee8;font-weight:700}
tr.tot td{background:var(--brand-soft);font-weight:700}
td.first,th.first{position:sticky;left:0;background:inherit;z-index:1}
th.first{z-index:3;background:#f7f6f2}
tbody tr:not(.grp):not(.tot) td.first{background:#fff}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.a{background:var(--warn-bg);color:var(--warn)}
.pill.r{background:var(--bad-bg);color:var(--bad)}
.flag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:5px;margin-right:4px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.flag.w{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}

/* OEE table: two-line headings, Actual output outlined */
table.oee th{white-space:normal;vertical-align:bottom;line-height:1.25;hyphens:manual}
table.oee th.n{min-width:64px}
table.oee .act{border-left:2px solid var(--brand);border-right:2px solid var(--brand)}
table.oee th.act{border-top:2px solid var(--brand);color:var(--brand)}
table.oee tbody tr:last-child td.act{border-bottom:2px solid var(--brand)}
table.oee td.act{background:#f6faf8}
table.oee tr.grp td.act{background:#e9efe9}
table.oee button.tog{border:0;background:transparent;cursor:pointer;width:22px;padding:0;margin-right:4px;color:var(--brand);font-size:13px;line-height:1}
table.oee button.tog:hover{background:var(--brand-soft);border-radius:4px}
table.oee .tog-sp{display:inline-block;width:26px}
table.oee tr.sub td{background:#fbfaf7;font-size:12.5px;color:#3c4441}
table.oee tbody tr.sub td.first{background:#fbfaf7;padding-left:36px}
table.oee tr.sub td.act{background:#f2f7f4}
table.oee .pname{display:inline-block;max-width:250px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
table.oee .pplan{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}

/* planning board */
.plantbl td.n,.plantbl td.u{padding:6px 9px;color:var(--muted)}
.plantbl td.e{color:var(--ink);font-weight:600}
.plantbl td.ro{padding:7px 9px}
#spTable tr.secstart td{border-top:2px solid var(--line)}
.plantbl td.ua .sub.neg{color:var(--bad);font-weight:700;background:var(--bad-bg)}
.plantbl td.e .sub,.plantbl td.ua .sub{min-height:22px}
.plantbl tr.multi td.e,.plantbl tr.multi td.ua{padding:0 9px}
.plantbl tr.multi td.e .sub,.plantbl tr.multi td.ua .sub{height:34px;line-height:34px;margin:0 -9px;padding:0 9px}
.plantbl tr.multi td.e .sub + .sub,.plantbl tr.multi td.ua .sub + .sub{border-top:1px dashed var(--line2)}
.plantbl .mf{display:flex;align-items:center;position:relative}
.plantbl .mf + .mf{border-top:1px dashed var(--line2)}
.plantbl .mf input{flex:1;min-width:0}
.plantbl .mf .ml{flex:none;width:72px;padding-left:9px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.plantbl tr.multi td.ro .mf{min-height:34px}
.plantbl .mf .ml.ng{width:auto;padding-right:8px;color:var(--warn,#9a6700)}
.plantbl tr.multi td.ro{padding-top:0;padding-bottom:0}
.plantbl .mf.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.plantbl .mf.bad input{color:var(--bad);font-weight:600}
.plantbl .fillsel{background:#e8f0ff !important;box-shadow:inset 0 0 0 1px var(--focus)}
.plantbl td.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.cbox{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:300px;overflow:auto;font-size:14px;padding:4px 0}
.cbox div{padding:7px 12px;cursor:pointer;white-space:nowrap}
.cbox div.on,.cbox div:hover{background:#eef3ff}
.cbox div small{color:var(--muted);margin-left:8px}
.cbox .none{color:var(--muted);cursor:default;background:none !important}
.fillh{position:absolute;z-index:65;width:9px;height:9px;background:var(--focus);border:1px solid #fff;cursor:crosshair;display:none;touch-action:none}
.plantbl td select{border:0;border-radius:0;min-height:34px;padding:6px 8px;background:transparent}
.plantbl td input.auto{color:var(--muted);font-style:italic}
.plantbl td[data-k=hrs] input,.plantbl td[data-k=co] input,.plantbl td[data-k=out] input{text-align:right;padding-right:16px}
.plantbl tr.padd td{padding:4px 6px;background:#fcfbf8}

/* bulk grid */
.gridtbl td{padding:0;border-right:1px solid var(--line2)}
.gridtbl td input,.gridtbl td select{border:0;border-radius:0;min-height:34px;padding:6px 8px;background:transparent}
.gridtbl td input:focus,.gridtbl td select:focus{outline:2px solid var(--focus);outline-offset:-2px;background:#f3f7ff}
.gridtbl td.num{width:44px;text-align:center;color:var(--muted);font-size:12px;background:#faf9f6}
.gridtbl tr.err td{background:var(--bad-bg)}
.gridtbl tr.saved td{background:var(--good-bg)}
.gridtbl td.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.gridtbl td.bad input{color:var(--bad);font-weight:600}
.gerrs{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px;max-height:150px;overflow:auto}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

@media (max-width:640px){
  main{padding:12px}
  .bar{gap:8px;padding:0 10px}
  .logo span{display:none}
  .who .email,.who #roleTxt{display:none}
  .cards{grid-template-columns:1fr}
  .toolbar .field{flex:1 1 140px}
  .grid3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="bar">
    <div class="logo">KSL <span>Production</span></div>
    <nav id="nav"></nav>
    <div class="who"><span id="whoami"></span><button id="logout">Log out</button></div>
  </div>
</header>

<main id="app"></main>
<div id="toast"></div>

<script>
/* =========================================================
   KSL Production App – test version (Sept 2026 data)
   Settings: Supabase project URL + publishable key (safe to
   be in this file – the database security rules protect data)
   ========================================================= */
const CONFIG = {
  url: 'https://qlapyxgjvnuwndpveevv.supabase.co',
  key: 'sb_publishable_TC96gXY35Ko2eTLpnkl04g_JUF9AoNQ',
  testHint: 'Test data loaded: 1–29 September 2026',
  // Web address of the online app (e.g. https://your-site.netlify.app/). Password-reset emails link here.
  // Leave blank to use the address the app was opened from (only works when it is opened online, not as a file).
  appUrl: ''
};
if (window.KSL_TEST_CONFIG) Object.assign(CONFIG, window.KSL_TEST_CONFIG);

// Links in Supabase emails (password reset, invitation) open the app as  ...#access_token=…&type=recovery
// (or ...#error=…&error_description=… when the link has expired). Read them before supabase-js tidies the address.
const AUTH_LINK = (() => {
  const h = new URLSearchParams(location.hash.slice(1)), q = new URLSearchParams(location.search), get = k => h.get(k) || q.get(k);
  return { type: get('type'), token: !!(get('access_token') || get('code')), error: get('error_description') || get('error'), errorCode: get('error_code') };
})();

const sb = supabase.createClient(CONFIG.url, CONFIG.key, CONFIG.clientOptions || {});
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? '' : Number(n).toLocaleString('en-GB', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = n => n == null || isNaN(n) ? '' : (n * 100).toFixed(1) + '%';
const num = v => { if (v === '' || v == null) return null; const x = Number(String(v).replace(/,/g, '')); return isNaN(x) ? NaN : x; };
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
// The shift running now (Kenya time). A Night shift belongs to the date it STARTED, so between
// 00:00 and 07:30 the running shift is the previous day's Night shift. Day 07:30–18:30, Night 18:30–07:30.
function currentShift() {
  const k = new Date(Date.now() + 3 * 3600e3), m = k.getUTCHours() * 60 + k.getUTCMinutes(), d = k.toISOString().slice(0, 10);
  if (m >= 450 && m < 1110) return { date: d, shift: 'Day' };
  if (m >= 1110) return { date: d, shift: 'Night' };
  const y = new Date(k); y.setUTCDate(y.getUTCDate() - 1); return { date: y.toISOString().slice(0, 10), shift: 'Night' };
}

const S = { user: null, profile: null, m: null, view: null, ctx: { date: null, shift: null, section: null }, drafts: {}, leave: null };
// Unsaved values typed on a screen are kept (in memory only) when moving to another screen and back.
// They are lost when the app is refreshed or closed, and cleared at log out.
function clearDrafts() { S.drafts = {}; S.leave = null; if (typeof PL !== 'undefined') { PL.dirty = false; PL.rows = []; PL.date = null; } }

function toast(text, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = text;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3500);
}
function fail(error, what) { console.error(what, error); toast(`${what}: ${error.message || error}`, 'err'); }

/* ---------- stoppage time: a plain number = minutes (45), or h:mm (1:30). Digits and one colon only;
   the minutes after the colon must be two digits, 00–59. ---------- */
function parseMinutes(v) {
  v = String(v ?? '').trim(); if (!v) return null;
  let m = v.match(/^(\d+)$/); if (m) return +m[1];
  m = v.match(/^(\d+):([0-5]\d)$/); if (m) return +m[1] * 60 + +m[2];
  return NaN;
}
const MIN_RULE = 'Type minutes (e.g. 45) or h:mm (e.g. 1:30). Minutes after the colon: 00–59.';

/* ---------- input guards: numbers-only boxes and stoppage-time boxes ----------
   A keystroke or paste that would put a wrong character in the box is refused: the box goes red
   and a message shows under it. Pasted thousands commas (1,250) are removed automatically. */
const NUM_OK = v => /^\d*\.?\d*$/.test(v);                    // digits, at most one decimal point
const MIN_OK = v => /^\d*(:([0-5]\d?)?)?$/.test(v);           // while typing: 45 · 1: · 1:3 · 1:30
function flagInput(inp, msg) {
  inp.classList.add('inbad'); clearTimeout(inp._badT);
  inp._badT = setTimeout(() => inp.classList.remove('inbad'), 2500);
  let b = $('#inmsg'); if (!b) { b = document.createElement('div'); b.id = 'inmsg'; document.body.appendChild(b); }
  const r = inp.getBoundingClientRect();
  b.textContent = msg; b.style.left = Math.max(8, Math.min(r.left, innerWidth - 330)) + 'px'; b.style.top = (r.bottom + 6) + 'px'; b.hidden = false;
  clearTimeout(b._t); b._t = setTimeout(() => { b.hidden = true; }, 3000);
}
function cleanNumberText(v) { return String(v ?? '').trim().replace(/[,\s]/g, ''); }     // pasted 1,250 -> 1250
function guardInput(inp, kind) {
  if (inp._guard) return; inp._guard = kind;
  const ok = kind === 'min' ? MIN_OK : NUM_OK;
  const why = v => kind === 'min'
    ? (/:\d*:/.test(v) || /:.*:/.test(v) ? 'Only one colon allowed. ' + MIN_RULE
       : /:[6-9]/.test(v) || /:\d{3}/.test(v) ? 'Minutes after the colon must be 00–59.' : 'Stoppage time takes numbers and a colon only. ' + MIN_RULE)
    : (/\..*\./.test(v) ? 'Only one decimal point allowed.' : 'Numbers only – letters and other characters are not accepted (a decimal point is fine).');
  let last = inp.value;
  inp.addEventListener('beforeinput', e => { if (e.inputType && e.inputType.startsWith('insertFrom')) inp._pasting = true; });
  inp.addEventListener('input', () => {
    let v = inp.value;
    if (inp._pasting && kind === 'num') { const c = cleanNumberText(v); if (NUM_OK(c)) v = inp.value = c; }
    if (inp._pasting && kind === 'min') v = inp.value = v.trim();
    inp._pasting = false;
    if (ok(v)) { last = v; inp.classList.remove('inbad'); return; }
    const pos = Math.max(0, (inp.selectionStart || 0) - (v.length - last.length));
    inp.value = last; try { inp.setSelectionRange(pos, pos); } catch (_) {}
    flagInput(inp, why(v));
  });
  inp.addEventListener('focus', () => { last = inp.value; });
}

/* ---------- no entries for a shift that hasn't started ---------- */
function shiftHasStarted(d, sh) {
  const def = { Day: '07:30', Night: '18:30' };
  const st = (S.m.shifts.find(s => s.code === sh)?.start_time || def[sh] || '00:00').slice(0, 5);
  return Date.now() >= new Date(`${d}T${st}:00+03:00`).getTime();
}
function futureEntryError(d, sh) {         // '' if entries are allowed for this date and shift
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return 'Choose a date first.';
  if (shiftHasStarted(d, sh)) return '';
  const st = (S.m.shifts.find(s => s.code === sh)?.start_time || (sh === 'Day' ? '07:30' : '18:30')).slice(0, 5);
  return d > currentShift().date
    ? `${niceDate(d)} is in the future. Output and stoppages can only be entered for shifts that have started.`
    : `The ${niceDate(d)} ${sh} shift hasn't started yet (starts ${st}). Output and stoppages can only be entered for shifts that have started.`;
}

function confirmBox(title, html, okText = 'OK, save anyway') {

async function loadMasters() {
  const q = (t, sel = '*', order) => { let x = sb.from(t).select(sel); if (order) x = x.order(order); return x.limit(5000); };
  const [mc, pr, em, rs, gr, sh, po] = await Promise.all([
    q('machines', '*', 'name'), q('products', 'item_code,description,uom,nett_weight,purchasing_factor,packing_factor,stage,active', 'description'),
    q('employees', 'staff_id,name,department,active', 'name'), q('stoppage_reasons', '*', 'sort_order'),
    q('machine_groups', '*', 'sort_order'), q('shifts', '*', 'sort_order'), q('positions', 'code,name,machine_code,section'),
  ]);
  for (const r of [mc, pr, em, rs, gr, sh, po]) if (r.error) throw r.error;
  const m = { machines: mc.data, products: pr.data.filter(p => p.active), employees: em.data.filter(e => e.active),
    reasons: rs.data, groups: gr.data, shifts: sh.data, positions: po.data };
  m.machineBy = Object.fromEntries(m.machines.map(x => [x.code, x]));
  m.machineByName = Object.fromEntries(m.machines.map(x => [x.name.toUpperCase(), x]));
  m.productBy = Object.fromEntries(pr.data.map(x => [x.item_code, x]));
  m.empBy = Object.fromEntries(em.data.map(x => [x.staff_id, x]));
  m.reasonBy = Object.fromEntries(m.reasons.map(x => [x.code, x]));
  m.groupBy = Object.fromEntries(m.groups.map(x => [x.code, x]));
  m.posBy = Object.fromEntries(m.positions.map(x => [x.code, x]));
  m.sections = [...new Set(m.machines.filter(x => x.active).map(x => x.department))].sort((a, b) => sectionRank(a) - sectionRank(b) || a.localeCompare(b));
  S.m = m;
}
const SECTION_ORDER = ['Cooking', 'Forming', 'Cooling', 'Wrapping', 'White Mint', 'Packaging', 'Manual', 'Scrap', 'Vehicles/Generators'];
const sectionRank = s => { const i = SECTION_ORDER.indexOf(s); return i < 0 ? 50 : i; };
const productLabel = p => p ? `${p.item_code} — ${p.description}` : '';
const empLabel = e => e ? `${e.name} (${e.staff_id})` : '';
function productFromLabel(v) { v = String(v || '').trim(); if (!v) return null; const code = v.split(' — ')[0].trim().toUpperCase();
  if (S.m.productBy[code]) return code; const hit = S.m.products.find(p => p.description.toUpperCase() === v.toUpperCase()); return hit ? hit.item_code : undefined; }
function empFromLabel(v) { v = String(v || '').trim(); if (!v) return null; const m = v.match(/\(([^)]+)\)\s*$/);
  if (m && S.m.empBy[m[1]]) return m[1]; if (S.m.empBy[v.toUpperCase()]) return v.toUpperCase();
  const hit = S.m.employees.filter(e => e.name.toUpperCase() === v.toUpperCase()); return hit.length === 1 ? hit[0].staff_id : undefined; }
function machineFromLabel(v) { v = String(v || '').trim().toUpperCase(); if (!v) return null; if (S.m.machineBy[v]) return v;
  const h = S.m.machineByName[v]; return h ? h.code : undefined; }
/* ---------- which products each section may use ----------
   Product stage (COOKED / WRAPPED / PACKED / OTHER) is set on each product.
   Sections not listed here (Vehicles/Generators) have no product. */
const STAGES_BY_SECTION = {
  Cooking: ['COOKED'], Forming: ['COOKED'], Cooling: ['COOKED'], Scrap: ['COOKED'],
  Wrapping: ['WRAPPED'],
  Packaging: ['PACKED'], 'White Mint': ['PACKED'], Manual: ['PACKED', 'OTHER'],
};
const stagesFor = mc => mc ? STAGES_BY_SECTION[mc.department] || null : null;     // null = no product needed
const needsProduct = mc => !!stagesFor(mc);
const stageWord = st => st.map(s => s.toLowerCase()).join(' / ');
function productListId(mc) {        // datalist with only the products this machine may use
  const st = stagesFor(mc); if (!st) return '';
  const id = 'dl-prod-' + st.join('-');
  if (!$('#' + id)) { const d = document.createElement('datalist'); d.id = id;
    d.innerHTML = S.m.products.filter(p => st.includes(p.stage)).map(p => `<option value="${esc(productLabel(p))}">`).join(''); document.body.appendChild(d); }
  return id;
}
function productStageError(mc, code) {   // '' if fine, else a message
  const st = stagesFor(mc), p = S.m.productBy[code];
  if (!st || !p || st.includes(p.stage)) return '';
  return `${p.description} is a ${String(p.stage || 'unclassified').toLowerCase()} product – ${mc.name} only takes ${stageWord(st)} products.`;
}
function ensureDatalists() {
  if ($('#dl-products')) return;
  const mk = (id, items) => { const d = document.createElement('datalist'); d.id = id; d.innerHTML = items.map(v => `<option value="${esc(v)}">`).join(''); document.body.appendChild(d); };

}

async function needsPassword() {

const clearAuthLink = () => { if (/access_token|error|type=/.test(location.hash + location.search) || location.href.endsWith('#')) history.replaceState(null, '', location.pathname); };
function resetRedirect() {     // where the link in the reset email should open the app
  if (/^https?:$/.test(location.protocol)) return location.origin + location.pathname;
  return CONFIG.appUrl || undefined;          // undefined = Supabase "Site URL"
}
async function start() {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { clearDrafts(); renderLogin(); }
    if (ev === 'PASSWORD_RECOVERY') S.recovery = true;
  });
  const { data: { session } } = await sb.auth.getSession();
  if (AUTH_LINK.error && !session) {
    clearAuthLink();
    const expired = /expired|invalid/i.test(AUTH_LINK.error + ' ' + (AUTH_LINK.errorCode || ''));
    return renderLogin(expired ? 'That email link has expired or has already been used. Use "Forgot your password?" to get a new one.' : AUTH_LINK.error);
  }
  if (!session) return renderLogin();
  // Invitation link: the person has no password yet, so they must choose one before going in.
  // Recognised by the link type, by an invited user arriving through an emailed link, or by the
  // database saying the login has no password (12_invites.sql).
  const viaInvite = ['invite', 'signup', 'magiclink'].includes(AUTH_LINK.type)
    || (AUTH_LINK.token && AUTH_LINK.type !== 'recovery' && session.user.invited_at);
  if (AUTH_LINK.type === 'recovery' || S.recovery || viaInvite || await needsPassword()) {
    const mode = AUTH_LINK.type === 'recovery' || S.recovery ? 'reset' : 'invite';
    clearAuthLink(); S.recovery = false;
    return renderSetPassword(session.user, mode);
  }
  clearAuthLink();
  await afterLogin(session.user);
}

// mode: 'first' (first log-in with a temporary password), 'reset' (from the emailed link), 'invite' (from an invitation email)
function renderSetPassword(user, mode) {

  </div>`;
  const a = $('#np1'), b = $('#np2');
  const checks = () => ({ len: a.value.length >= PW_MIN, mix: /[a-z]/i.test(a.value) && /\d/.test(a.value), same: a.value !== '' && a.value === b.value });
  const paint = () => { const c = checks(); $$('#npRules li').forEach(li => li.classList.toggle('ok', c[li.dataset.r])); };
  a.oninput = b.oninput = paint;

    const btn = e.submitter; btn.disabled = true; btn.textContent = 'Saving…';

async function afterLogin(user, opts = {}) {
  S.user = user;
  const { data, error } = await sb.from('profiles').select('*').eq('user_id', user.id).maybeSingle();
  if (error) return renderLogin('Could not read your profile: ' + error.message);
  S.profile = data;
  // No password yet (invited person who got in some other way): choose one first. Needs 12_invites.sql.
  if (!opts.passwordJustSet && await needsPassword()) return renderSetPassword(user, 'invite');
  // First log-in (or admin gave a temporary password): choose your own before going on. Needs 11_passwords.sql.
  if (data && data.active && data.password_set === false && !opts.passwordJustSet) return renderSetPassword(user, 'first');
  if (!data || data.role === 'pending' || !data.active) {
    $('#hdr').classList.add('hidden');
    $('#app').innerHTML = `<div class="login panel"><h1>Waiting for access</h1>
      <p>You're logged in as <b>${esc(user.email)}</b>, but an admin hasn't given you a role yet.</p>
      <p class="muted small">Ask the admin to open <b>Users</b> and set your role.</p>
      <button class="btn" id="lo2">Log out</button></div>`;
    $('#lo2').onclick = () => sb.auth.signOut();
    return;
  }
  try { await loadMasters(); } catch (e) { return renderLogin('Could not load master data: ' + e.message); }
  { const { data: ed, error: ee } = await sb.rpc('my_editable_users');
    S.editable = ee ? (data.role === 'admin' ? null : [user.id]) : ed; }     // fallback if 10_roles_and_groups.sql not run yet
  ensureDatalists();
  $('#hdr').classList.remove('hidden');
  $('#whoami').innerHTML = `<span class="email">${esc(data.full_name || user.email)} · </span><span id="roleTxt">${esc(ROLE_LABEL[data.role] || data.role)}</span>`;
  $('#logout').onclick = () => sb.auth.signOut();
  window.onhashchange = route;
  route();
}
function route() {
  const role = S.profile.role;
  const allowed = VIEWS.filter(v => v.can(role));
  let id = location.hash.slice(1);
  if (!allowed.find(v => v.id === id)) id = allowed[0].id;
  $('#nav').innerHTML = allowed.map(v => `<a href="#${v.id}" class="${v.id === id ? 'active' : ''}">${v.label}</a>`).join('');
  if (S.leave) { const f = S.leave; S.leave = null; try { f(); } catch (e) { console.error('Keeping unsaved values', e); } }
  S.view = id;
  if (!S.ctx.date) { const c = currentShift(); S.ctx.date = c.date; S.ctx.shift = c.shift; }
  allowed.find(v => v.id === id).render();
}

async function renderEntry() {

// keep what was typed on the machine cards (per date + shift + section) until it is saved
const entryKey = () => `${S.ctx.date}|${S.ctx.shift}|${S.ctx.section}`;
function entrySnapshot(skip) {
  const cards = $$('#cards .card'); if (!S.entryKey || !cards.length) return;
  const d = {};
  for (const c of cards) {

    const v = k => $(k, c)?.value ?? null;
    const x = { prod: v('.f-prod'), qty: v('.f-qty'), ss: v('.f-ss'), ms: v('.f-ms'), op: v('.f-op'), cm: v('.f-cm'),
      stops: $$('.stoprow', c).map(r => ({ r: $('.s-r', r).value, m: $('.s-m', r).value })), touched: c.dataset.touched === '1' };
    if (x.touched || x.qty || x.ss || x.ms || x.cm || x.stops.length) d[c.dataset.m] = x;
  }
  S.drafts['entry|' + S.entryKey] = Object.keys(d).length ? d : null;
}
function entryRestore() {
  const k = 'entry|' + S.entryKey, d = S.drafts[k]; if (!d) return 0;
  S.drafts[k] = null;
  let n = 0;
  for (const [code, x] of Object.entries(d)) {
    let card = $(`#cards .card[data-m="${CSS.escape(code)}"]`);
    if (!card) { const mc = S.m.machineBy[code]; if (!mc) continue;

      $(`#addM option[value="${CSS.escape(code)}"]`)?.remove(); }
    const set = (sel, v) => { const el = $(sel, card); if (el && v != null) el.value = v; };
    set('.f-prod', x.prod); set('.f-qty', x.qty); set('.f-ss', x.ss); set('.f-ms', x.ms); set('.f-op', x.op); set('.f-cm', x.cm);

}
async function loadEntry() {

    sb.from('stoppages').select('*').eq('stop_date', date).eq('shift', shift).in('machine_code', codes).order('id'),
    sb.from('manpower_allocations').select('position_code,staff_id').eq('alloc_date', date).eq('shift', shift),
  ]);
  for (const r of [pl, out, st, mp]) if (r.error) return fail(r.error, 'Loading shift');
  const by = (rows, k = 'machine_code') => rows.reduce((a, r) => ((a[r[k]] ||= []).push(r), a), {});
  const P = by(pl.data), O = by(out.data), T = by(st.data);
  const opByMachine = {};

  const active = machines.filter(x => P[x.code] || O[x.code] || T[x.code]);

    <div class="cards" id="cards">${active.map(machineCard).join('')}</div>

      <select id="addM"><option value="">Choose machine…</option>${others.map(x => `<option value="${x.code}">${esc(x.name)}</option>`).join('')}</select></div>

}
function machineCard(mc) {

  return `<div class="card" data-m="${mc.code}" data-expected="${expected}" data-actual="${actual}">

    <div class="card-b">
      ${plans.length ? `<div class="plan">${plans.map(p => `Plan: <b>${esc(S.m.productBy[p.product_code]?.description || '—')}</b> · ${fmt(p.planned_hrs, 1)} h · planned ${fmt(p.planned_output)} · expected ${fmt(p.expected_output)} ${esc(p.unit || '')}`).join('<br>')}</div>` : ''}

        ${outs.map(o => `<div class="row"><span><b>${fmt(o.qty, 1)} ${esc(o.unit)}</b> ${esc(S.m.productBy[o.product_code]?.description || '')}${o.sweet_scrap_kg ? ` · sweet scrap ${fmt(o.sweet_scrap_kg, 1)}` : ''}${o.material_scrap_kg ? ` · material scrap ${fmt(o.material_scrap_kg, 2)}` : ''}${o.operator_id ? ` · ${esc(S.m.empBy[o.operator_id]?.name || o.operator_id)}` : ''}</span>${canDel(o) ? `<button class="x" title="Delete this entry" data-del="output_entries" data-id="${o.id}">×</button>` : ''}</div>`).join('')}
        ${stops.map(s => `<div class="row"><span>⏸ ${esc(S.m.reasonBy[s.reason_code]?.name)} · <b>${hhmm(s.minutes)}</b></span>${canDel(s) ? `<button class="x" title="Delete this stoppage" data-del="stoppages" data-id="${s.id}">×</button>` : ''}</div>`).join('')}

      </div>` : ''}

      <div class="grid3">
        <div class="field"><label>Output (${esc(mc.unit || '')})</label><input class="f-qty" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Sweet scrap kg</label><input class="f-ss" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Material scrap kg</label><input class="f-ms" inputmode="decimal" placeholder="0"></div>
      </div>
      <div class="field"><label>Operator</label><input class="f-op" list="dl-employees" placeholder="Type name" value="${esc(outs.length ? '' : empLabel(S.m.empBy[op]))}"></div>
      <div class="field"><label>Comments</label><input class="f-cm" placeholder="Optional"></div>
      <div><label class="small muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.04em">Stoppages</label>
        <div class="stops"></div>
        <button class="btn sm ghost f-addstop" type="button" style="margin-top:6px">+ Add stoppage</button></div>

function stopRowHTML() {
  return `<div class="stoprow"><select class="s-r">${S.m.reasons.map(r => `<option value="${r.code}">${esc(r.name)}</option>`).join('')}</select>
    <input class="s-m" placeholder="min or h:mm" inputmode="text" autocomplete="off"><button class="x" type="button" title="Remove">×</button></div>`;
}
function bindCard(card) {
  const mc = S.m.machineBy[card.dataset.m];
  ['.f-qty', '.f-ss', '.f-ms'].forEach(c => guardInput($(c, card), 'num'));
  $('.f-addstop', card).onclick = () => { $('.stops', card).insertAdjacentHTML('beforeend', stopRowHTML()); const r = $('.stops', card).lastElementChild; $('.x', r).onclick = () => r.remove(); guardInput($('.s-m', r), 'min'); $('.s-m', r).focus(); };
  $$('[data-del]', card).forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Delete?'; b.style.fontSize = '12px'; setTimeout(() => { b.dataset.confirm = ''; b.textContent = '×'; b.style.fontSize = ''; }, 3000); return; }
    const { error } = await sb.from(b.dataset.del).delete().eq('id', b.dataset.id);
    if (error) return fail(error, 'Delete'); toast('Deleted'); entrySnapshot(); loadEntry();
  });
  ['input', 'change'].forEach(ev => card.addEventListener(ev, () => { card.dataset.touched = '1'; const s = $('.f-save', card); if (s.dataset.force) { delete s.dataset.force; s.textContent = 'Save'; s.classList.replace('warn', 'primary'); $('.warnbox', card).classList.add('hidden'); } }));
  $('.f-save', card).onclick = async () => {
    const btn = $('.f-save', card), warn = $('.warnbox', card);
    const qty = num($('.f-qty', card).value), ss = num($('.f-ss', card).value), ms = num($('.f-ms', card).value);
    const prod = $('.f-prod', card) ? productFromLabel($('.f-prod', card).value) : null, op = empFromLabel($('.f-op', card).value);
    const stops = $$('.stoprow', card).map(r => ({ reason_code: $('.s-r', r).value, minutes: parseMinutes($('.s-m', r).value), el: r }));
    const errs = [];
    const fut = futureEntryError(S.ctx.date, S.ctx.shift); if (fut) errs.push(fut);
    if (qty === null && (ss || ms)) errs.push('Enter the output as well as the scrap.');
    if ([qty, ss, ms].some(v => Number.isNaN(v) || v < 0)) errs.push('Output and scrap must be numbers (0 or more).');
    if (qty !== null && prod === undefined) errs.push('Product not recognised – pick it from the list.');
    if (qty !== null && !prod && needsProduct(mc)) errs.push('Choose the product.');
    if (qty !== null && prod) { const se = productStageError(mc, prod); if (se) errs.push(se); }
    if (op === undefined) errs.push('Operator not recognised – pick from the list or leave blank.');
    for (const s of stops) if (s.minutes === null || Number.isNaN(s.minutes) || s.minutes <= 0 || s.minutes > 780) errs.push('Stoppage time must be between 1 minute and 13:00. ' + MIN_RULE);
    if (qty === null && !stops.length) errs.push('Nothing to save – enter output or a stoppage.');
    if (errs.length) { warn.innerHTML = [...new Set(errs)].join('<br>'); warn.classList.remove('hidden'); return; }
    // soft warnings (save anyway on second press)
    if (!btn.dataset.force) {
      const w = [];
      const exp = +card.dataset.expected, act = +card.dataset.actual + (qty || 0);
      if (exp > 0 && act > exp * 1.05) w.push(`Output is ${pct(act / exp)} of expected (${fmt(exp)}). Check the figure.`);
      const kg = qty == null ? 0 : (/ctn/i.test(mc.unit || '') ? qty * (+S.m.productBy[prod]?.nett_weight || 0) : qty);
      if (kg > 0 && ss && mc.sweet_scrap_limit && ss / kg > mc.sweet_scrap_limit) w.push(`Sweet scrap is ${pct(ss / kg)} of output – limit ${pct(mc.sweet_scrap_limit)}.`);
      if (kg > 0 && ms && mc.wrapper_scrap_limit && ms / kg > mc.wrapper_scrap_limit) w.push(`Material scrap is ${pct(ms / kg)} of output – limit ${pct(mc.wrapper_scrap_limit)}.`);
      const totalStop = stops.reduce((s, x) => s + x.minutes, 0);
      const shiftMin = (S.m.shifts.find(s => s.code === S.ctx.shift)?.hours || 13) * 60;
      if (totalStop > shiftMin) w.push(`Stoppages add up to ${hhmm(totalStop)} – longer than the shift.`);
      if (w.length) { warn.innerHTML = w.join('<br>'); warn.classList.remove('hidden'); btn.dataset.force = '1'; btn.textContent = 'Save anyway'; btn.classList.replace('primary', 'warn'); return; }
    }
    // double entries: same output already saved for this date + shift, or a stoppage row the same as the one above it
    { const dup = [];
      if (qty !== null) {
        const k = outKey({ machine_code: mc.code, product_code: prod, qty, sweet_scrap_kg: ss, material_scrap_kg: ms });
        const n = (S.entry.O[mc.code] || []).filter(o => outKey(o) === k).length;
        if (n) dup.push(`This output (${fmt(qty, 2)} ${esc(mc.unit || '')}${prod ? ' of ' + esc(S.m.productBy[prod]?.description || prod) : ''}, sweet scrap ${fmt(nz(ss), 2)}, material scrap ${fmt(nz(ms), 2)}) is already saved for ${esc(mc.name)} on this date and shift${n > 1 ? ` (${n} times)` : ''}.`);
      }
      stops.forEach((x, i) => { if (i && stopKey({ ...x, machine_code: 1 }) === stopKey({ ...stops[i - 1], machine_code: 1 }))
        dup.push(`Stoppage ${i + 1} (${esc(S.m.reasonBy[x.reason_code]?.name)} ${hhmm(x.minutes)}) is the same as stoppage ${i}.`); });
      if (dup.length && !await confirmBox('Possible double entry', dup.map(d => `<p>${d}</p>`).join('') + '<p>Press <b>Cancel</b> to check it, or <b>OK, save anyway</b> if it really happened twice.</p>')) return;
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    const base = { shift: S.ctx.shift, machine_code: mc.code };
    if (qty !== null) {
      const { error } = await sb.from('output_entries').insert({ ...base, prod_date: S.ctx.date, product_code: prod || null, qty, unit: mc.unit || 'Kg',
        sweet_scrap_kg: ss, material_scrap_kg: ms, operator_id: op || null, comments: $('.f-cm', card).value.trim() || null });
      if (error) { btn.disabled = false; btn.textContent = 'Save'; return fail(error, 'Saving output'); }
    }
    if (stops.length) {
      const { error } = await sb.from('stoppages').insert(stops.map(s => ({ ...base, stop_date: S.ctx.date, reason_code: s.reason_code, minutes: s.minutes })));
      if (error) { btn.disabled = false; btn.textContent = 'Save'; return fail(error, 'Saving stoppages'); }
    }
    toast(`${mc.name} saved`, 'ok');
    entrySnapshot(mc.code);      // other cards keep what was typed on them
    loadEntry();
  };
}

const SP = { date: null, shift: null };
function renderSap() {

  $('#app').innerHTML = `<div class="hint">Output posted for one shift, added up per product per section, for entering into SAP.
      Cooked output is counted on the cookers only (not again on the Uniplast and Cooling Conveyor); scrap recorded on the Uniplast and Cooling Conveyor still shows under Forming and Cooling. Recycling (Scrap section) and lines with no product (vehicles, generators, meters) are left out.</div>

async function loadSap() {
  const body = $('#spBody'); body.innerHTML = `<div class="muted">Loading…</div>`;
  const want = SP.date + '|' + SP.shift;
  let data;
  try { data = await fetchAll(() => sb.from('output_entries').select('machine_code,product_code,qty,unit,output_kg,sweet_scrap_kg,material_scrap_kg')
    .eq('prod_date', SP.date).eq('shift', SP.shift).order('id')); }
  catch (e) { return fail(e, 'Loading output'); }
  if (S.view !== 'sap' || $('#spBody') !== body || want !== SP.date + '|' + SP.shift) return;
  const by = {}; let noProd = 0, cookedElsewhere = 0, recycling = 0;
  for (const o of data) {
    const mc = S.m.machineBy[o.machine_code], p = S.m.productBy[o.product_code];
    if (!o.product_code) { noProd++; continue; }
    const sec = mc?.department || '(unknown machine)';
    if (sec === 'Scrap') { recycling++; continue; }        // Recycling is not posted to SAP from here (user, 12 Nov 2026)
    // a cooked batch is entered again on the Uniplast and Cooling Conveyor: count its output on the cooker only,
    // but keep the scrap recorded on those lines
    const repeat = p?.stage === 'COOKED' && (sec === 'Forming' || sec === 'Cooling');
    if (repeat) cookedElsewhere++;
    const unit = repeat ? '' : o.unit || '';
    const r = (by[sec + '|' + o.product_code + '|' + unit] ||= { sec, code: o.product_code, product: p?.description || o.product_code, unit, qty: 0, kg: 0, ss: 0, ms: 0, n: 0, repeat });
    if (!repeat) { r.qty += +o.qty || 0; r.kg += +o.output_kg || 0; }
    r.ss += +o.sweet_scrap_kg || 0; r.ms += +o.material_scrap_kg || 0; r.n++;
  }
  const rows = Object.values(by).filter(r => !r.repeat || r.ss || r.ms).sort((a, b) => sectionRank(a.sec) - sectionRank(b.sec) || a.sec.localeCompare(b.sec) || a.product.localeCompare(b.product));
  const when = niceDate(SP.date);
  const fut = futureEntryError(SP.date, SP.shift);
  const frac = shiftFraction(SP.date, SP.shift);
  const note = fut ? `<div class="datebar">${esc(fut)}</div>` : frac < 1 ? `<div class="warnbox" style="margin-bottom:10px">This shift is still running – the figures are only what has been posted so far.</div>` : '';
  if (!rows.length) { body.innerHTML = note + `<div class="panel muted">No output with a product posted for ${esc(when)} · ${esc(SP.shift)} shift.</div>`; return; }
  const d2 = v => fmt(r4(v), r4(v) % 1 ? 2 : 0);
  let html = '', last = null;
  for (const r of rows) {
    const first = r.sec !== last; last = r.sec;
    html += `<tr${first && html ? ' class="secstart"' : ''}><td>${esc(SP.date)}</td><td>${esc(SP.shift)}</td><td>${first ? `<b>${esc(r.sec)}</b>` : `<span class="muted">${esc(r.sec)}</span>`}</td><td>${esc(r.code)}</td><td>${esc(r.product)}</td>
      ${r.repeat ? `<td class="n muted small" colspan="3" style="text-align:center">output counted on the cooker</td>` : `<td class="n"><b>${d2(r.qty)}</b></td><td>${esc(r.unit)}</td><td class="n">${d2(r.kg)}</td>`}<td class="n">${d2(r.ss)}</td><td class="n">${d2(r.ms)}</td></tr>`;
  }
  body.innerHTML = note + `<div class="muted small" style="margin-bottom:8px"><b>${esc(when)} · ${esc(SP.shift)} shift</b> · ${rows.length} line${rows.length === 1 ? '' : 's'} from ${data.length} output entr${data.length === 1 ? 'y' : 'ies'}</div>
    <div class="tablewrap"><table id="spTable"><thead><tr><th>Date</th><th>Shift</th><th>Section</th><th>Item code</th><th>Product</th><th class="n">Output qty</th><th>Unit</th><th class="n">Output kg</th><th class="n">Sweet scrap kg</th><th class="n">Material scrap kg</th></tr></thead>
    <tbody>${html}</tbody></table></div>
    <div class="muted small" style="margin-top:8px">${cookedElsewhere ? `Output of the ${cookedElsewhere} cooked entr${cookedElsewhere === 1 ? 'y' : 'ies'} on Uniplast / Cooling Conveyor is not added again (counted on the cookers); their scrap is shown in the Forming / Cooling rows. ` : ''}${recycling ? `${recycling} Recycling (Scrap section) entr${recycling === 1 ? 'y' : 'ies'} left out. ` : ''}${noProd ? `${noProd} entr${noProd === 1 ? 'y' : 'ies'} with no product left out. ` : ''}Output kg = output in kg (for cartons: cartons × nett weight).</div>`;
}

const SI = { date: null, shift: null, rows: [] };
const shiftRank = sh => { const x = S.m.shifts.find(s => s.code === sh); return x ? +x.sort_order || 0 : 0; };
async function latestPlannedShift() {

const r4 = n => Math.round(n * 1e4) / 1e4;
async function loadStores() {
  const body = $('#siBody'); body.innerHTML = `<div class="muted">Loading…</div>`;
  const { data, error } = await sb.from('plan_lines').select('machine_code,product_code,planned_output,updated_at')
    .eq('plan_date', SI.date).eq('shift', SI.shift).limit(5000);
  if (error) return fail(error, 'Loading the plan');
  if (S.view !== 'stores' || $('#siBody') !== body) return;
  const by = {}; let lastChange = null, zero = 0;
  for (const l of data) {
    if (!lastChange || l.updated_at > lastChange) lastChange = l.updated_at;
    if (!l.product_code) continue;
    const p = S.m.productBy[l.product_code], mc = S.m.machineBy[l.machine_code];
    if (p?.stage === 'COOKED' && mc?.department !== 'Cooking') continue;     // cooked: cooker rows only
    const r = (by[l.product_code] ||= { code: l.product_code, product: p?.description || l.product_code, out: 0 });
    r.out += +l.planned_output || 0;
  }
  let rows = Object.values(by).map(r => ({ ...r, out: r4(r.out) }));
  zero = rows.filter(r => !r.out).length; rows = rows.filter(r => r.out);
  rows.sort((a, b) => a.product.localeCompare(b.product));
  SI.rows = rows;
  const when = new Date(SI.date + 'T00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const isLatest = SI.latest && SI.latest.date === SI.date && SI.latest.shift === SI.shift;

  if (!rows.length) { body.innerHTML = `<div class="panel muted">No products planned for ${esc(when)} · ${esc(SI.shift)} shift.</div>`; return; }
  const changed = lastChange ? new Date(lastChange).toLocaleString('en-GB', { timeZone: 'Africa/Nairobi', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
  body.innerHTML = `<div class="muted small" style="margin-bottom:8px"><b>${esc(when)} · ${esc(SI.shift)} shift</b>${isLatest ? ' (latest plan)' : ''}${changed ? ` · plan last changed ${esc(changed)}` : ''}</div>
    <div class="tablewrap" style="max-width:720px"><table id="siTable"><thead><tr><th class="first">Code</th><th>Product</th><th class="n">sum Output</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="first">${esc(r.code)}</td><td>${esc(r.product)}</td><td class="n">${fmt(r.out, r.out % 1 ? 2 : 0)}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="muted small" style="margin-top:8px">${rows.length} product${rows.length === 1 ? '' : 's'}. sum Output = planned output (cooked and wrapped in kg, packed in cartons).
      ${zero ? ` ${zero} product${zero === 1 ? '' : 's'} planned with no output left out.` : ''} The plan can still change, so copy it again if it is edited.</div>`;
}
async function copyStores() {
  if (!SI.rows.length) return;
  const tsv = SI.rows.map(r => [r.code, r.product, String(r.out)].map(v => String(v).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(tsv); ok = true; } } catch (e) { /* fall back below */ }
  if (!ok) {
    const t = document.createElement('textarea'); t.value = tsv; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();
  }
  if (ok) toast(`Copied ${SI.rows.length} row${SI.rows.length === 1 ? '' : 's'}. In Google Sheets, click a cell and press Ctrl+V.`);
  else toast('Could not copy automatically. Select the table rows with the mouse and press Ctrl+C.', 'err');
}

/* =========================================================
   PRODUCTION PLANNING BOARD (planner, admin; others view only)
   One row per machine + product, like the Machine Planning sheet.
   Saving updates changed lines in place, adds new ones and deletes
   removed ones, so the first-saved plan and the change history
   (planning accuracy) stay correct.
   ========================================================= */
// Forming (Uniplast) and Cooling have no section of their own: they are planned with their cooker in Cooking.
const PLAN_SECTIONS = ['Cooking', 'Wrapping', 'White Mint', 'Manual', 'Packaging'];
const COOK_PARTS = ['Cooking', 'Forming', 'Cooling'];
const planSec = r => r.kind === 'cook' || COOK_PARTS.includes(sectionOf(r)) ? 'Cooking' : sectionOf(r);   // section the row is shown in
const PL = { rows: [], orig: {}, dirty: false, readOnly: true, seq: 0 };
const r2 = n => Math.round(n * 100) / 100;
// Expected output – same as the Machine Planning sheet:
//   capacity per day x hours / 24 x product purchasing factor (not for Cooking) x machine packing factor, rounded
function planExpected(mc, prod, hrs) {
  if (!mc || !(hrs > 0) || !(+mc.capacity_per_day > 0)) return 0;
  const pf = mc.department === 'Cooking' ? 1 : (+prod?.purchasing_factor || 1);
  return Math.round(+mc.capacity_per_day * hrs / 24 * pf * (+mc.packing_factor || 1));
}
// Default planned output – same as the Planning Template (purchasing factor always applied)
function planDefault(mc, prod, hrs) {
  if (!mc || !(hrs > 0) || !(+mc.capacity_per_day > 0)) return null;
  return Math.round(+mc.capacity_per_day * hrs / 24 * (+prod?.purchasing_factor || 1) * (+mc.packing_factor || 1));
}
const shiftHours = sh => +(S.m.shifts.find(s => s.code === sh)?.hours || 0);
function shiftStarted(d, sh) {     // shift start times come from the shifts table (09_planning.sql)
  const st = S.m.shifts.find(s => s.code === sh)?.start_time; if (!st) return null;
  return new Date() >= new Date(`${d}T${st.slice(0, 5)}:00+03:00`);
}
const prevShift = (d, sh) => sh === 'Night' ? { date: d, shift: 'Day' } : { date: addDays(d, -1), shift: 'Night' };

function renderPlan() {
  PL.readOnly = !CAN.plan(S.profile.role);
  // unsaved changes from before (screen left without saving) – reopen that date and shift with them

  $('#app').innerHTML = `<div class="hint">${PL.readOnly ? 'View only – shift supervisors, planners and admin can change the plan.' :

       <b>Expected output</b> is worked out from the machine capacity (as in the Machine Planning sheet). Planned output fills in from the template formula (grey) – type over it if you plan differently.<br>
       <b>Machine and product boxes:</b> type part of the name to search, then pick with the mouse or ↑ ↓ and Enter.
       <b>Copy down:</b> click a machine or product box and drag the small blue square at its corner over the lines below (or above), like Excel. Machines count up (M/C 16 → 17 → 18); hold <b>Ctrl</b> when you let go to copy the same machine. Products are copied.<br>
       <b>Cooking lines</b> plan a cooker, its Uniplast and its cooling conveyor together: one product, running hours, cleaning hours and planned output for all three (saved as three machine lines, and shown together again when the plan is opened). Older lines that don't match their cooker show as single lines in Cooking.
       <b>+ Add wrapping line</b> takes one or two machines running the same product for the same hours; the planned output is for both together and is split equally when saved. Once saved, each wrapping machine shows as its own line.<br>
       The plan can be changed at any time, even after production. The plan as it stands when the shift starts is kept as the <b>original</b> for planning accuracy.`}</div>
    <div class="toolbar">
      <div class="field"><label for="cDate">Date</label><input id="cDate" type="date" value="${S.ctx.date}"></div>
      <div class="field"><label for="cShift">Shift</label><select id="cShift">${S.m.shifts.map(s => `<option ${s.code === S.ctx.shift ? 'selected' : ''}>${s.code}</option>`).join('')}</select></div>
      ${PL.readOnly ? '' : `<button class="btn primary" id="pSave">Save plan</button>
      <div class="field"><label for="pCopyDate">Copy plan from</label><div style="display:flex;gap:6px">
        <input id="pCopyDate" type="date" style="width:160px"><select id="pCopyShift" style="width:95px">${S.m.shifts.map(s => `<option>${s.code}</option>`).join('')}</select>

      <button class="btn ghost" id="pXls">Export to Excel</button>

  const setDate = v => { S.ctx.date = v; $('#cDate').value = v; loadPlan(); };

window.addEventListener('beforeunload', e => { if (PL.dirty) { e.preventDefault(); e.returnValue = ''; } });
function dirtyBlock(go) {
  planMsg(`You have unsaved changes to this plan. <button class="btn sm" id="pDiscard">Discard changes</button> or press <b>Save plan</b> first.`, 'warn');
  $('#pDiscard').onclick = () => { PL.dirty = false; planMsg(''); go(); };
}
function planMsg(html, kind = '') { $('#pMsg').innerHTML = html ? `<div class="${kind === 'warn' ? 'warnbox' : kind === 'err' ? 'gerrs' : 'hint'}" style="margin-bottom:12px">${html}</div>` : ''; }

async function loadPlan() {
  const { date, shift } = S.ctx;
  planMsg(''); $('#planBody').innerHTML = `<div class="muted">Loading…</div>`;
  if (!PL.readOnly) { const p = prevShift(date, shift); $('#pCopyDate').value = p.date; $('#pCopyShift').value = p.shift; }
  const pl = await sb.from('plan_lines').select('*').eq('plan_date', date).eq('shift', shift).order('id');
  if (pl.error) return fail(pl.error, 'Loading plan');
  if (S.view !== 'plan' || date !== S.ctx.date || shift !== S.ctx.shift) return;
  PL.orig = Object.fromEntries(pl.data.map(r => [r.id, r]));
  PL.rows = planRowsFrom(pl.data, true).rows;
  PL.dirty = false; PL.date = date; PL.shift = shift;
  drawPlan();
  const started = shiftStarted(date, shift);
  if (!PL.readOnly && started) planMsg(`This shift has started, so the original plan is fixed. Any change you save now shows in planning accuracy as added, changed or removed.`);
}

/* ---------- cooking groups from saved lines ----------
   The database keeps one plan line per machine, with no link between a cooker and its Uniplast / cooling conveyor.
   When a plan is opened (or copied) they are grouped again: a cooker line, a Uniplast (Forming) line and a cooling
   line with the same product, running hours, cleaning hours and planned output. If more than one could match, the
   line saved closest to it is taken (the app saves a group's three lines one after the other, so its own groups come
   back exactly). Anything that doesn't match stays a single line (shown in Cooking).
   lines: plan_lines records in id order; withIds: keep the ids (opening a plan) or not (copying). */
function planRowsFrom(lines, withIds, copyHrs = true) {
  const dept = l => S.m.machineBy[l.machine_code]?.department;
  const nv = v => v == null || v === '' ? null : +v;
  const match = (a, b) => (a.product_code || '') === (b.product_code || '') && nv(a.planned_hrs) === nv(b.planned_hrs)
    && (nv(a.changeover_hrs) || 0) === (nv(b.changeover_hrs) || 0) && nv(a.planned_output) === nv(b.planned_output);
  const used = new Set(), groups = new Map();      // cooker line id -> [uniplast line, cooling line]
  const closest = (to, d) => lines.filter(l => !used.has(l.id) && dept(l) === d && match(l, to))
    .sort((a, b) => Math.abs(a.id - to.id) - Math.abs(b.id - to.id) || a.id - b.id)[0];
  for (const ck of lines.filter(l => dept(l) === 'Cooking')) {
    const up = closest(ck, 'Forming'); if (!up) continue; used.add(up.id);
    const cc = closest(up, 'Cooling'); if (!cc) { used.delete(up.id); continue; }
    used.add(cc.id); used.add(ck.id); groups.set(ck.id, [up, cc]);
  }
  const vals = l => copyHrs ? { hrs: l.planned_hrs, co: l.changeover_hrs, out: l.planned_output, auto: false } : { hrs: null, co: null, out: null, auto: true };
  const rows = [];
  for (const l of lines) {
    if (used.has(l.id) && !groups.has(l.id)) continue;           // Uniplast / cooling already in a group
    const g = groups.get(l.id);
    rows.push(g
      ? { key: ++PL.seq, kind: 'cook', section: 'Cooking', id: withIds ? l.id : null, id2: withIds ? g[0].id : null, id3: withIds ? g[1].id : null,
          machine: l.machine_code, m2: g[0].machine_code, m3: g[1].machine_code, product: l.product_code || '', text: {}, ...vals(l) }
      : { key: ++PL.seq, kind: 'single', section: dept(l), id: withIds ? l.id : null, machine: l.machine_code, product: l.product_code || '', text: {}, ...vals(l) });
  }
  return { rows, groups: groups.size };
}

/* ---------- screen rows ----------
   A screen row is one of:
     single – one machine (saved lines outside a group, and new lines in White Mint, Manual, Packaging)
     cook   – cooking line: cooker + Uniplast + cooling conveyor, all required; saved as three lines with the
              same product, hours and planned output (as the Machine Planning sheet stores them); ids in id, id2, id3
     wrap   – new wrapping line: machine 1 + optional machine 2; same product and hours; planned output is for
              both together and split equally when saved */
function sectionOf(row) { return row.section || S.m.machineBy[row.machine]?.department; }
const planMachinesIn = sec => S.m.machines.filter(m => m.active && m.department === sec).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));

function addPlanRow(sec) {

/* ---------- type-to-search box ----------
   items(): [{value, label, note}]; onPick(value, text) when a choice is made or typed text is committed
   (value '' = blank, undefined = not recognised); onType(text) while typing. */
const CB = { box: null, inp: null, list: [], idx: -1, pick: null };
function combo(inp, items, onPick, onType, resolve) {
  const commit = () => {
    const t = inp.value.trim(); if (!t) return onPick('', '');
    const all = items(), T = t.toUpperCase();
    let hit = all.find(i => i.label.toUpperCase() === T || String(i.value).toUpperCase() === T);
    let v = hit ? hit.value : (resolve ? resolve(t) : undefined);
    if (v && !all.find(i => i.value === v)) v = undefined;        // recognised, but not allowed here
    if (hit) inp.value = hit.label; else if (v) inp.value = all.find(i => i.value === v).label;
    onPick(v, inp.value);
  };
  const open = q => {
    const words = q.toUpperCase().split(/\s+/).filter(Boolean);
    let list = items().filter(i => { const L = (i.label + ' ' + (i.note || '')).toUpperCase(); return words.every(w => L.includes(w)); });
    if (words.length) {    // best first: whole phrase as typed, then a word starting with it, then the rest (list order kept)
      const Q = words.join(' '), rank = i => { const L = i.label.toUpperCase(); return L === Q ? 0 : L.endsWith(' ' + Q) || L.endsWith('— ' + Q) ? 1 : L.includes(Q) ? (L.startsWith(Q) || L.includes(' ' + Q) ? 2 : 3) : 4; };
      list = list.map((it, n) => ({ it, n, k: rank(it) })).sort((x, y) => x.k - y.k || x.n - y.n).map(x => x.it); }
    CB.inp = inp; CB.list = list.slice(0, 80); CB.idx = words.length && CB.list.length ? 0 : -1; CB.more = list.length - CB.list.length;
    CB.pick = i => { const it = CB.list[i]; if (!it) return; inp.value = it.label; comboClose(); onPick(it.value, it.label); };
    comboDraw();
  };
  inp.addEventListener('focus', () => { if (!inp.readOnly) open(''); });
  inp.addEventListener('click', () => { if (CB.inp !== inp && !inp.readOnly) open(''); });
  inp.addEventListener('input', () => { onType?.(inp.value); open(inp.value); });
  inp.addEventListener('keydown', e => {
    const isOpen = CB.inp === inp && CB.box;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!isOpen) return open(inp.value);
      CB.idx = Math.max(0, Math.min(CB.list.length - 1, CB.idx + (e.key === 'ArrowDown' ? 1 : -1))); comboDraw(); }
    else if (e.key === 'Enter' && isOpen && CB.idx >= 0) { e.preventDefault(); CB.pick(CB.idx); }
    else if (e.key === 'Tab' && isOpen && CB.idx >= 0 && inp.value.trim()) CB.pick(CB.idx);
    else if (e.key === 'Escape' && isOpen) { e.preventDefault(); comboClose(); }
  });
  inp.addEventListener('change', commit);
  inp.addEventListener('blur', () => setTimeout(() => { if (CB.inp === inp && document.activeElement !== inp) comboClose(); }, 120));
}
function comboDraw() {
  const inp = CB.inp; if (!inp || !inp.isConnected) return comboClose();
  if (!CB.box) { CB.box = document.createElement('div'); CB.box.className = 'cbox'; document.body.appendChild(CB.box);
    CB.box.addEventListener('mousedown', e => { e.preventDefault(); const d = e.target.closest('[data-i]'); if (d) CB.pick(+d.dataset.i); }); }
  const b = inp.getBoundingClientRect();
  CB.box.style.left = (b.left + window.scrollX) + 'px'; CB.box.style.top = (b.bottom + window.scrollY + 2) + 'px'; CB.box.style.minWidth = Math.max(b.width, 260) + 'px';
  CB.box.innerHTML = CB.list.length ? CB.list.map((it, i) => `<div data-i="${i}" class="${i === CB.idx ? 'on' : ''}">${esc(it.label)}${it.note ? `<small>${esc(it.note)}</small>` : ''}</div>`).join('')
    + (CB.more > 0 ? `<div class="none">… ${CB.more} more – keep typing</div>` : '') : `<div class="none">Nothing matches</div>`;
  CB.box.querySelector('.on')?.scrollIntoView({ block: 'nearest' });

/* ---------- Excel-style fill handle (machine and product boxes) ---------- */
const FH = { el: null, src: null, drag: null };
function fillShow(inp) {
  if (!FH.el) { FH.el = document.createElement('div'); FH.el.className = 'fillh'; FH.el.title = 'Drag over the lines below (or above) to copy';
    document.body.appendChild(FH.el); FH.el.addEventListener('pointerdown', fillStart); }
  FH.src = inp;
  const b = (inp.closest('.mf') || inp.closest('td')).getBoundingClientRect();
  FH.el.style.left = (b.right + window.scrollX - 6) + 'px'; FH.el.style.top = (b.bottom + window.scrollY - 6) + 'px'; FH.el.style.display = 'block';
}
function fillHide() { if (FH.el) FH.el.style.display = 'none'; FH.src = null; }
document.addEventListener('focusin', e => { if (FH.el && e.target !== FH.src && !e.target.matches?.('.plantbl input[data-fill]')) fillHide(); });
function fillCells(tr, f) { return $$(`input[data-fill="${f}"]`, tr).map(i => i.closest('.mf') || i.closest('td')); }
function fillStart(e) {
  if (!FH.src || !FH.src.isConnected) return fillHide();
  e.preventDefault(); comboClose();
  const tr = FH.src.closest('tr.prow'), tb = tr.closest('tbody'), f = FH.src.dataset.fill;
  FH.src.dispatchEvent(new Event('change'));          // commit what is typed in the source box first
  FH.drag = { tr, tb, f, targets: [] };
  FH.el.setPointerCapture(e.pointerId);
  const move = ev => {
    if (ev.clientY > innerHeight - 30) scrollBy(0, 18); else if (ev.clientY < 30) scrollBy(0, -18);
    const t = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('tr.prow');
    if (!t || t.parentElement !== tb) return;
    const rows = $$('tr.prow', tb), i0 = rows.indexOf(tr), i1 = rows.indexOf(t);
    $$('.fillsel', tb).forEach(x => x.classList.remove('fillsel'));
    FH.drag.targets = rows.slice(Math.min(i0, i1), Math.max(i0, i1) + 1).filter(x => x !== tr).map(x => ({ tr: x, off: rows.indexOf(x) - i0 }));
    FH.drag.targets.forEach(x => fillCells(x.tr, f).forEach(c => c.classList.add('fillsel')));
  };
  const up = ev => {
    FH.el.removeEventListener('pointermove', move); FH.el.removeEventListener('pointerup', up); FH.el.removeEventListener('pointercancel', up);
    const d = FH.drag; FH.drag = null; $$('.fillsel', tb).forEach(x => x.classList.remove('fillsel'));

  };

}
function fillApply(d, copySame) {
  const src = PL.rows.find(x => x.key === +d.tr.dataset.key), f = d.f;
  let n = 0;
  for (const t of d.targets) {
    const r = PL.rows.find(x => x.key === +t.tr.dataset.key); if (!r) continue; r.text ||= {};
    if (f === 'product') { r.product = src.product; r.text.product = src.text?.product || ''; }
    else {
      const fd = mfields(r).find(x => x.f === f); if (!fd) continue;
      const mc = S.m.machineBy[src[f]];
      if (!mc) { r[f] = ''; r.text[f] = src.text?.[f] || ''; }
      else {
        const list = planMachinesIn(fd.dept); let i = list.findIndex(m => m.code === mc.code); if (i < 0) continue;
        if (!copySame) i += t.off;              // like Excel: Wrapping M/C 16 → 17 → 18 (Ctrl = copy the same machine)
        const m = list[i]; if (!m) continue;
