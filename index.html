/* Lightweight localStorage only for the Apps Script URL + attachment cache */
/* Purchase-invoice and tool-receipt attachments the user adds, replaces or removes
   are remembered as "dirty" so the next save uploads (or deletes) just those.
   Copies downloaded from the server are written with setQuiet and aren't. */
window.ATT_DIRTY_KEY = "garage-att-dirty";
window.isSyncedAttKey = (k) => /^garage-(pinv|toolatt):/.test(String(k));
window.markAttDirty = (k) => {
  try {
    const cur = JSON.parse(localStorage.getItem(window.ATT_DIRTY_KEY) || "[]");
    if (cur.indexOf(k) < 0) { cur.push(k); localStorage.setItem(window.ATT_DIRTY_KEY, JSON.stringify(cur)); }
  } catch (e) {}
};
window.storage = {
  get: async (k) => { const v = localStorage.getItem(k); if (v === null) throw new Error("key not found"); return { key: k, value: v }; },
  set: async (k, v) => { localStorage.setItem(k, v); if (window.isSyncedAttKey(k)) window.markAttDirty(k); return { key: k, value: v }; },
  setQuiet: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; },
  delete: async (k) => { localStorage.removeItem(k); if (window.isSyncedAttKey(k)) window.markAttDirty(k); return { key: k, deleted: true }; },
  list: async (p = "") => ({ keys: Object.keys(localStorage).filter((k) => k.startsWith(p)) }),
};
</script>

async function gsFetch(opts = {}) {
  const url = GS_URL;
  if (!url || url.includes("YOUR_DEPLOYMENT_ID")) throw new Error("Set GS_URL in the HTML file to your Web App URL");
  const method = opts.method || "GET";
  let fullUrl = url;
  if (method === "GET" && opts.query) {
    const q = new URLSearchParams(opts.query).toString();
    fullUrl = url + (url.includes("?") ? "&" : "?") + q;
  }
  const res = await fetch(fullUrl, {
    method,
    headers: method === "POST" ? { "Content-Type": "text/plain;charset=utf-8" } : undefined,
    body: method === "POST" ? JSON.stringify(opts.body || {}) : undefined,
    redirect: "follow",
  });
  if (!res.ok) throw new Error("Network " + res.status);
  const text = await res.text();
  try { return JSON.parse(text); } catch { throw new Error("Invalid JSON from Sheets"); }
}

/** Store downloaded attachments locally without marking them as edits to upload. */
async function storeRemoteAttachments(list) {
  for (const a of list || []) {
    if (a.key && a.dataUrl) {
      try {
        await window.storage.setQuiet(a.key, JSON.stringify({ dataUrl: a.dataUrl, name: a.name, type: a.type, at: a.at }));
      } catch {}
    }
  }
}

/**
 * Load from the server. lite=true skips attachment file contents (used for the
 * 12-second background check) and returns only their fingerprints.
 * Returns { data, attIndex, withAttachments }.
 */
async function gsLoad(lite) {
  const session = getSession();
  if (!session) throw new Error("Not authenticated");
  const requestedAt = Date.now();
  const raw = await gsFetch({ query: lite ? { action: "full", session, lite: "1" } : { action: "full", session } });
  if (raw.error) throw new Error(raw.error);
  const withAttachments = Array.isArray(raw._attachments);
  if (withAttachments) await storeRemoteAttachments(raw._attachments);
  let attIndex = raw._attIndex || null;
  if (!attIndex && withAttachments) {
    attIndex = {};
    raw._attachments.forEach((a) => { if (a.key && a.dataUrl) attIndex[a.key] = attFp(a); });
  }
  delete raw._attachments;
  delete raw._attIndex;
  PhotoSync.setIndex(raw.photoIndex, requestedAt);
  // older backends don't store supplier payments — don't let anyone record one until it's updated
  window.__supplierPaymentsReady = Array.isArray(raw.supplierPayments);
  return { data: prepData(raw), attIndex, withAttachments };
}

/** Apply a full remote payload (from login or full load), including attachments cache. */
async function applyRemotePayload(raw) {
  if (!raw || typeof raw !== "object") return prepData({});
  if (Array.isArray(raw._attachments)) await storeRemoteAttachments(raw._attachments);
  const copy = { ...raw };
  delete copy._attachments;
  delete copy._attIndex;
  return prepData(copy);
}

const attFp = (a) => `${(a && a.name) || ""}|${(a && a.at) || ""}|${((a && a.dataUrl) || "").length}`;
const getAttDirty = () => { try { return JSON.parse(localStorage.getItem(window.ATT_DIRTY_KEY) || "[]"); } catch { return []; } };
const clearAttDirty = (keys) => {
  try {
    const sent = new Set(keys);
    localStorage.setItem(window.ATT_DIRTY_KEY, JSON.stringify(getAttDirty().filter((k) => !sent.has(k))));
  } catch {}
};
/** Attachments added/replaced/removed on this device since the last save. */
const attDelta = () => {
  const up = [], del = [];
  getAttDirty().forEach((k) => {
    let a = null;
    try { a = JSON.parse(localStorage.getItem(k) || "null"); } catch {}
    if (a && a.dataUrl) up.push({ key: k, type: a.type || "image", name: a.name || "", dataUrl: a.dataUrl, at: a.at || Date.now() });

};

/** Send only what changed; the server merges it and returns the merged data. */
async function gsSaveDelta(delta) {

// ---------- sync: send only what changed, merge what others changed ----------
// The app keeps two copies: `data` (what you see, including your unsaved
// edits) and `base` (the last copy confirmed by the server). A save sends the
// difference between them record by record; the server merges it into the
// sheet instead of replacing the sheet. When a fresh server copy arrives, your
// unsaved edits are re-applied on top of it ("rebase"), so neither side's
// work is ever thrown away.
const SYNC_COLS = ["customers", "vehicles", "jobs", "stock", "purchases", "suppliers", "tools", "receipts", "expenses", "supplierPayments"];
const SYNC_SCALARS = ["shop", "laborRate", "vat", "lastBackupAt"];
const SYNC_COUNTERS = ["nextJobNo", "nextPO", "nextInv", "nextStockCode", "nextToolCode", "nextRct", "nextExp"];

const stableStr = (v) => {
  if (v === undefined || v === null) return "null";
  if (typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
  return "{" + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
};

const computeDelta = (base, data) => {
  const d = { v: 1, scalars: {}, counters: {}, cols: {} };
  if (!data) return d;
  SYNC_SCALARS.forEach((k) => {
    if (stableStr(base ? base[k] : undefined) !== stableStr(data[k])) d.scalars[k] = data[k] === undefined ? null : data[k];
  });
  SYNC_COUNTERS.forEach((k) => {
    if (Number(data[k] || 0) > Number((base && base[k]) || 0)) d.counters[k] = Number(data[k] || 0);
  });
  SYNC_COLS.forEach((col) => {
    const bArr = (base && base[col]) || [];
    const dArr = data[col] || [];
    const bMap = new Map();
    const bRec = new Map();
    bArr.forEach((r) => { if (r && r.id != null) { bMap.set(String(r.id), stableStr(r)); bRec.set(String(r.id), r); } });
    // new records placed before every pre-existing one were added at the top
    // of the list (e.g. purchases, costs) — keep them at the top on the server
    let firstOld = -1;
    for (let i = 0; i < dArr.length; i++) { const r = dArr[i]; if (r && r.id != null && bMap.has(String(r.id))) { firstOld = i; break; } }
    const seen = new Set();
    const up = [];
    dArr.forEach((r, i) => {
      if (!r || r.id == null) return;
      const id = String(r.id);
      seen.add(id);
      const prev = bMap.get(id);
      if (prev === undefined) up.push({ ...r, __pos: firstOld >= 0 && i < firstOld ? "start" : "end" });
      else if (prev !== stableStr(r)) {
        // send which fields changed, so two people editing different parts of
        // the same job (say inspection and estimate) don't overwrite each other
        const b = bRec.get(id);
        const fields = [...new Set([...Object.keys(b), ...Object.keys(r)])].filter((k) => stableStr(b[k]) !== stableStr(r[k]));
        up.push({ ...r, __fields: fields });
      }
    });
    const del = [...bMap.keys()].filter((id) => !seen.has(id));
    if (up.length || del.length) d.cols[col] = { up, del };
  });
  return d;
};

const deltaIsEmpty = (d) =>
  !d || (!Object.keys(d.scalars || {}).length && !Object.keys(d.counters || {}).length && !Object.keys(d.cols || {}).length &&
    !(d.att && ((d.att.up || []).length || (d.att.del || []).length)));

// Same merge the server does (minus renumbering) — used to re-apply your
// unsaved edits on top of a fresh server copy.
const applyDelta = (state, d) => {
  const out = { ...state };
  Object.keys(d.scalars || {}).forEach((k) => { out[k] = d.scalars[k]; });
  Object.keys(d.counters || {}).forEach((k) => { out[k] = Math.max(Number(out[k] || 0), Number(d.counters[k] || 0)); });
  Object.keys(d.cols || {}).forEach((col) => {
    const { up = [], del = [] } = d.cols[col];
    const delSet = new Set(del.map(String));
    const arr = (out[col] || []).filter((r) => !(r && delSet.has(String(r.id))));
    const index = new Map(arr.map((r, i) => [String(r.id), i]));
    const starts = [];
    const ends = [];
    up.forEach((u) => {
      if (!u || u.id == null) return;
      const { __pos, __fields, ...rec } = u;
      const id = String(rec.id);
      if (index.has(id)) {
        if (Array.isArray(__fields)) {
          const merged = { ...arr[index.get(id)] };
          __fields.forEach((f) => { if (rec[f] === undefined) delete merged[f]; else merged[f] = rec[f]; });
          arr[index.get(id)] = merged;
        } else arr[index.get(id)] = rec;
      }
      else if (__pos === "start") starts.push(rec);
      else ends.push(rec);
    });
    out[col] = [...starts, ...arr, ...ends];
  });
  return out;
};

const rebaseOnto = (server, base, local) => applyDelta(server, computeDelta(base, local));

// One-time catch-up when this device last ran an older version of the app:
// fields the server lost (an old bug dropped some columns) are filled back in
// from this device's copy, and — if this device had unsaved work — records it
// created that never reached the server are added. Nothing on the server is
// overwritten or deleted.
const recoveryDelta = (server, cached, includeAdditions) => {
  const d = { v: 1, scalars: {}, counters: {}, cols: {} };
  if (!cached) return d;
  SYNC_COLS.forEach((col) => {
    const sMap = new Map((server[col] || []).filter((r) => r && r.id != null).map((r) => [String(r.id), r]));
    const up = [];
    (cached[col] || []).forEach((r) => {
      if (!r || r.id == null) return;
      const s = sMap.get(String(r.id));
      if (!s) { if (includeAdditions) up.push({ ...r }); return; }
      const added = {};
      Object.keys(r).forEach((k) => {
        const v = r[k];
        if (s[k] === undefined && v !== undefined && v !== null && v !== "") added[k] = v;
      });
      if (Object.keys(added).length) up.push({ ...s, ...added, __fields: Object.keys(added) });
    });
    if (up.length) d.cols[col] = { up, del: [] };
  });
  if (includeAdditions) {
    SYNC_COUNTERS.forEach((k) => { if (Number(cached[k] || 0) > Number(server[k] || 0)) d.counters[k] = Number(cached[k]); });
  }
  return d;
};

const passwordPolicy = (pw) => {
  if (!pw || pw.length < 8) return "At least 8 characters";
  if (!/[A-Z]/.test(pw)) return "Need an uppercase letter";
  if (!/[a-z]/.test(pw)) return "Need a lowercase letter";
  if (!/[0-9]/.test(pw)) return "Need a number";
  if (!/[^A-Za-z0-9]/.test(pw)) return "Need a symbol (!@#$%…)";
  return null;
};

const normalizeJob = (j, defRate = 0) => {
  const rawLabour = Array.isArray(j.labour)
    ? j.labour

      ? [{ label: `Labour (${j.laborHours} hr)`, amount: Number(j.laborHours) * Number(j.laborRate ?? defRate) }]
      : [];
  const hasWI = Array.isArray(j.workItems);
  return {
    fixxNo: "", charges: [], observations: "", parts: [], payments: [],
    ...j,
    workItems: hasWI ? j.workItems : rawLabour.filter((l) => l.fromEstimate),
    labour: hasWI ? rawLabour : rawLabour.filter((l) => !l.fromEstimate),
    inspection: {
      odoIn: "", fuel: "", comments: "", notes: "",
      ...(j.inspection || {}),
      items: mergeChecklist(j.inspection?.items),
    },
    estimate: { tasks: [], labourEst: "", signature: null, signedName: "", signedAt: null, signedUpload: null, ...(j.estimate || {}) },
  };
};

// normalize loaded/imported data and assign invoice numbers to previously invoiced jobs
const prepData = (raw) => {
  const d = { ...emptyData, ...raw, suppliers: raw.suppliers || [] };
  let nextInv = d.nextInv || 1;
  const needInv = d.jobs.filter((j) => j.status === "invoiced" && !j.invNo).sort((a, b) => (a.invoicedAt || 0) - (b.invoicedAt || 0));
  if (needInv.length) {
    const order = new Map(needInv.map((j, i) => [j.id, i]));
    d.jobs = d.jobs.map((j) => order.has(j.id) ? { ...j, invNo: nextInv + order.get(j.id) } : j);
    nextInv += needInv.length;
  }
  d.nextInv = nextInv;
  // assign stock codes and master names to items that predate the variant system
  let nsc = d.nextStockCode || 1;
  d.stock = (d.stock || []).map((s) => {
    const master = s.master || s.name || "";
    const code = s.code || stockCodeStr(nsc++);
    return { ...s, master, code };
  });
  d.nextStockCode = nsc;
  d.tools = d.tools || [];
  d.nextToolCode = d.nextToolCode || 1;
  d.vat = d.vat || { enabled: false, rate: 16 };
  // migrate old job-level payments into the customer receipts ledger
  if (!Array.isArray(d.receipts)) {
    const pays = [];
    d.jobs.forEach((jb) => (jb.payments || []).forEach((pp) => pays.push({ jb, pp })));
    pays.sort((a, b) => (a.pp.at || 0) - (b.pp.at || 0));
    let nr = 1;
    d.receipts = pays.map(({ jb, pp }) => ({
      id: pp.id || uid(), rctNo: nr++, customerId: jb.customerId, amount: Number(pp.amount || 0),
      ref: pp.ref || "", at: pp.at || Date.now(), allocations: [{ jobId: jb.id, amount: Number(pp.amount || 0) }], onAccount: 0,
    }));
    d.nextRct = nr;
    d.jobs = d.jobs.map((jb) => ({ ...jb, payments: [] }));
  }
  d.receipts = d.receipts || [];
  d.nextRct = d.nextRct || 1;
  // expenses/payables ledger — new; existing purchases predate paid/unpaid tracking so treat them as settled
  d.expenses = d.expenses || [];
  d.nextExp = d.nextExp || 1;
  d.purchases = (d.purchases || []).map((p) => ({ paid: true, ...p }));
  d.supplierPayments = Array.isArray(d.supplierPayments) ? d.supplierPayments : [];
  return d;
};

// ---------- customer ledger ----------
const rctNoStr = (n) => `Receipt No. - ${String(n).padStart(4, "0")}`;
const todayStr = () => new Date().toISOString().slice(0, 10);
const dayTs = (d) => d ? new Date(d + "T12:00:00").getTime() : Date.now();
const allocationsForJob = (data, jobId) =>
  (data.receipts || []).flatMap((r) => (r.allocations || [])
    .filter((al) => al.jobId === jobId)
    .map((al) => ({ rctNo: r.rctNo, at: r.at, ref: r.ref, amount: al.amount })));
const paidOnJob = (data, jobId) => r2(allocationsForJob(data, jobId).reduce((a, al) => a + al.amount, 0));
const customerBalance = (data, jobTotal, custId) => {
  const cust = data.customers.find((x) => x.id === custId);
  const opening = Number(cust?.openingBalance || 0);
  const debits = data.jobs.filter((jb) => jb.customerId === custId && jb.status === "invoiced")
    .reduce((a, jb) => a + jobTotal(jb).total, 0);
  const credits = (data.receipts || []).filter((r) => r.customerId === custId)
    .reduce((a, r) => a + Number(r.amount || 0), 0);
  return r2(opening + debits - credits);
};
// strict oldest-invoice-first allocation for a new payment
const buildReceipt = (data, jobTotal, customerId, amount, ref, at) => {
  let remaining = r2(Number(amount));
  const allocations = [];
  const invs = data.jobs.filter((jb) => jb.customerId === customerId && jb.status === "invoiced")
    .sort((a, b) => (a.invoicedAt || 0) - (b.invoicedAt || 0));
  for (const jb of invs) {
    if (remaining <= 0) break;
    const owed = r2(jobTotal(jb).total - paidOnJob(data, jb.id));
    if (owed <= 0) continue;
    const take = r2(Math.min(owed, remaining));
    allocations.push({ jobId: jb.id, amount: take });
    remaining = r2(remaining - take);
  }
  return {
    id: uid(), rctNo: data.nextRct || 1, customerId, amount: r2(Number(amount)),
    ref: ref || "", at: at || Date.now(), allocations, onAccount: r2(Math.max(0, remaining)),
  };
};
// when a job is invoiced, apply any on-account deposits (oldest receipts first)
const sweepOnAccount = (d, jobId, jobTotalAmount, customerId) => {
  let remaining = r2(jobTotalAmount - paidOnJob(d, jobId));
  if (remaining <= 0) return d;
  const receipts = (d.receipts || []).map((r) => ({ ...r, allocations: [...(r.allocations || [])] }));
  receipts.filter((r) => r.customerId === customerId && Number(r.onAccount) > 0)
    .sort((a, b) => (a.at || 0) - (b.at || 0))
    .forEach((r) => {
      if (remaining <= 0) return;
      const take = r2(Math.min(Number(r.onAccount), remaining));
      r.allocations.push({ jobId, amount: take });
      r.onAccount = r2(Number(r.onAccount) - take);
      remaining = r2(remaining - take);
    });
  return { ...d, receipts };
};
function receiptHtml(data, jobTotal, r, c) {

${r.ref ? `<tr><td>Reference</td><td class="r">${esc(r.ref)}</td></tr>` : ""}</table>
<h2>ALLOCATED TO</h2><table>${rows}${oa}</table>
<h2>ACCOUNT POSITION AFTER PAYMENT</h2><table><tr class="tot"><td>${balAfter > 0 ? "Balance owing" : balAfter < 0 ? "Customer in credit" : "Account settled"}</td><td class="r">${money(Math.abs(balAfter))}</td></tr></table>
<div class="foot">${esc(data.shop.name)} · Generated ${new Date().toLocaleString()}</div></body></html>`;

function statementHtml(data, jobTotal, c, custId) {
  const events = [];

    events.push({ ts: -1, label: "Balance brought forward (pre-software records)", debit: Math.max(0, Number(c.openingBalance)), credit: Math.max(0, -Number(c.openingBalance)) });

// ---------- file helpers ----------
const readAsDataURL = (file) =>
  new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(new Error("read failed"));
    r.readAsDataURL(file);
  });

const shrinkImage = (dataUrl, maxDim = 1000, quality = 0.62) =>
  new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });

const pickFile = async (file, onOk, onErr) => {
  try {
    if (file.type.startsWith("image/")) {
      const raw = await readAsDataURL(file);
      const small = await shrinkImage(raw, 1400, 0.72);
      onOk({ dataUrl: small, name: file.name, type: "image", at: Date.now() });
    } else if (file.type === "application/pdf") {
      if (file.size > 2 * 1024 * 1024) { onErr("PDF too large (max 2 MB) — send a photo instead."); return; }
      const raw = await readAsDataURL(file);
      onOk({ dataUrl: raw, name: file.name, type: "pdf", at: Date.now() });
    } else onErr("Please upload an image or a PDF.");
  } catch { onErr("Couldn't read that file."); }
};

const downloadDoc = (filename, html) => {
  const pdfName = String(filename || "document").replace(/\.(html?|pdf)$/i, "") + ".pdf";

  let bodyHtml = String(html || "");
  const bodyMatch = bodyHtml.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  if (bodyMatch) bodyHtml = bodyMatch[1];
  const styleMatch = String(html || "").match(/<style[^>]*>([\s\S]*)<\/style>/i);
  const extraCss = styleMatch ? styleMatch[1] : (typeof DOC_CSS !== "undefined" ? DOC_CSS : "");

  const pageCss = `
    @page {
      size: A4;
      margin: 0.4in;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      color: #1e1b16 !important;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .pdf-wrapper {
      width: 98% !important;
      padding: 0 !important;
      background: #ffffff !important;
    }
    table { width: 100% !important; border-collapse: collapse; table-layout: fixed; }
    td, th { word-wrap: break-word; overflow-wrap: anywhere; vertical-align: top; padding: 5px 6px; }
    .r { text-align: right; font-family: Consolas, monospace; }
    img { max-width: 100% !important; height: auto !important; }
    .photos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .photos img { width: 31% !important; max-width: 31% !important; object-fit: cover; }
    h2 { page-break-after: avoid; }
    tr, .hdr, .foot { page-break-inside: avoid; }
    ${extraCss}
  `;

  const fullHtml = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${pdfName}</title><style>${pageCss}</style></head><body><div class="pdf-wrapper">${bodyHtml}</div></body></html>`;

  const exportElementToPdf = (el) => new Promise((resolve, reject) => {
    if (typeof html2pdf === "undefined") {
      reject(new Error("html2pdf missing"));
      return;
    }
    const opt = {
      margin: [0.4, 0.4, 0.6, 0.4],
      filename: pdfName,
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        logging: false,
        backgroundColor: "#ffffff",
        scrollX: 0,
        scrollY: 0
      },
      jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"] },
    };

    html2pdf()
      .set(opt)
      .from(el)
      .toPdf()
      .get('pdf')
      .then((pdf) => {
        const totalPages = pdf.internal.getNumberOfPages();
        for (let i = 1; i <= totalPages; i++) {
          pdf.setPage(i);
          pdf.setFontSize(9);
          pdf.setTextColor(100);
          pdf.text(`Page ${i} of ${totalPages}`, 7.87, 11.2, { align: 'right' });
        }
      })
      .save()
      .then(() => resolve())
      .catch((e) => reject(e));
  });

  const runFromContainer = () => new Promise((resolve, reject) => {
    // FIX: Render on-screen inside active viewport with opacity 0 so html2canvas renders layout properly
    const container = document.createElement("div");
    container.style.cssText = "position:fixed;left:0;top:0;width:794px;background:#ffffff;color:#1e1b16;z-index:-1;opacity:0;pointer-events:none;overflow:visible;";
    
    const styleEl = document.createElement("style");
    styleEl.textContent = pageCss;
    container.appendChild(styleEl);

    const wrap = document.createElement("div");
    wrap.className = "pdf-wrapper";
    wrap.innerHTML = bodyHtml;
    container.appendChild(wrap);
    document.body.appendChild(container);

    const cleanup = () => { try { container.remove(); } catch (_) {} };

    const start = () => {
      exportElementToPdf(wrap)
        .then(() => { cleanup(); resolve(); })
        .catch((e) => { cleanup(); reject(e); });
    };

    const imgs = Array.from(container.querySelectorAll("img"));
    let pending = imgs.filter((img) => !img.complete).length;
    if (pending === 0) setTimeout(start, 150);
    else {
      imgs.forEach((img) => {
        if (img.complete) return;
        img.onload = img.onerror = () => {
          pending -= 1;
          if (pending <= 0) setTimeout(start, 150);
        };
      });
      setTimeout(() => { if (pending > 0) start(); }, 2000);
    }
  });

  const printFallback = () => {
    const w = window.open("", "_blank");
    if (!w) {
      alert("Could not export the document. Please allow pop-ups and try again.");
      return;
    }
    w.document.open();
    w.document.write(fullHtml);
    w.document.close();
    setTimeout(() => {
      try { w.focus(); w.print(); } catch (_) {}
    }, 500);
  };

  runFromContainer().catch((err) => {
    console.error("PDF export failed, using print fallback:", err);
    printFallback();
  });
};


/** Export a live DOM node (e.g. on-screen invoice preview) as a multi-page A4 PDF. */
const downloadElementPdf = (filename, element) => {

      allowTaint: true,

    .from(holder)

      for (let i = 1; i <= totalPages; i++) {

    .save()
    .then(() => { try { holder.remove(); } catch (_) {} })
    .catch((err) => {
      console.error("Element PDF export failed:", err);

      alert("Could not generate PDF. Please try again.");

// ---------- photos: kept in Google Drive by the backend, cached on this device ----------
// Job and tool photos used to live only in the browser of the device that took
// them. Now each photo is uploaded to the garage's Google Drive (through the
// backend) and every device downloads the ones it needs. Uploads wait in a
// queue saved on this device until they succeed, so a dropped connection or a
// closed tab never loses a photo.
const PhotoSync = (() => {
  const MIGRATE_KEY = "garage-photo-migration";
  // small IndexedDB store (falls back to memory if the browser blocks it)
  const mem = { img: new Map(), queue: new Map() };
  let dbp = null;
  const openDb = () => {
    if (!dbp) dbp = new Promise((res) => {
      try {
        const rq = indexedDB.open("garage-photos", 1);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains("img")) db.createObjectStore("img");
          if (!db.objectStoreNames.contains("queue")) db.createObjectStore("queue");
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
        rq.onblocked = () => res(null);
      } catch { res(null); }
    });
    return dbp;
  };
  const run = (db, store, mode, fn) => new Promise((res) => {
    try {
      const tx = db.transaction(store, mode);
      const r = fn(tx.objectStore(store));
      let out;
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => res(undefined);
      tx.onabort = () => res(undefined);
    } catch { res(undefined); }
  });
  const dbGet = async (store, k) => { const db = await openDb(); return db ? run(db, store, "readonly", (s) => s.get(k)) : mem[store].get(k); };
  const dbPut = async (store, k, v) => { const db = await openDb(); if (db) await run(db, store, "readwrite", (s) => s.put(v, k)); else mem[store].set(k, v); };
  const dbDel = async (store, k) => { const db = await openDb(); if (db) await run(db, store, "readwrite", (s) => s.delete(k)); else mem[store].delete(k); };
  const dbAll = async (store) => { const db = await openDb(); return db ? ((await run(db, store, "readonly", (s) => s.getAll())) || []) : [...mem[store].values()]; };

  let index = new Map();      // the server's list: id -> { id, owner, section, at }
  let indexSig = "";
  const queue = new Map();    // waiting to go up/down: id -> { id, op: "up" | "del", owner, section, at }
  const imgs = new Map();     // id -> image (data URL) held in memory
  const loading = new Set();
  const failedLoad = new Map();
  const recent = new Map();   // changes this device just confirmed — a slightly older server list can't undo them
  const listeners = new Set();
  let started = null, working = false, timer = null, backoff = 0, lastError = "";
  const notify = () => listeners.forEach((f) => { try { f(); } catch {} });
  const kick = (delay) => { clearTimeout(timer); timer = setTimeout(work, delay || 0); };

  const queueAdd = (owner, section, p) => {
    imgs.set(p.id, p.dataUrl);
    dbPut("img", p.id, p.dataUrl);
    const e = { id: p.id, op: "up", owner, section: section || "", at: p.at || Date.now() };
    queue.set(p.id, e);
    dbPut("queue", p.id, e);
  };

  // Photos taken before this version were kept only in this browser — queue
  // them for upload. The old copy is removed only once Drive has it.
  const migrateLegacy = () => {
    let map = {};
    try { map = JSON.parse(localStorage.getItem(MIGRATE_KEY) || "{}"); } catch {}
    let changed = false;
    Object.keys(localStorage).forEach((k) => {
      const job = k.match(/^garage-photos:(.+)$/), tool = k.match(/^garage-toolph:(.+)$/);
      if ((!job && !tool) || map[k]) return;
      let v = null;
      try { v = JSON.parse(localStorage.getItem(k) || "null"); } catch {}
      const owner = job ? "job:" + job[1] : "tool:" + tool[1];
      const items = [];
      if (job && v) ["inspection", "work"].forEach((sec) => (v[sec] || []).forEach((p) => items.push({ ...p, section: sec })));
      if (tool && Array.isArray(v)) v.forEach((p) => items.push({ ...p, section: "" }));
      const ids = [];
      items.forEach((p) => { if (p && p.id && p.dataUrl && !queue.has(p.id) && !index.has(p.id)) { ids.push(p.id); queueAdd(owner, p.section, p); } });
      map[k] = ids;
      changed = true;
    });
    if (changed) { try { localStorage.setItem(MIGRATE_KEY, JSON.stringify(map)); } catch {} }
  };
  const finishMigration = () => {
    let map;
    try { map = JSON.parse(localStorage.getItem(MIGRATE_KEY) || "{}"); } catch { return; }
    let changed = false;
    Object.keys(map).forEach((k) => {
      if (!localStorage.getItem(k)) return;
      if ((map[k] || []).every((id) => !queue.has(id))) { try { localStorage.removeItem(k); } catch {} changed = true; }
    });
    if (changed) { try { localStorage.setItem(MIGRATE_KEY, JSON.stringify(map)); } catch {} }
  };

  const work = async () => {
    if (working || !queue.size) return;
    const session = getSession();
    if (!session) return;
    working = true;
    let failed = false;
    try {
      for (const e of [...queue.values()]) {
        if (!queue.has(e.id)) continue;
        if (e.op === "up") {
          const dataUrl = imgs.get(e.id) || (await dbGet("img", e.id));
          if (!dataUrl) { queue.delete(e.id); await dbDel("queue", e.id); continue; }
          const res = await gsFetch({ method: "POST", body: { action: "uploadPhoto", session, photo: { id: e.id, owner: e.owner, section: e.section, at: e.at, dataUrl } } });
          if (res.error) throw new Error(res.error);
          if (!queue.has(e.id) || queue.get(e.id).op !== "up") continue; // removed while uploading — the delete is queued
          if (res.deleted) { index.delete(e.id); recent.set(e.id, { op: "del", t: Date.now() }); }
          else { const p = { id: e.id, owner: e.owner, section: e.section, at: e.at }; index.set(e.id, p); recent.set(e.id, { op: "up", t: Date.now(), p }); }
          queue.delete(e.id);
          await dbDel("queue", e.id);
        } else {
          const res = await gsFetch({ method: "POST", body: { action: "deletePhotos", session, ids: [e.id] } });
          if (res.error) throw new Error(res.error);
          index.delete(e.id);
          recent.set(e.id, { op: "del", t: Date.now() });
          queue.delete(e.id);
          await dbDel("queue", e.id);
          await dbDel("img", e.id);
          imgs.delete(e.id);
        }
        lastError = "";
        finishMigration();
        notify();
      }
      backoff = 0;
    } catch (err) {
      failed = true;
      lastError = String((err && err.message) || err);
      backoff = Math.min(backoff ? backoff * 2 : 5000, 120000);
    } finally {
      working = false;
      notify();
    }
    if (failed) kick(backoff);
    else if (queue.size) kick(0);
  };

  return {
    init() {
      if (started) return started;
      started = (async () => {
        (await dbAll("queue")).forEach((e) => { if (e && e.id && !queue.has(e.id)) queue.set(e.id, e); });
        migrateLegacy();
        notify();
        kick(500);
        setInterval(() => kick(0), 60000);
        window.addEventListener("online", () => kick(0));
      })();
      return started;
    },
    // the server's current list of photos (arrives with every load/save/check);
    // requestedAt = when that request was sent, so a reply that left the server
    // before this device's own latest upload/delete can't undo it
    setIndex(list, requestedAt) {
      if (!Array.isArray(list)) return;
      const next = new Map();
      list.forEach((p) => { if (p && p.id) next.set(String(p.id), { id: String(p.id), owner: String(p.owner || ""), section: String(p.section || ""), at: Number(p.at) || 0 }); });
      const now = Date.now();
      recent.forEach((r, id) => {
        if (now - r.t > 120000) { recent.delete(id); return; }
        if (requestedAt && r.t < requestedAt) return; // the server already knew about it
        if (r.op === "up" && !next.has(id)) next.set(id, r.p);
        if (r.op === "del") next.delete(id);
      });
      const sig = [...next.keys()].sort().join(",");
      index = next;
      finishMigration();
      if (sig !== indexSig) { indexSig = sig; notify(); }
    },
    // photos for one job/tool, by section: [{ id, at, dataUrl (null until downloaded), pending }]
    list(owner) {
      const out = {};
      const seen = new Set();
      index.forEach((p) => {
        if (p.owner !== owner) return;
        const q = queue.get(p.id);
        if (q && q.op === "del") return;
        seen.add(p.id);
        (out[p.section] = out[p.section] || []).push({ id: p.id, at: p.at, dataUrl: imgs.get(p.id) || null, pending: false });
      });
      queue.forEach((q) => {
        if (q.op !== "up" || q.owner !== owner || seen.has(q.id)) return;
        (out[q.section] = out[q.section] || []).push({ id: q.id, at: q.at, dataUrl: imgs.get(q.id) || null, pending: true });
      });
      Object.values(out).forEach((arr) => arr.sort((a, b) => (a.at || 0) - (b.at || 0)));
      return out;
    },
    add(owner, section, photos) {
      photos.forEach((p) => { if (p && p.id && p.dataUrl) queueAdd(owner, section, p); });
      notify();
      kick(300);
    },
    remove(ids) {
      ids.forEach((id) => {
        const q = queue.get(id);
        if (q && q.op === "up" && !index.has(id)) {
          // never reached the server — just forget it
          queue.delete(id); dbDel("queue", id); dbDel("img", id); imgs.delete(id);
        } else {
          const e = { id, op: "del" };
          queue.set(id, e);
          dbPut("queue", id, e);
        }
      });
      notify();
      kick(300);
    },
    removeOwner(owner) {
      const l = this.list(owner);
      this.remove(Object.values(l).flat().map((p) => p.id));
    },
    // download any photos of this job/tool not yet on this device
    ensureLoaded(owner) {
      const need = [];
      Object.values(this.list(owner)).forEach((arr) => arr.forEach((p) => {
        if (!p.dataUrl && !loading.has(p.id) && Date.now() - (failedLoad.get(p.id) || 0) > 30000) need.push(p.id);
      }));
      if (!need.length) return;
      need.forEach((id) => loading.add(id));
      (async () => {
        const remote = [];
        for (const id of need) {
          const d = await dbGet("img", id);
          if (d) imgs.set(id, d); else remote.push(id);
        }
        notify();
        const session = getSession();
        for (let i = 0; i < remote.length && session; i += 4) {
          const batch = remote.slice(i, i + 4);
          try {
            const res = await gsFetch({ query: { action: "photos", session, ids: batch.join(",") } });
            (res.photos || []).forEach((p) => { if (p.dataUrl) { imgs.set(p.id, p.dataUrl); dbPut("img", p.id, p.dataUrl); } });
          } catch {}
          batch.forEach((id) => { if (!imgs.has(id)) failedLoad.set(id, Date.now()); });
          notify();
        }
        need.forEach((id) => loading.delete(id));
      })();
    },
    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    status() { return { pending: [...queue.values()].filter((e) => e.op === "up").length, error: lastError }; },
  };
})();

const usePhotoSync = () => {
  const [, tick] = useState(0);
  useEffect(() => PhotoSync.subscribe(() => tick((x) => x + 1)), []);
};

// Compare the old and new photo lists from a screen and queue the difference.
const photoChanges = (owner, section, cur, next) => {
  const curIds = new Set(cur.map((p) => p.id));
  const nextIds = new Set((next || []).map((p) => p.id));
  const added = (next || []).filter((p) => !curIds.has(p.id) && p.dataUrl);
  const removed = cur.filter((p) => !nextIds.has(p.id)).map((p) => p.id);
  if (added.length) PhotoSync.add(owner, section, added);
  if (removed.length) PhotoSync.remove(removed);
};

// ---------- per-job photos ----------
function usePhotos(jobId) {
  usePhotoSync();
  const owner = "job:" + jobId;
  const l = PhotoSync.list(owner);
  const photos = { inspection: l.inspection || [], work: l.work || [] };
  useEffect(() => { PhotoSync.ensureLoaded(owner); });
  const save = (next) => {
    photoChanges(owner, "inspection", photos.inspection, next.inspection);
    photoChanges(owner, "work", photos.work, next.work);
  };
  return [photos, save];
}

function Btn({ children, onClick, kind = "solid", small, style }) {

    <button onClick={onClick}
      style={{
        background: kind === "solid" ? T.accent : "transparent",
        color: kind === "solid" ? "#181205" : kind === "danger" ? T.danger : T.accent,

      }}>{children}</button>

/** Custom confirm dialog — Yes / NO (native confirm() cannot rename OK/Cancel) */
function ConfirmModal({ open, title, message, onYes, onNo }) {
  if (!open) return null;
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", zIndex: 2000,
      display: "flex", alignItems: "center", justifyContent: "center", padding: 20,
    }} onClick={onNo}>
      <div onClick={(e) => e.stopPropagation()} style={{
        background: T.panel, border: `1px solid ${T.line}`, borderRadius: 10,
        padding: "22px 24px", maxWidth: 400, width: "100%", boxShadow: "0 12px 40px rgba(0,0,0,0.45)",
      }}>
        {title && <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 8 }}>{title}</div>}
        <div style={{ fontSize: 14, color: T.text, lineHeight: 1.45, marginBottom: 20 }}>{message}</div>
        <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
          <button type="button" onClick={onNo} style={{
            background: "transparent", color: T.muted, border: `1px solid ${T.line}`,
            borderRadius: 6, padding: "10px 18px", fontWeight: 800, fontSize: 13,
            fontFamily: T.sans, cursor: "pointer", minWidth: 72,
          }}>NO</button>
          <button type="button" onClick={onYes} style={{
            background: T.danger, color: "#fff", border: "none",
            borderRadius: 6, padding: "10px 18px", fontWeight: 800, fontSize: 13,
            fontFamily: T.sans, cursor: "pointer", minWidth: 72,
          }}>Yes</button>
        </div>
      </div>
    </div>
  );
}
function Label({ children }) {
  return <div style={{ fontSize: 11, letterSpacing: 1.2, color: T.muted, textTransform: "uppercase", margin: "10px 0 4px" }}>{children}</div>;

// ---------- photo grid ----------
function PhotoGrid({ photos, onAdd, onRemove }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const handle = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setBusy(true);
    const added = [];
    for (const f of files) {
      if (!f.type.startsWith("image/")) continue;
      try {
        const raw = await readAsDataURL(f);
        const small = await shrinkImage(raw);
        added.push({ id: uid(), dataUrl: small, at: Date.now() });
      } catch {}
    }
    if (added.length) onAdd(added);
    setBusy(false);
    e.target.value = "";
  };
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6, marginBottom: 8 }}>
        {photos.map((p) => (
          <div key={p.id} style={{ position: "relative" }}>
            {p.dataUrl
              ? <img src={p.dataUrl} alt="" style={{ width: "100%", aspectRatio: "1", objectFit: "cover", borderRadius: 6, border: `1px solid ${T.line}`, display: "block" }} />
              : <div style={{ width: "100%", aspectRatio: "1", borderRadius: 6, border: `1px solid ${T.line}`, background: T.panel2, display: "flex", alignItems: "center", justifyContent: "center", color: T.muted, fontSize: 11 }}>loading…</div>}
            {p.pending && <div title="Waiting to upload" style={{ position: "absolute", bottom: 4, left: 4, background: "rgba(0,0,0,0.65)", color: T.accent, borderRadius: 4, padding: "1px 5px", fontSize: 10, fontWeight: 800 }}>⇡</div>}
            <button onClick={() => onRemove(p.id)}
              style={{ position: "absolute", top: 4, right: 4, background: "rgba(0,0,0,0.65)", color: T.danger, border: "none", borderRadius: 4, width: 22, height: 22, fontWeight: 900, cursor: "pointer", lineHeight: "20px" }}>✕</button>
          </div>
        ))}
      </div>
      <input ref={inputRef} type="file" accept="image/*" multiple style={{ display: "none" }} onChange={handle} />
      <Btn small kind="ghost" onClick={() => inputRef.current?.click()}>{busy ? "Processing…" : "+ Add photos"}</Btn>
      {(() => {
        const st = PhotoSync.status();
        if (!st.pending) return null;
        const setup = /permission|DriveApp|not set up/i.test(st.error);
        return (
          <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
            ⇡ {st.pending} photo{st.pending > 1 ? "s" : ""} waiting to upload{setup ? " — photo storage isn't switched on in the backend yet; they're kept on this device until it is" : st.error ? " — will retry automatically" : "…"}
          </div>
        );
      })()}
    </div>
  );
}

// ---------- signature pad ----------
function SignaturePad({ onSave }) {
  const ref = useRef(null);
  const drawing = useRef(false);
  const dirty = useRef(false);
  const fill = () => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#f5f1e6"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.strokeStyle = "#1c2733"; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  };
  useEffect(() => { fill(); }, []);
  const pos = (e) => {
    const c = ref.current, r = c.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * c.width) / r.width, y: ((e.clientY - r.top) * c.height) / r.height };
  };
  const down = (e) => {
    e.preventDefault();
    const c = ref.current, ctx = c.getContext("2d"), p = pos(e);
    drawing.current = true; dirty.current = true;
    c.setPointerCapture(e.pointerId);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = ref.current.getContext("2d"), p = pos(e);
    ctx.lineTo(p.x, p.y); ctx.stroke();
  };
  const up = () => { drawing.current = false; };
  return (
    <div>
      <canvas ref={ref} width={600} height={200}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerLeave={up}
        style={{ width: "100%", height: 120, borderRadius: 8, border: `2px dashed ${T.accent}`, touchAction: "none", display: "block" }} />
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <Btn small kind="ghost" onClick={() => { fill(); dirty.current = false; }}>Clear</Btn>
        <Btn small onClick={() => { if (dirty.current) onSave(ref.current.toDataURL("image/png")); }}>Accept signature</Btn>
      </div>
    </div>
  );
}

function MiniPie({ segments, size = 120 }) {
  const total = segments.reduce((a, s) => a + Math.max(0, Number(s.value) || 0), 0) || 1;
  let angle = -90;
  const paths = segments.map((s, i) => {
    const v = Math.max(0, Number(s.value) || 0);
    const sweep = (v / total) * 360;
    const start = angle;
    angle += sweep;
    const r = size / 2 - 4;
    const cx = size / 2, cy = size / 2;
    const rad = (d) => (d * Math.PI) / 180;
    const x1 = cx + r * Math.cos(rad(start));
    const y1 = cy + r * Math.sin(rad(start));
    const x2 = cx + r * Math.cos(rad(start + sweep));
    const y2 = cy + r * Math.sin(rad(start + sweep));
    const large = sweep > 180 ? 1 : 0;
    if (v <= 0 || sweep < 0.01) return null;
    if (Math.abs(sweep - 360) < 0.1) {
      return <circle key={i} cx={cx} cy={cy} r={r} fill={s.color} />;
    }
    return (
      <path key={i} d={`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`} fill={s.color} />
    );
  });
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={size/2 - 4} fill={T.panel2} />
      {paths}
      <circle cx={size/2} cy={size/2} r={size * 0.28} fill={T.panel} />
    </svg>
  );
}

        <StatCard label="Invoiced jobs" value={invoicedCount} sub="All time" color={T.ok} />
        <StatCard label="Outstanding" value={money(outstanding)} sub={credit > 0 ? `Credits ${money(credit)}` : "Customer balances"} color={outstanding > 0 ? T.danger : T.ok} />

function JobsList({ data, jobTotal, openJob, openNew }) {
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const jobs = Array.isArray(data?.jobs) ? data.jobs : [];
  const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
  const customers = Array.isArray(data?.customers) ? data.customers : [];
  const matchJob = (j) => {
    if (!query) return true;
    try {
      const v = vehicles.find((x) => x.id === j.vehicleId);
      const c = customers.find((x) => x.id === j.customerId);
      const hay = [
        String(j.jobNo ?? ""),
        j.invNo ? invNoStr(j.invNo) : "",
        String(j.invNo ?? ""),
        j.fixxNo || "",
        j.title || "",
        c?.name || "",
        v?.rego || "",
        v?.make || "",
        v?.model || "",
      ].join(" ").toLowerCase();
      return hay.includes(query);
    } catch (_) {
      return false;
    }
  };
  const filtered = jobs.filter(matchJob);
  const renderJobCard = (j) => {
    const v = vehicles.find((x) => x.id === j.vehicleId);
    const c = customers.find((x) => x.id === j.customerId);
    const s = STATUSES.find((x) => x.id === j.status) || STATUSES[0];
    let totalStr = "0.00";
    try { totalStr = money(jobTotal(j).total); } catch (_) {}
    return (
      <Card key={j.id} onClick={() => openJob(j.id)} style={{ borderLeft: `4px solid ${s.color}` }}>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700 }}>
            #{j.jobNo}{j.fixxNo ? <span style={{ color: T.muted, fontSize: 11 }}> · FIXX {j.fixxNo}</span> : null}
          </span>
          <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>{totalStr}</span>
        </div>
        <div style={{ fontWeight: 700, margin: "3px 0" }}>{j.title}</div>
        <div style={{ color: T.muted, fontSize: 13 }}>
          {c?.name}{v ? ` · ${v.make} ${v.model}${v.rego ? " · " + v.rego : ""}` : ""}{j.createdAt ? ` · ${dateStr(j.createdAt)}` : ""}
        </div>
      </Card>
    );
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14, alignItems: "center" }}>
        <input
          style={{ ...inpS, marginBottom: 0, flex: 1, minWidth: 0 }}
          placeholder="Search job no, FIXX WO, customer, registration…"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        <Btn onClick={openNew} style={{ whiteSpace: "nowrap", flexShrink: 0 }}>+ New job card</Btn>
      </div>
      {query ? (
        <div>
          <div style={{ fontSize: 11, letterSpacing: 1.5, color: T.muted, fontWeight: 800, marginBottom: 6 }}>RESULTS · {filtered.length}</div>
          {filtered.map((j) => renderJobCard(j))}
          {!filtered.length && (
            <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>
              No jobs match &quot;{q}&quot;
            </div>
          )}
        </div>
      ) : (
        <div>
          {STATUSES.map((s) => {
            const list = jobs.filter((j) => j.status === s.id);
            if (!list.length) return null;
            return (
              <div key={s.id} style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 11, letterSpacing: 1.5, color: s.color, fontWeight: 800, marginBottom: 6 }}>{s.label} · {list.length}</div>
                {list.map((j) => renderJobCard(j))}
              </div>
            );
          })}
          {!jobs.length && <div style={{ color: T.muted, textAlign: "center", padding: 30 }}>No jobs yet — open your first job card above.</div>}
        </div>
      )}
    </div>
  );
}

      {cats.map((cat) => (
        <div key={cat}>
          <div style={{ fontSize: 11, letterSpacing: 1.5, color: T.accent, fontWeight: 800, margin: "12px 0 2px" }}>{cat.toUpperCase()}</div>
          {ins.items.map((it, i) => it.cat !== cat ? null : (
            <div key={i} style={{ borderBottom: `1px dashed ${T.line}`, padding: "8px 0" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 14, flex: 1 }}>{it.name}</span>
                <div style={{ display: "flex", gap: 4 }}>
                  {CHECK_STATES.map((s) => (
                    <button key={s.id}
                      onClick={() => setIns({ items: ins.items.map((x, xi) => xi === i ? { ...x, status: s.id } : x) })}
                      style={{
                        background: it.status === s.id ? s.color : T.panel2, color: it.status === s.id ? "#15130e" : T.muted,
                        border: `1px solid ${T.line}`, borderRadius: 4, padding: "4px 8px", fontSize: 10, fontWeight: 800, cursor: "pointer",
                      }}>{s.label}</button>
                  ))}
                </div>
              </div>
              {it.status === "attn" && (
                <input style={{ ...inpS, marginTop: 6, marginBottom: 0 }} placeholder="e.g. Dent RH rear door; chip in windscreen driver side…"
                  value={it.note} onChange={(e) => setIns({ items: ins.items.map((x, xi) => xi === i ? { ...x, note: e.target.value } : x) })} />
              )}
            </div>
          ))}
        </div>
      ))}
      <Label>General inspection notes</Label>
      <textarea style={{ ...inpS, resize: "vertical" }} rows={2} value={ins.notes} onChange={(e) => setIns({ notes: e.target.value })} />
      <Label>Inspection photos</Label>
      <PhotoGrid photos={photos.inspection}
        onAdd={(added) => savePhotos({ ...photos, inspection: [...photos.inspection, ...added] })}
        onRemove={(id) => savePhotos({ ...photos, inspection: photos.inspection.filter((p) => p.id !== id) })} />
    </div>
  );
}

// ---------- estimate section ----------
function EstimateSection({ data, j, c, v, update }) {
  const est = j.estimate;
  const [desc, setDesc] = useState("");
  const [amt, setAmt] = useState("");
  const [bulk, setBulk] = useState("");
  const [name, setName] = useState(est.signedName || "");
  const [upErr, setUpErr] = useState("");
  const fileRef = useRef(null);
  const setEst = (patch) => update({ estimate: { ...est, ...patch } });
  const locked = !!(est.signature || est.signedUpload);
  const approvedTotal = est.tasks.filter((t) => t.approved).reduce((a, t) => a + Number(t.amount || 0), 0) + Number(est.labourEst || 0);

  // on signing: approved repair items go to the job card as work items; flat labour estimate becomes one labour line
  const applyApproved = (estPatch) => {
    const approvedItems = est.tasks.filter((t) => t.approved).map((t) => ({ label: t.desc, amount: Number(t.amount || 0), fromEstimate: true }));
    const manualItems = (j.workItems || []).filter((l) => !l.fromEstimate);
    const manualLabour = (j.labour || []).filter((l) => !l.fromEstimate);
    const le = Number(est.labourEst || 0);
    update({
      estimate: { ...est, ...estPatch },
      workItems: [...manualItems, ...approvedItems],
      labour: [...manualLabour, ...(le > 0 ? [{ label: "Labour (flat rate, as estimated)", amount: le, fromEstimate: true }] : [])],
    });
  };

     const custName = c?.name || "Customer"; 
     const jobNum = j.jobNo;

  const onFile = (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setUpErr("");
    pickFile(f, (att) => applyApproved({ signedUpload: att }), setUpErr);
  };

  return (
    <div>
      <Btn small kind="ghost" style={{ marginBottom: 4 }}
        onClick={() => downloadDoc(`${custName} ~ Job#${jobNum} - estimate.pdf`, docShell(data, "ESTIMATE", j, secCustomer(j, c, v) + secEstimate(j, data.vat)))}>
        ⬇ Download estimate (PDF)
      </Btn>
      <Label>Repair items (parts estimate) — tick what the customer approves</Label>
      {est.tasks.map((t, i) => (
        <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px dashed ${T.line}` }}>
          <div onClick={() => !locked && setEst({ tasks: est.tasks.map((x, xi) => xi === i ? { ...x, approved: !x.approved } : x) })}
            style={{
              width: 24, height: 24, borderRadius: 5, flexShrink: 0, cursor: locked ? "default" : "pointer",
              border: `2px solid ${t.approved ? T.ok : T.line}`, background: t.approved ? T.ok : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center", color: "#15130e", fontWeight: 900,
            }}>{t.approved ? "✓" : ""}</div>
          <div style={{ flex: 1, fontSize: 14, textDecoration: t.approved ? "none" : "line-through", color: t.approved ? T.text : T.muted }}>{t.desc}</div>
          <div style={{ fontFamily: T.mono, fontSize: 14 }}>{money(t.amount)}</div>
          {!locked && (
            <button onClick={() => setEst({ tasks: est.tasks.filter((_, xi) => xi !== i) })}
              style={{ background: "none", border: "none", color: T.danger, cursor: "pointer", fontWeight: 700 }}>✕</button>
          )}
        </div>
      ))}
      {!locked && (
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <input style={{ ...inpS, marginBottom: 0, flex: 2 }} placeholder="Task e.g. Replace front brake pads & skim discs" value={desc} onChange={(e) => setDesc(e.target.value)} />
          <input style={{ ...inpS, marginBottom: 0, width: 90 }} type="number" placeholder="Amount" value={amt} onChange={(e) => setAmt(e.target.value)} />
          <Btn small onClick={() => {
            if (!desc) return;
            setEst({ tasks: [...est.tasks, { id: uid(), desc, amount: Number(amt || 0), approved: true }] });
            setDesc(""); setAmt("");
          }}>Add</Btn>
        </div>
      )}
      {!locked && (
        <div style={{ marginTop: 10 }}>
          <Label>Bulk add — one task per line, amount at the end</Label>
          <textarea style={{ ...inpS, resize: "vertical", fontFamily: T.mono, fontSize: 13 }} rows={4}
            placeholder={"Replace front brake pads - 8500\nInjection pump R&R and re-time - 15000\nReplace all CV boots - 6000"}
            value={bulk} onChange={(e) => setBulk(e.target.value)} />
          <Btn small kind="ghost" onClick={() => {
            const tasks = bulk.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
              const m = l.match(/^(.*?)[\s\-–—:]*([\d][\d,]*(?:\.\d+)?)\s*$/);
              if (m && m[1].trim()) return { id: uid(), desc: m[1].trim().replace(/[\-–—:,\s]+$/, ""), amount: Number(m[2].replace(/,/g, "")) || 0, approved: true };
              return { id: uid(), desc: l, amount: 0, approved: true };
            });
            if (tasks.length) setEst({ tasks: [...est.tasks, ...tasks] });
            setBulk("");
          }}>＋ Add all lines as tasks</Btn>
        </div>
      )}
      <div style={{ textAlign: "right", fontFamily: T.mono, color: T.accent, fontWeight: 700, marginTop: 10 }}>
        APPROVED TOTAL {money(approvedTotal)}
      </div>
      {data.vat?.enabled && (
        <div style={{ textAlign: "right", fontFamily: T.mono, fontSize: 12, color: T.muted }}>
          + VAT {Number(data.vat.rate || 16)}% = {money(r2(approvedTotal * (1 + Number(data.vat.rate || 16) / 100)))} incl.
        </div>
      )}

      <Label>Flat-rate labour estimate — one line for the whole job</Label>
      {locked
        ? <div style={{ fontFamily: T.mono, fontSize: 14, padding: "4px 0" }}>Labour: {money(est.labourEst || 0)}</div>
        : <input style={inpS} type="number" placeholder="e.g. 23000" value={est.labourEst ?? ""} onChange={(e) => setEst({ labourEst: e.target.value })} />}

      <Label>Customer authorisation</Label>
      {est.signature && (
        <div>
          <img src={est.signature} alt="signature" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
          <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>
            Signed on screen by <b style={{ color: T.text }}>{est.signedName}</b> on {dateTimeStr(est.signedAt)}
          </div>
          <Btn small kind="danger" style={{ marginTop: 8 }} onClick={() => setEst({ signature: null, signedName: "", signedAt: null })}>Void signature (re-estimate)</Btn>
        </div>
      )}
      {!est.signature && est.signedUpload && (
        <div>
          {est.signedUpload.type === "image"
            ? <img src={est.signedUpload.dataUrl} alt="signed estimate" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
            : <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, fontFamily: T.mono, fontSize: 13 }}>📄 {est.signedUpload.name}</div>}
          <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>Signed copy received {dateStr(est.signedUpload.at)}</div>
          <Btn small kind="danger" style={{ marginTop: 8 }} onClick={() => setEst({ signedUpload: null })}>Remove signed copy</Btn>
        </div>
      )}
      {!locked && (
        <div>
          <div style={{ fontSize: 12, color: T.muted, marginBottom: 6 }}>
            Sign on screen now, or download the estimate above, send it to the customer, and upload the signed copy when it comes back. On signing, all approved tasks are added to the job card automatically.
          </div>
          <input style={inpS} placeholder="Customer name (as signing)" value={name} onChange={(e) => setName(e.target.value)} />
          <SignaturePad onSave={(sig) => { if (!name) return; applyApproved({ signature: sig, signedName: name, signedAt: Date.now() }); }} />
          {!name && <div style={{ fontSize: 12, color: T.danger, marginTop: 4 }}>Enter customer name before accepting signature.</div>}
          <div style={{ margin: "12px 0 4px", fontSize: 11, letterSpacing: 1.2, color: T.muted, textTransform: "uppercase" }}>— or —</div>
          <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{ display: "none" }} onChange={onFile} />
          <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>⬆ Upload signed estimate (photo or PDF)</Btn>
          {upErr && <div style={{ fontSize: 12, color: T.danger, marginTop: 4 }}>{upErr}</div>}
        </div>
      )}
    </div>
  );
}

	

// ---------- work section ----------
function WorkSection({ data, j, c, v, update, save, jobTotal, back, photos, savePhotos }) {
  const [stockId, setStockId] = useState("");
  const [qty, setQty] = useState("1");
  const [price, setPrice] = useState("");
  const [costView, setCostView] = useState({ type: "list" });
  const t = jobTotal(j);
  const available = data.stock.filter((s) => s.qty > 0);
  const selStock = data.stock.find((s) => s.id === stockId);
   
   const custName = c?.name || "Customer"; 
   const jobNum = j.jobNo;
	
  const addPart = () => {
    if (!selStock) return;
    const q = r2(Math.min(Number(qty || 0), selStock.qty));
    if (q <= 0) return;
    const p = price === "" ? selStock.cost : Number(price);
    save({
      ...data,
      stock: data.stock.map((s) => (s.id === stockId ? { ...s, qty: r2(s.qty - q) } : s)),
      jobs: data.jobs.map((x) => x.id === j.id ? { ...x, parts: [...(x.parts || []), { stockId, name: selStock.name, uom: selStock.uom || "", qty: q, price: p }] } : x),
    });
    setStockId(""); setQty("1"); setPrice("");
  };
  const removePart = (i) => {
    const p = j.parts[i];
    save({
      ...data,
      stock: data.stock.map((s) => (s.id === p.stockId ? { ...s, qty: r2(s.qty + p.qty) } : s)),
      jobs: data.jobs.map((x) => x.id === j.id ? { ...x, parts: x.parts.filter((_, idx) => idx !== i) } : x),
    });
  };
  const [payAmt, setPayAmt] = useState("");
  const [payRef, setPayRef] = useState("");
  const [payDate, setPayDate] = useState(todayStr());
  const deleteJob = () => {
    const restored = data.stock.map((s) => {
      const back2 = (j.parts || []).filter((p) => p.stockId === s.id).reduce((a, p) => a + p.qty, 0);
      return back2 ? { ...s, qty: r2(s.qty + back2) } : s;
    });
    PhotoSync.removeOwner("job:" + j.id);
    window.storage.delete(`garage-photos:${j.id}`).catch(() => {});
    // unlink (don't delete) any costs logged against this job — the spend still happened
    const expenses = data.expenses.map((e) => e.jobId === j.id ? { ...e, jobId: null } : e);
    save({ ...data, stock: restored, jobs: data.jobs.filter((x) => x.id !== j.id), expenses });
    back();
  };
  const markInvoiced = () => {
    const invNo = j.invNo || data.nextInv;
    let next = {
      ...data,
      nextInv: j.invNo ? data.nextInv : data.nextInv + 1,
      jobs: data.jobs.map((x) => x.id === j.id
        ? { ...normalizeJob(x, data.laborRate), status: "invoiced", invoicedAt: Date.now(), completedAt: x.completedAt || Date.now(), invNo, vatRate: x.vatRate !== undefined ? x.vatRate : (data.vat?.enabled ? Number(data.vat.rate || 16) : 0) }
        : x),
    };
    next = sweepOnAccount(next, j.id, t.total, j.customerId);
    save(next);
  };

  return (
    <div>
      <Btn small kind="ghost" style={{ marginBottom: 4 }}
        onClick={() => downloadDoc(`${custName} ~ Job#${jobNum} - Jobcard.pdf`, docShell(data, "JOB CARD / SERVICE REPORT", j, secCustomer(j, c, v) + secWork(j, photos) + secInvoice(j, t, allocationsForJob(data, j.id))))}>
        ⬇ Download job card / service report (PDF)
      </Btn>
      <Label>Status</Label>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {STATUSES.map((s) => (
          <button key={s.id} onClick={() => s.id === "invoiced" ? markInvoiced() : update({
            status: s.id,
            ...(s.id === "done" ? { completedAt: j.completedAt || Date.now() } : {}),
          })}
            style={{
              background: j.status === s.id ? s.color : T.panel2, color: j.status === s.id ? "#15130e" : T.muted,
              border: `1px solid ${T.line}`, borderRadius: 4, padding: "6px 10px", fontSize: 11, fontWeight: 800, cursor: "pointer",
            }}>{s.label}</button>
        ))}
      </div>

      <Label>FIXX work order no.</Label>
      <input style={inpS} placeholder="FIXX WO number (labour allocation)" value={j.fixxNo} onChange={(e) => update({ fixxNo: e.target.value })} />

      <Label>Work summary / notes</Label>
      <textarea style={{ ...inpS, resize: "vertical" }} rows={4} value={j.description || ""} onChange={(e) => update({ description: e.target.value })} />

      <Label>Observations (advisories for the customer)</Label>
      <textarea style={{ ...inpS, resize: "vertical" }} rows={3} placeholder="e.g. Rear tyres near limit; recommend replacement within 2,000 km"
        value={j.observations} onChange={(e) => update({ observations: e.target.value })} />

      <Label>Service report photos</Label>
      <PhotoGrid photos={photos.work}
        onAdd={(added) => savePhotos({ ...photos, work: [...photos.work, ...added] })}
        onRemove={(id) => savePhotos({ ...photos, work: photos.work.filter((p) => p.id !== id) })} />

      {(() => {
        const wi = j.workItems || [];
        const doneN = wi.filter((x) => x.done).length;
        return (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
            <Label>Approved repairs / tasks — tick as completed{wi.length ? ` (${doneN}/${wi.length} done)` : ""}</Label>
            {wi.length > 0 && (
              <Btn small kind="ghost" onClick={() => downloadDoc(`JOB${j.jobNo}-tasksheet.pdf`, taskSheetHtml(data, j))}>⬇ Task sheet (PDF)</Btn>
            )}
          </div>
        );
      })()}
      <LineItems checkable items={j.workItems || []} onChange={(workItems) => update({ workItems })}
        placeholder="e.g. Vacuum pump repair" />

      <Label>Labour (flat rate)</Label>
      <LineItems items={j.labour || []} onChange={(labour) => update({ labour })}
        placeholder="e.g. Labour — engine out & refit" />

      <Label>Parts used (from stock)</Label>
      {(j.parts || []).map((p, i) => (
        <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px dashed ${T.line}`, fontSize: 14 }}>
          <span>{p.qty}{p.uom ? ` ${p.uom} ` : "× "}{p.name}</span>
          <span style={{ fontFamily: T.mono }}>
            {money(p.price * p.qty)}
            <button onClick={() => removePart(i)} style={{ marginLeft: 10, background: "none", border: "none", color: T.danger, cursor: "pointer", fontWeight: 700 }}>✕</button>
          </span>
        </div>
      ))}
      {available.length === 0 && <div style={{ color: T.muted, fontSize: 13, marginTop: 6 }}>No parts in stock — record a purchase first.</div>}
      {available.length > 0 && (
        <div style={{ marginTop: 8 }}>
          <select style={selS} value={stockId} onChange={(e) => { setStockId(e.target.value); setPrice(""); }}>
            <option value="">Select part from stock…</option>
            {available.map((s) => <option key={s.id} value={s.id}>{s.code ? `[${s.code}] ` : ""}{s.name} ({s.qty}{s.uom ? ` ${s.uom}` : ""} in stock)</option>)}
          </select>
          {selStock && (
            <div style={{ display: "flex", gap: 6 }}>
              <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" max={selStock.qty} value={qty} onChange={(e) => setQty(e.target.value)} placeholder={`Qty${selStock.uom ? ` (${selStock.uom})` : ""}`} />
              <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" value={price} onChange={(e) => setPrice(e.target.value)} placeholder={`Price/${selStock.uom || "unit"} (${money(selStock.cost)})`} />
              <Btn small onClick={addPart}>Add</Btn>
            </div>
          )}
        </div>
      )}

      <Label>Other charges — the label you type prints on the invoice</Label>
      <LineItems items={j.charges || []} onChange={(charges) => update({ charges })}
        placeholder="e.g. Transport fee / Consumables / Towing" />

      <div style={{ marginTop: 16, borderTop: `2px solid ${T.line}`, paddingTop: 10, fontFamily: T.mono, fontSize: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", color: T.muted }}><span>Repairs (parts est.)</span><span>{money(t.work)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", color: T.muted }}><span>Labour</span><span>{money(t.labor)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", color: T.muted }}><span>Parts (from stock)</span><span>{money(t.parts)}</span></div>
        <div style={{ display: "flex", justifyContent: "space-between", color: T.muted }}><span>Other charges</span><span>{money(t.charges)}</span></div>
        {t.vatRate > 0 && (<>
          <div style={{ display: "flex", justifyContent: "space-between", color: T.text, borderTop: `1px solid ${T.line}`, marginTop: 4, paddingTop: 4 }}><span>SUBTOTAL</span><span>{money(t.subtotal)}</span></div>
          <div style={{ display: "flex", justifyContent: "space-between", color: T.muted }}><span>VAT {t.vatRate}%</span><span>{money(t.vat)}</span></div>
        </>)}
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 18, color: T.accent, fontWeight: 700, marginTop: 4 }}><span>TOTAL</span><span>{money(t.total)}</span></div>
      </div>

      {(() => {
        if (costView.type === "form") {
          return (
            <div style={{ marginTop: 16 }}>
              <ExpenseForm data={data} save={save} expId={costView.id} jobId={j.id} back={() => setCostView({ type: "list" })} />
            </div>
          );
        }
        const jobExpenses = data.expenses.filter((e) => e.jobId === j.id);
        const jobExpenseTotal = r2(jobExpenses.reduce((a, e) => a + expenseAmount(e), 0));
        const partsCostBasis = r2((j.parts || []).reduce((a, p) => a + Number(p.qty || 0) * partCost(data, p), 0));
        const margin = r2(t.subtotal - partsCostBasis - jobExpenseTotal);
        return (
          <div style={{ marginTop: 16, background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12 }}>
            <div style={{ fontSize: 11, letterSpacing: 1.2, color: T.muted, textTransform: "uppercase", marginBottom: 8 }}>Costs — what this job cost you (not shown to the customer)</div>
            <ExpensesList data={data} save={save} jobId={j.id}
              openAdd={() => setCostView({ type: "form", id: null })}
              openEdit={(id) => setCostView({ type: "form", id })} />
            <div style={{ display: "flex", justifyContent: "space-between", fontFamily: T.mono, fontSize: 13, marginTop: 10, paddingTop: 8, borderTop: `1px dashed ${T.line}` }}>
              <span style={{ color: T.muted }}>Margin (revenue − parts cost − costs, excl. VAT)</span>
              <span style={{ color: margin < 0 ? T.danger : T.ok, fontWeight: 700 }}>{money(margin)}</span>
            </div>
            {margin < 0 && <div style={{ fontSize: 11, color: T.danger, marginTop: 4, fontWeight: 700 }}>⚠ Billing below cost on this job</div>}
          </div>
        );
      })()}

      {j.customerId && (() => {
        const bal = customerBalance(data, jobTotal, j.customerId);
        const paidHere = paidOnJob(data, j.id);
        const cRcts = (data.receipts || []).filter((r) => r.customerId === j.customerId);
        const onAcc = r2(cRcts.reduce((a, r) => a + Number(r.onAccount || 0), 0));
        const addPay = () => {
          const a = Number(payAmt || 0);
          if (a <= 0) return;
          const rec = buildReceipt(data, jobTotal, j.customerId, a, payRef, dayTs(payDate));
          save({ ...data, nextRct: (data.nextRct || 1) + 1, receipts: [...(data.receipts || []), rec] });
          setPayAmt(""); setPayRef(""); setPayDate(todayStr());
        };
        return (
          <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, marginTop: 14 }}>
            <div style={{ fontSize: 11, letterSpacing: 1.2, color: T.muted, textTransform: "uppercase", marginBottom: 4 }}>Payments — customer account</div>
            <div style={{ fontFamily: T.mono, fontSize: 13 }}>
              {paidHere > 0 && <div>Allocated to this job: {money(paidHere)}</div>}
              {onAcc > 0 && <div style={{ color: T.ok }}>On account (deposit): {money(onAcc)}{j.status !== "invoiced" ? " — applies when this job is invoiced" : ""}</div>}
              <div style={{ color: bal > 0 ? T.danger : T.ok }}>
                Customer {bal > 0 ? `owes ${money(bal)}` : bal < 0 ? `in credit ${money(-bal)}` : "settled"} overall
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
              <input style={{ ...inpS, marginBottom: 0, width: 140, flex: "0 0 auto" }} type="date" title="Date money was received" value={payDate} onChange={(e) => setPayDate(e.target.value)} />
              <input style={{ ...inpS, marginBottom: 0, flex: 1 }} type="number" step="any" min="0" placeholder="Amount" value={payAmt} onChange={(e) => setPayAmt(e.target.value)} />
              <input style={{ ...inpS, marginBottom: 0, flex: 1.4 }} placeholder="Reference" value={payRef} onChange={(e) => setPayRef(e.target.value)} />
              <Btn small onClick={addPay}>Receive</Btn>
            </div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
              Issues a numbered receipt. Money received before invoicing sits on account as a deposit and applies automatically at invoicing; receipts are listed on the customer's page.
            </div>
          </div>
        );
      })()}

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        {j.status !== "invoiced" && <Btn onClick={markInvoiced}>Mark invoiced</Btn>}
        <Btn kind="danger" small onClick={deleteJob}>Delete job</Btn>
      </div>
    </div>
  );
}

function NewJob({ data, save, done, cancel }) {
  const [custId, setCustId] = useState("");
  const [custName, setCustName] = useState("");
  const [custPhone, setCustPhone] = useState("");
  const [vehId, setVehId] = useState("");
  const [vMake, setVMake] = useState("");
  const [vModel, setVModel] = useState("");
  const [vYear, setVYear] = useState("");
  const [vRego, setVRego] = useState("");
  const [vChassis, setVChassis] = useState("");
  const [vEngine, setVEngine] = useState("");
  const [title, setTitle] = useState("");
  const [fixx, setFixx] = useState("");
  const cust = data.customers.find((x) => x.id === custId);
  const custVehicles = data.vehicles.filter((v) => v.customerId === custId);

  const createJob = () => {
    let cid = custId, next = { ...data };
    if (!cid) {
      if (!custName) return;
      cid = uid();
      next.customers = [...next.customers, { id: cid, name: custName, phone: custPhone, email: "", address: "", createdAt: Date.now() }];
    }
    let vid = vehId;
    if (!vid) {
      if (!vMake && !vModel) return;
      vid = uid();
      next.vehicles = [...next.vehicles, { id: vid, customerId: cid, make: vMake, model: vModel, year: vYear, rego: vRego, chassis: vChassis, engineModel: vEngine, createdAt: Date.now() }];
    }
    const job = normalizeJob({
      id: uid(), jobNo: next.nextJobNo, customerId: cid, vehicleId: vid,
      title: title || "General work", fixxNo: fixx, status: "booked", createdAt: Date.now(),
    });
    next.nextJobNo += 1;
    next.jobs = [job, ...next.jobs];
    save(next);
    done(job.id);
  };

  return (
    <div>
      <Btn kind="ghost" small onClick={cancel}>← Cancel</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700, fontSize: 16 }}>NEW JOB CARD #{data.nextJobNo}</div>
        <Label>Customer — pick from database or add new</Label>
        <select style={selS} value={custId} onChange={(e) => { setCustId(e.target.value); setVehId(""); }}>
          <option value="">+ New customer</option>
          {data.customers.map((c) => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` — ${c.phone}` : ""}</option>)}
        </select>
        {cust && (
          <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 6, padding: 10, fontSize: 13, color: T.muted, marginBottom: 8 }}>
            {cust.name}{cust.phone ? ` · ${cust.phone}` : ""}{cust.email ? ` · ${cust.email}` : ""}{cust.address ? ` · ${cust.address}` : ""}
          </div>
        )}
        {!custId && (<>
          <input style={inpS} placeholder="Customer name" value={custName} onChange={(e) => setCustName(e.target.value)} />
          <input style={inpS} placeholder="+254" value={custPhone} onChange={(e) => setCustPhone(sanitizePhone(e.target.value))} />
        </>)}
        <Label>Vehicle</Label>
        {custId && custVehicles.length > 0 && (
          <select style={selS} value={vehId} onChange={(e) => setVehId(e.target.value)}>
            <option value="">+ New vehicle</option>
            {custVehicles.map((v) => <option key={v.id} value={v.id}>{v.year} {v.make} {v.model} {v.rego}</option>)}
          </select>
        )}
        {!vehId && (<>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={inpS} placeholder="Make" value={vMake} onChange={(e) => setVMake(e.target.value)} />
            <input style={inpS} placeholder="Model" value={vModel} onChange={(e) => setVModel(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={inpS} placeholder="Year" value={vYear} onChange={(e) => setVYear(e.target.value)} />
            <input style={inpS} placeholder="Vehicle registration" value={vRego} onChange={(e) => setVRego(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={inpS} placeholder="Chassis no. (VIN)" value={vChassis} onChange={(e) => setVChassis(e.target.value)} />
            <input style={inpS} placeholder="Engine model" value={vEngine} onChange={(e) => setVEngine(e.target.value)} />
          </div>
        </>)}
        <Label>Job description</Label>
        <input style={inpS} placeholder="e.g. Injection pump timing + service" value={title} onChange={(e) => setTitle(e.target.value)} />
        <Label>FIXX work order no. (optional)</Label>
        <input style={inpS} placeholder="FIXX WO number" value={fixx} onChange={(e) => setFixx(e.target.value)} />
        
	<div style={{ display: "flex", justifyContent: "center", width: "100%" }}>
 	 <Btn onClick={createJob} style={{ marginTop: 10, width: "auto" }}>
  	  Open job card
  	</Btn>
	</div>

      </Card>
    </div>
  );
}

        <div style={{ display: "flex", gap: 6 }}>

	</div>

    </div>
  );

function CustomersList({ data, openCustomer, openNew }) {
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const customers = Array.isArray(data?.customers) ? data.customers : [];
  const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
  const jobs = Array.isArray(data?.jobs) ? data.jobs : [];
  const filtered = !query ? customers : customers.filter((c) => {
    try {
      const vehs = vehicles.filter((v) => v.customerId === c.id);
      const hay = [c.name, c.phone, c.email, c.address, c.invoiceName, c.kraPin, ...vehs.map((v) => `${v.make || ""} ${v.model || ""} ${v.rego || ""}`)].join(" ").toLowerCase();
      return hay.includes(query);
    } catch (_) {
      return false;
    }
  });
  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14, alignItems: "center" }}>
        <input
          style={{ ...inpS, marginBottom: 0, flex: 1, minWidth: 0 }}
          placeholder="Search customer name, phone, vehicle…"
          value={q}
          onChange={(e) => setQ(e.target.value)}
        />
        <Btn onClick={openNew} style={{ whiteSpace: "nowrap", flexShrink: 0 }}>+ Add customer</Btn>
      </div>
      {!customers.length && <div style={{ color: T.muted, textAlign: "center", padding: 30 }}>No customers yet.</div>}
      {query && !filtered.length && (
        <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>
          No customers match &quot;{q}&quot;
        </div>
      )}
      {filtered.map((c) => {
        const vehs = vehicles.filter((v) => v.customerId === c.id);
        const cjobs = jobs.filter((j) => j.customerId === c.id);
        return (
          <Card key={c.id} onClick={() => openCustomer(c.id)}>
            <div style={{ fontWeight: 700 }}>{c.name}</div>
            <div style={{ color: T.muted, fontSize: 13 }}>{c.phone} · {vehs.length} vehicle{vehs.length !== 1 ? "s" : ""} · {cjobs.length} job{cjobs.length !== 1 ? "s" : ""}</div>
          </Card>
        );
      })}
    </div>
  );
}


function CustomerDetail({ data, save, custId, back, openJob, openEdit, jobTotal, canEditVehicles }) {
  const [vMake, setVMake] = useState("");
