<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSL Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d2321; --muted:#5f6763; --line:#dcd9d1; --line2:#ebe8e1;
  --brand:#0f5c4d; --brand-ink:#ffffff; --brand-soft:#e3efeb;
  --good:#1d7a45; --good-bg:#e4f3e9; --warn:#a15c00; --warn-bg:#fdf1dc; --bad:#b3261e; --bad-bg:#fbe6e4;
  --focus:#2b6fd6; --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top bar */
.livebox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:var(--good-bg);border:1px solid #b9dcc6;border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(29,122,69,.5);animation:livepulse 2s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(29,122,69,.5)}70%{box-shadow:0 0 0 8px rgba(29,122,69,0)}100%{box-shadow:0 0 0 0 rgba(29,122,69,0)}}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink)}
.bar{display:flex;align-items:center;gap:16px;padding:0 16px;height:52px;max-width:1500px;margin:0 auto}
.logo{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.logo span{opacity:.7;font-weight:500}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{color:var(--brand-ink);text-decoration:none;padding:8px 12px;border-radius:8px;white-space:nowrap;opacity:.85;font-weight:500}
nav a:hover{background:rgba(255,255,255,.12);opacity:1}
nav a.active{background:rgba(255,255,255,.2);opacity:1}
.who{font-size:13px;white-space:nowrap;display:flex;gap:10px;align-items:center}
.who button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}

main{max-width:1500px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;min-height:42px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#bdb9ae}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0b4a3e}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--bad-bg)}
.hint{background:var(--brand-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:14px}

/* login */
.login{max-width:380px;margin:9vh auto;}
.login h1{font-size:22px;margin-bottom:4px}
.login form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.msg{padding:10px 12px;border-radius:8px;font-size:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)}
.msg.ok{background:var(--good-bg);color:var(--good)}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.toast{background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14px}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--good)}

/* shift entry cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column}
.card-h{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-h h3{font-size:16px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line2);color:var(--muted);font-weight:500}
.tag.done{background:var(--good-bg);color:var(--good)}
.tag.todo{background:var(--warn-bg);color:var(--warn)}
.card-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.plan{font-size:13px;color:var(--muted);background:#faf9f6;border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
.plan b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.existing{font-size:13px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.existing .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stops{display:flex;flex-direction:column;gap:6px}
.stoprow{display:grid;grid-template-columns:1fr 92px 32px;gap:6px;align-items:center}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.card-f{padding:10px 14px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:8px;margin-top:auto}
details.more{margin-top:14px}
details.more summary{cursor:pointer;font-weight:600;padding:8px 0}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#f7f6f2;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;z-index:2;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:#f0eee8;font-weight:700}
tr.tot td{background:var(--brand-soft);font-weight:700}
td.first,th.first{position:sticky;left:0;background:inherit;z-index:1}
th.first{z-index:3;background:#f7f6f2}
tbody tr:not(.grp):not(.tot) td.first{background:#fff}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.a{background:var(--warn-bg);color:var(--warn)}
.pill.r{background:var(--bad-bg);color:var(--bad)}
.flag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:5px;margin-right:4px;background:var(--bad-bg);color:var(--bad);font-weight:600}
.flag.w{background:var(--warn-bg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}

/* OEE table: two-line headings, Actual output outlined */
table.oee th{white-space:normal;vertical-align:bottom;line-height:1.25;hyphens:manual}
table.oee th.n{min-width:64px}
table.oee .act{border-left:2px solid var(--brand);border-right:2px solid var(--brand)}
table.oee th.act{border-top:2px solid var(--brand);color:var(--brand)}
table.oee tbody tr:last-child td.act{border-bottom:2px solid var(--brand)}
table.oee td.act{background:#f6faf8}
table.oee tr.grp td.act{background:#e9efe9}
table.oee button.tog{border:0;background:transparent;cursor:pointer;width:22px;padding:0;margin-right:4px;color:var(--brand);font-size:13px;line-height:1}
table.oee button.tog:hover{background:var(--brand-soft);border-radius:4px}
table.oee .tog-sp{display:inline-block;width:26px}
table.oee tr.sub td{background:#fbfaf7;font-size:12.5px;color:#3c4441}
table.oee tbody tr.sub td.first{background:#fbfaf7;padding-left:36px}
table.oee tr.sub td.act{background:#f2f7f4}
table.oee .pname{display:inline-block;max-width:250px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
table.oee .pplan{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}

/* planning board */
.plantbl td.n,.plantbl td.u{padding:6px 9px;color:var(--muted)}
.plantbl td.e{color:var(--ink);font-weight:600}
.plantbl td.ro{padding:7px 9px}
.plantbl td.ua.neg{color:var(--bad);font-weight:700;background:var(--bad-bg)}
.plantbl td select{border:0;border-radius:0;min-height:34px;padding:6px 8px;background:transparent}
.plantbl td input.auto{color:var(--muted);font-style:italic}
.plantbl td[data-k=hrs] input,.plantbl td[data-k=co] input,.plantbl td[data-k=out] input{text-align:right;padding-right:16px}
.plantbl tr.padd td{padding:4px 6px;background:#fcfbf8}

/* bulk grid */
.gridtbl td{padding:0;border-right:1px solid var(--line2)}
.gridtbl td input,.gridtbl td select{border:0;border-radius:0;min-height:34px;padding:6px 8px;background:transparent}
.gridtbl td input:focus,.gridtbl td select:focus{outline:2px solid var(--focus);outline-offset:-2px;background:#f3f7ff}
.gridtbl td.num{width:44px;text-align:center;color:var(--muted);font-size:12px;background:#faf9f6}
.gridtbl tr.err td{background:var(--bad-bg)}
.gridtbl tr.saved td{background:var(--good-bg)}
.gridtbl td.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.gridtbl td.bad input{color:var(--bad);font-weight:600}
.gerrs{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:10px;max-height:150px;overflow:auto}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

@media (max-width:640px){
  main{padding:12px}
  .bar{gap:8px;padding:0 10px}
  .logo span{display:none}
  .who .email,.who #roleTxt{display:none}
  .cards{grid-template-columns:1fr}
  .toolbar .field{flex:1 1 140px}
  .grid3{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="bar">
    <div class="logo">KSL <span>Production</span></div>
    <nav id="nav"></nav>
    <div class="who"><span id="whoami"></span><button id="logout">Log out</button></div>
  </div>
</header>

<main id="app"></main>
<div id="toast"></div>

<script>
/* =========================================================
   KSL Production App – test version (Sept 2026 data)
   Settings: Supabase project URL + publishable key (safe to
   be in this file – the database security rules protect data)
   ========================================================= */
const CONFIG = {
  url: 'https://qlapyxgjvnuwndpveevv.supabase.co',
  key: 'sb_publishable_TC96gXY35Ko2eTLpnkl04g_JUF9AoNQ',
  testHint: 'Test data loaded: 1–29 September 2026'
};
if (window.KSL_TEST_CONFIG) Object.assign(CONFIG, window.KSL_TEST_CONFIG);

const sb = supabase.createClient(CONFIG.url, CONFIG.key, CONFIG.clientOptions || {});
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? '' : Number(n).toLocaleString('en-GB', {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = n => n == null || isNaN(n) ? '' : (n * 100).toFixed(1) + '%';
const num = v => { if (v === '' || v == null) return null; const x = Number(String(v).replace(/,/g, '')); return isNaN(x) ? NaN : x; };
const todayISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
// The shift running now (Kenya time). A Night shift belongs to the date it STARTED, so between
// 00:00 and 07:30 the running shift is the previous day's Night shift. Day 07:30–18:30, Night 18:30–07:30.
function currentShift() {
  const k = new Date(Date.now() + 3 * 3600e3), m = k.getUTCHours() * 60 + k.getUTCMinutes(), d = k.toISOString().slice(0, 10);
  if (m >= 450 && m < 1110) return { date: d, shift: 'Day' };
  if (m >= 1110) return { date: d, shift: 'Night' };
  const y = new Date(k); y.setUTCDate(y.getUTCDate() - 1); return { date: y.toISOString().slice(0, 10), shift: 'Night' };
}

const S = { user: null, profile: null, m: null, view: null, ctx: { date: null, shift: null, section: null } };

function toast(text, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = text;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3500);
}
function fail(error, what) { console.error(what, error); toast(`${what}: ${error.message || error}`, 'err'); }

/* ---------- minutes: accepts 45, 1:30, 1h30 ---------- */
function parseMinutes(v) {
  v = String(v || '').trim().toLowerCase(); if (!v) return null;
  let m = v.match(/^(\d+)\s*[:h]\s*(\d{1,2})\s*m?$/); if (m) return +m[1] * 60 + +m[2];
  m = v.match(/^(\d+)\s*h$/); if (m) return +m[1] * 60;
  m = v.match(/^(\d+)\s*m?$/); if (m) return +m[1];
  return NaN;
}
const hhmm = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;

/* ---------- roles ---------- */
//   clerk        – Bulk entry only; corrects own entries and Mobile data clerks' entries
//   mobile_clerk – Bulk entry only; corrects own entries only
//   supervisor   – Shift supervisor: Planning (full), OEE (view); no output/stoppage entry
//   manager      – OEE and Planning, view only
//   planner      – Planning + reports;  admin – everything
// The database (10_roles_and_groups.sql) enforces the same rules.
const CAN = {
  entry: r => r === 'admin',
  bulk: r => ['clerk', 'mobile_clerk', 'admin'].includes(r),
  planView: r => ['supervisor', 'planner', 'manager', 'admin'].includes(r),
  plan: r => ['supervisor', 'planner', 'admin'].includes(r),
  oee: r => ['supervisor', 'planner', 'manager', 'admin'].includes(r),
  stops: r => ['planner', 'admin'].includes(r),
  users: r => r === 'admin',
};
const ROLE_LABEL = { pending: 'Pending (no access)', supervisor: 'Shift supervisor', clerk: 'Clerk', mobile_clerk: 'Mobile data clerk',
  planner: 'Planner', manager: 'Manager', admin: 'Admin' };
const VIEWS = [
  { id: 'entry', label: 'Shift entry', can: CAN.entry, render: renderEntry },
  { id: 'bulk', label: 'Bulk entry', can: CAN.bulk, render: renderBulk },
  { id: 'plan', label: 'Planning', can: CAN.planView, render: renderPlan },
  { id: 'oee', label: 'OEE', can: CAN.oee, render: renderOEE },
  { id: 'stops', label: 'Stoppages', can: CAN.stops, render: renderStops },
  { id: 'users', label: 'Users', can: CAN.users, render: renderUsers },
];
// Whose entries this person may correct/delete (null = anyone). Loaded at login from the database.
const canEditEntry = r => S.editable === null || (S.editable || []).includes(r.entered_by);

/* ---------- master data ---------- */
async function loadMasters() {
  const q = (t, sel = '*', order) => { let x = sb.from(t).select(sel); if (order) x = x.order(order); return x.limit(5000); };
  const [mc, pr, em, rs, gr, sh, po] = await Promise.all([
    q('machines', '*', 'name'), q('products', 'item_code,description,uom,nett_weight,purchasing_factor,packing_factor,stage,active', 'description'),
    q('employees', 'staff_id,name,department,active', 'name'), q('stoppage_reasons', '*', 'sort_order'),
    q('machine_groups', '*', 'sort_order'), q('shifts', '*', 'sort_order'), q('positions', 'code,name,machine_code,section'),
  ]);
  for (const r of [mc, pr, em, rs, gr, sh, po]) if (r.error) throw r.error;
  const m = { machines: mc.data, products: pr.data.filter(p => p.active), employees: em.data.filter(e => e.active),
    reasons: rs.data, groups: gr.data, shifts: sh.data, positions: po.data };
  m.machineBy = Object.fromEntries(m.machines.map(x => [x.code, x]));
  m.machineByName = Object.fromEntries(m.machines.map(x => [x.name.toUpperCase(), x]));
  m.productBy = Object.fromEntries(pr.data.map(x => [x.item_code, x]));
  m.empBy = Object.fromEntries(em.data.map(x => [x.staff_id, x]));
  m.reasonBy = Object.fromEntries(m.reasons.map(x => [x.code, x]));
  m.groupBy = Object.fromEntries(m.groups.map(x => [x.code, x]));
  m.posBy = Object.fromEntries(m.positions.map(x => [x.code, x]));
  m.sections = [...new Set(m.machines.filter(x => x.active).map(x => x.department))].sort((a, b) => sectionRank(a) - sectionRank(b) || a.localeCompare(b));
  S.m = m;
}
const SECTION_ORDER = ['Cooking', 'Forming', 'Cooling', 'Wrapping', 'White Mint', 'Packaging', 'Manual', 'Scrap', 'Vehicles/Generators'];
const sectionRank = s => { const i = SECTION_ORDER.indexOf(s); return i < 0 ? 50 : i; };
const productLabel = p => p ? `${p.item_code} — ${p.description}` : '';
const empLabel = e => e ? `${e.name} (${e.staff_id})` : '';
function productFromLabel(v) { v = String(v || '').trim(); if (!v) return null; const code = v.split(' — ')[0].trim().toUpperCase();
  if (S.m.productBy[code]) return code; const hit = S.m.products.find(p => p.description.toUpperCase() === v.toUpperCase()); return hit ? hit.item_code : undefined; }
function empFromLabel(v) { v = String(v || '').trim(); if (!v) return null; const m = v.match(/\(([^)]+)\)\s*$/);
  if (m && S.m.empBy[m[1]]) return m[1]; if (S.m.empBy[v.toUpperCase()]) return v.toUpperCase();
  const hit = S.m.employees.filter(e => e.name.toUpperCase() === v.toUpperCase()); return hit.length === 1 ? hit[0].staff_id : undefined; }
function machineFromLabel(v) { v = String(v || '').trim().toUpperCase(); if (!v) return null; if (S.m.machineBy[v]) return v;
  const h = S.m.machineByName[v]; return h ? h.code : undefined; }
/* ---------- which products each section may use ----------
   Product stage (COOKED / WRAPPED / PACKED / OTHER) is set on each product.
   Sections not listed here (Vehicles/Generators) have no product. */
const STAGES_BY_SECTION = {
  Cooking: ['COOKED'], Forming: ['COOKED'], Cooling: ['COOKED'], Scrap: ['COOKED'],
  Wrapping: ['WRAPPED'],
  Packaging: ['PACKED'], 'White Mint': ['PACKED'], Manual: ['PACKED', 'OTHER'],
};
const stagesFor = mc => mc ? STAGES_BY_SECTION[mc.department] || null : null;     // null = no product needed
const needsProduct = mc => !!stagesFor(mc);
const stageWord = st => st.map(s => s.toLowerCase()).join(' / ');
function productListId(mc) {        // datalist with only the products this machine may use
  const st = stagesFor(mc); if (!st) return '';
  const id = 'dl-prod-' + st.join('-');
  if (!$('#' + id)) { const d = document.createElement('datalist'); d.id = id;
    d.innerHTML = S.m.products.filter(p => st.includes(p.stage)).map(p => `<option value="${esc(productLabel(p))}">`).join(''); document.body.appendChild(d); }
  return id;
}
function productStageError(mc, code) {   // '' if fine, else a message
  const st = stagesFor(mc), p = S.m.productBy[code];
  if (!st || !p || st.includes(p.stage)) return '';
  return `${p.description} is a ${String(p.stage || 'unclassified').toLowerCase()} product – ${mc.name} only takes ${stageWord(st)} products.`;
}
function ensureDatalists() {
  if ($('#dl-products')) return;
  const mk = (id, items) => { const d = document.createElement('datalist'); d.id = id; d.innerHTML = items.map(v => `<option value="${esc(v)}">`).join(''); document.body.appendChild(d); };
  mk('dl-products', S.m.products.map(productLabel));
  mk('dl-employees', S.m.employees.map(empLabel));
  mk('dl-machines', S.m.machines.filter(x => x.active).map(x => x.name));

async function start() {
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') renderLogin(); });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();

}
function renderLogin(message) {
  $('#hdr').classList.add('hidden');
  $('#app').innerHTML = `
  <div class="login panel">
    <h1>KSL Production</h1>
    <div class="muted small">Output, scrap, stoppages and OEE</div>

      <div id="loginMsg">${message ? `<div class="msg err">${esc(message)}</div>` : ''}</div>
      <button class="btn primary" type="submit">Log in</button>

  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true; btn.textContent = 'Logging in…';

async function afterLogin(user) {
  S.user = user;
  const { data, error } = await sb.from('profiles').select('*').eq('user_id', user.id).maybeSingle();
  if (error) return renderLogin('Could not read your profile: ' + error.message);
  S.profile = data;
  if (!data || data.role === 'pending' || !data.active) {
    $('#hdr').classList.add('hidden');
    $('#app').innerHTML = `<div class="login panel"><h1>Waiting for access</h1>
      <p>You're logged in as <b>${esc(user.email)}</b>, but an admin hasn't given you a role yet.</p>
      <p class="muted small">Ask the admin to open <b>Users</b> and set your role.</p>
      <button class="btn" id="lo2">Log out</button></div>`;
    $('#lo2').onclick = () => sb.auth.signOut();
    return;
  }
  try { await loadMasters(); } catch (e) { return renderLogin('Could not load master data: ' + e.message); }
  { const { data: ed, error: ee } = await sb.rpc('my_editable_users');
    S.editable = ee ? (data.role === 'admin' ? null : [user.id]) : ed; }     // fallback if 10_roles_and_groups.sql not run yet
  ensureDatalists();
  $('#hdr').classList.remove('hidden');
  $('#whoami').innerHTML = `<span class="email">${esc(data.full_name || user.email)} · </span><span id="roleTxt">${esc(ROLE_LABEL[data.role] || data.role)}</span>`;
  $('#logout').onclick = () => sb.auth.signOut();
  window.onhashchange = route;
  route();
}
function route() {
  const role = S.profile.role;
  const allowed = VIEWS.filter(v => v.can(role));
  let id = location.hash.slice(1);
  if (!allowed.find(v => v.id === id)) id = allowed[0].id;
  $('#nav').innerHTML = allowed.map(v => `<a href="#${v.id}" class="${v.id === id ? 'active' : ''}">${v.label}</a>`).join('');
  S.view = id;
  if (!S.ctx.date) { const c = currentShift(); S.ctx.date = c.date; S.ctx.shift = c.shift; }
  allowed.find(v => v.id === id).render();
}

async function renderEntry() {

async function loadEntry() {
  const { date, shift, section } = S.ctx;
  const machines = S.m.machines.filter(x => x.active && x.department === section);
  const codes = machines.map(x => x.code);
  const body = $('#entryBody'); body.innerHTML = `<div class="muted">Loading…</div>`;
  const [pl, out, st, mp] = await Promise.all([
    sb.from('plan_lines').select('*').eq('plan_date', date).eq('shift', shift).in('machine_code', codes),
    sb.from('output_entries').select('*').eq('prod_date', date).eq('shift', shift).in('machine_code', codes).order('id'),
    sb.from('stoppages').select('*').eq('stop_date', date).eq('shift', shift).in('machine_code', codes).order('id'),
    sb.from('manpower_allocations').select('position_code,staff_id').eq('alloc_date', date).eq('shift', shift),
  ]);
  for (const r of [pl, out, st, mp]) if (r.error) return fail(r.error, 'Loading shift');
  const by = (rows, k = 'machine_code') => rows.reduce((a, r) => ((a[r[k]] ||= []).push(r), a), {});
  const P = by(pl.data), O = by(out.data), T = by(st.data);
  const opByMachine = {};
  for (const a of mp.data) { const pos = S.m.posBy[a.position_code]; if (pos && pos.machine_code) (opByMachine[pos.machine_code] ||= []).push(a.staff_id); }
  const active = machines.filter(x => P[x.code] || O[x.code] || T[x.code]);
  const others = machines.filter(x => !active.includes(x));
  S.entry = { P, O, T, opByMachine };
  body.innerHTML = `
    ${active.length ? '' : `<div class="panel muted">Nothing planned or entered for ${esc(section)} on ${esc(date)} ${esc(shift)} shift. Add a machine below.</div>`}
    <div class="cards" id="cards">${active.map(machineCard).join('')}</div>
    ${others.length ? `<div class="toolbar" style="margin-top:14px">
      <div class="field" style="min-width:260px"><label for="addM">Add a machine that isn't on the plan</label>
      <select id="addM"><option value="">Choose machine…</option>${others.map(x => `<option value="${x.code}">${esc(x.name)}</option>`).join('')}</select></div>
      <button class="btn" id="addMBtn">Add</button></div>` : ''}`;
  $$('.card', body).forEach(bindCard);
  if ($('#addMBtn')) $('#addMBtn').onclick = () => {
    const c = $('#addM').value; if (!c) return;
    $('#cards').insertAdjacentHTML('beforeend', machineCard(S.m.machineBy[c]));
    bindCard($('#cards').lastElementChild); $(`#addM option[value="${c}"]`).remove();
    $('#cards').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
}
function machineCard(mc) {

  const plans = P[mc.code] || [], outs = O[mc.code] || [], stops = T[mc.code] || [];
  const expected = plans.reduce((s, p) => s + (+p.expected_output || 0), 0);
  const actual = outs.reduce((s, o) => s + +o.qty, 0);
  const planned = plans.find(p => p.product_code);
  const op = (opByMachine[mc.code] || [])[0];
  const canDel = canEditEntry;
  return `<div class="card" data-m="${mc.code}" data-expected="${expected}" data-actual="${actual}">
    <div class="card-h"><div><h3>${esc(mc.name)}</h3><div class="muted small">${esc(mc.group_code || mc.department)} · ${esc(mc.unit || '')}</div></div>

      ${plans.length ? `<div class="plan">${plans.map(p => `Plan: <b>${esc(S.m.productBy[p.product_code]?.description || '—')}</b> · ${fmt(p.planned_hrs, 1)} h · planned ${fmt(p.planned_output)} · expected ${fmt(p.expected_output)} ${esc(p.unit || '')}`).join('<br>')}</div>` : ''}
      ${outs.length || stops.length ? `<div class="existing">
        ${outs.map(o => `<div class="row"><span><b>${fmt(o.qty, 1)} ${esc(o.unit)}</b> ${esc(S.m.productBy[o.product_code]?.description || '')}${o.sweet_scrap_kg ? ` · sweet scrap ${fmt(o.sweet_scrap_kg, 1)}` : ''}${o.material_scrap_kg ? ` · material scrap ${fmt(o.material_scrap_kg, 2)}` : ''}${o.operator_id ? ` · ${esc(S.m.empBy[o.operator_id]?.name || o.operator_id)}` : ''}</span>${canDel(o) ? `<button class="x" title="Delete this entry" data-del="output_entries" data-id="${o.id}">×</button>` : ''}</div>`).join('')}
        ${stops.map(s => `<div class="row"><span>⏸ ${esc(S.m.reasonBy[s.reason_code]?.name)} · <b>${hhmm(s.minutes)}</b></span>${canDel(s) ? `<button class="x" title="Delete this stoppage" data-del="stoppages" data-id="${s.id}">×</button>` : ''}</div>`).join('')}
        ${expected ? `<div class="muted">Total so far: ${fmt(actual, 1)} of ${fmt(expected)} expected (${pct(actual / expected)})</div>` : ''}
      </div>` : ''}
      ${needsProduct(mc) ? `<div class="field"><label>Product <span style="text-transform:none;font-weight:500">(${stageWord(stagesFor(mc))} only)</span></label><input class="f-prod" list="${productListId(mc)}" placeholder="Type code or name" value="${esc(outs.length ? '' : productLabel(S.m.productBy[planned?.product_code]))}"></div>` : ''}
      <div class="grid3">
        <div class="field"><label>Output (${esc(mc.unit || '')})</label><input class="f-qty" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Sweet scrap kg</label><input class="f-ss" inputmode="decimal" placeholder="0"></div>
        <div class="field"><label>Material scrap kg</label><input class="f-ms" inputmode="decimal" placeholder="0"></div>
      </div>
      <div class="field"><label>Operator</label><input class="f-op" list="dl-employees" placeholder="Type name" value="${esc(outs.length ? '' : empLabel(S.m.empBy[op]))}"></div>
      <div class="field"><label>Comments</label><input class="f-cm" placeholder="Optional"></div>
      <div><label class="small muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.04em">Stoppages</label>
        <div class="stops"></div>
        <button class="btn sm ghost f-addstop" type="button" style="margin-top:6px">+ Add stoppage</button></div>
      <div class="warnbox hidden"></div>
    </div>
    <div class="card-f"><button class="btn primary f-save">Save</button></div>

function stopRowHTML() {
  return `<div class="stoprow"><select class="s-r">${S.m.reasons.map(r => `<option value="${r.code}">${esc(r.name)}</option>`).join('')}</select>
    <input class="s-m" placeholder="min or h:mm" inputmode="numeric"><button class="x" type="button" title="Remove">×</button></div>`;
}
function bindCard(card) {
  const mc = S.m.machineBy[card.dataset.m];
  $('.f-addstop', card).onclick = () => { $('.stops', card).insertAdjacentHTML('beforeend', stopRowHTML()); const r = $('.stops', card).lastElementChild; $('.x', r).onclick = () => r.remove(); $('.s-m', r).focus(); };
  $$('[data-del]', card).forEach(b => b.onclick = async () => {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Delete?'; b.style.fontSize = '12px'; setTimeout(() => { b.dataset.confirm = ''; b.textContent = '×'; b.style.fontSize = ''; }, 3000); return; }
    const { error } = await sb.from(b.dataset.del).delete().eq('id', b.dataset.id);
    if (error) return fail(error, 'Delete'); toast('Deleted'); loadEntry();
  });
  ['input', 'change'].forEach(ev => card.addEventListener(ev, () => { const s = $('.f-save', card); if (s.dataset.force) { delete s.dataset.force; s.textContent = 'Save'; s.classList.replace('warn', 'primary'); $('.warnbox', card).classList.add('hidden'); } }));
  $('.f-save', card).onclick = async () => {
    const btn = $('.f-save', card), warn = $('.warnbox', card);
    const qty = num($('.f-qty', card).value), ss = num($('.f-ss', card).value), ms = num($('.f-ms', card).value);
    const prod = $('.f-prod', card) ? productFromLabel($('.f-prod', card).value) : null, op = empFromLabel($('.f-op', card).value);
    const stops = $$('.stoprow', card).map(r => ({ reason_code: $('.s-r', r).value, minutes: parseMinutes($('.s-m', r).value), el: r }));
    const errs = [];
    if (qty === null && (ss || ms)) errs.push('Enter the output as well as the scrap.');
    if ([qty, ss, ms].some(v => Number.isNaN(v) || v < 0)) errs.push('Output and scrap must be numbers (0 or more).');
    if (qty !== null && prod === undefined) errs.push('Product not recognised – pick it from the list.');
    if (qty !== null && !prod && needsProduct(mc)) errs.push('Choose the product.');
    if (qty !== null && prod) { const se = productStageError(mc, prod); if (se) errs.push(se); }
    if (op === undefined) errs.push('Operator not recognised – pick from the list or leave blank.');
    for (const s of stops) if (s.minutes === null || Number.isNaN(s.minutes) || s.minutes <= 0 || s.minutes > 780) errs.push('Stoppage minutes must be between 1 and 780 (e.g. 45 or 1:30).');
    if (qty === null && !stops.length) errs.push('Nothing to save – enter output or a stoppage.');
    if (errs.length) { warn.innerHTML = [...new Set(errs)].join('<br>'); warn.classList.remove('hidden'); return; }
    // soft warnings (save anyway on second press)
    if (!btn.dataset.force) {
      const w = [];
      const exp = +card.dataset.expected, act = +card.dataset.actual + (qty || 0);
      if (exp > 0 && act > exp * 1.05) w.push(`Output is ${pct(act / exp)} of expected (${fmt(exp)}). Check the figure.`);
      const kg = qty == null ? 0 : (/ctn/i.test(mc.unit || '') ? qty * (+S.m.productBy[prod]?.nett_weight || 0) : qty);
      if (kg > 0 && ss && mc.sweet_scrap_limit && ss / kg > mc.sweet_scrap_limit) w.push(`Sweet scrap is ${pct(ss / kg)} of output – limit ${pct(mc.sweet_scrap_limit)}.`);
      if (kg > 0 && ms && mc.wrapper_scrap_limit && ms / kg > mc.wrapper_scrap_limit) w.push(`Material scrap is ${pct(ms / kg)} of output – limit ${pct(mc.wrapper_scrap_limit)}.`);
      const totalStop = stops.reduce((s, x) => s + x.minutes, 0);
      const shiftMin = (S.m.shifts.find(s => s.code === S.ctx.shift)?.hours || 13) * 60;
      if (totalStop > shiftMin) w.push(`Stoppages add up to ${hhmm(totalStop)} – longer than the shift.`);
      if (w.length) { warn.innerHTML = w.join('<br>'); warn.classList.remove('hidden'); btn.dataset.force = '1'; btn.textContent = 'Save anyway'; btn.classList.replace('primary', 'warn'); return; }
    }
    btn.disabled = true; btn.textContent = 'Saving…';
    const base = { shift: S.ctx.shift, machine_code: mc.code };
    if (qty !== null) {
      const { error } = await sb.from('output_entries').insert({ ...base, prod_date: S.ctx.date, product_code: prod || null, qty, unit: mc.unit || 'Kg',
        sweet_scrap_kg: ss, material_scrap_kg: ms, operator_id: op || null, comments: $('.f-cm', card).value.trim() || null });
      if (error) { btn.disabled = false; btn.textContent = 'Save'; return fail(error, 'Saving output'); }
    }
    if (stops.length) {
      const { error } = await sb.from('stoppages').insert(stops.map(s => ({ ...base, stop_date: S.ctx.date, reason_code: s.reason_code, minutes: s.minutes })));
      if (error) { btn.disabled = false; btn.textContent = 'Save'; return fail(error, 'Saving stoppages'); }
    }
    toast(`${mc.name} saved`, 'ok');
    loadEntry();
  };
}

const GRIDS = {
  output: { table: 'output_entries', title: 'Output & scrap', cols: [
      { k: 'machine', l: 'Machine', w: 200, list: 'dl-machines', req: 1 }, { k: 'product', l: 'Product', w: 340, list: 'dl-products', req: 1 },
      { k: 'qty', l: 'Output', w: 90, n: 1, req: 1 }, { k: 'unit', l: 'Unit', w: 64, ro: 1 }, { k: 'ss', l: 'Sweet scrap kg', w: 110, n: 1 },
      { k: 'ms', l: 'Material scrap kg', w: 120, n: 1 }, { k: 'op', l: 'Operator', w: 240, list: 'dl-employees' }, { k: 'cm', l: 'Comments', w: 200 }] },
  stops: { table: 'stoppages', title: 'Stoppages', cols: [
      { k: 'machine', l: 'Machine', w: 220, list: 'dl-machines', req: 1 }, { k: 'reason', l: 'Reason', w: 200, list: 'dl-reasons', req: 1 },
      { k: 'min', l: 'Minutes (or h:mm)', w: 130, req: 1 }, { k: 'cm', l: 'Comments', w: 260 }] },
};
let bulkTab = 'output';
const niceDate = d => new Date(d + 'T00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
function renderBulk() {
  $('#app').innerHTML = `<div class="hint">Spreadsheet-style entry from paper sheets. Choose the <b>date</b> and <b>shift</b> once at the top – every row is saved to that date and shift.

    <div class="muted small" id="gInfo" style="margin:-4px 0 10px;min-height:1.2em"></div><div id="gErrs" class="gerrs hidden"></div>
    <div class="tablewrap" style="max-height:62vh"><table class="gridtbl" id="grid"></table></div>

function bulkLabels() {
  const t = `${niceDate(S.ctx.date)} · ${S.ctx.shift} shift`;
  $('#gSave').textContent = `Save rows to ${t}`;
  $('#gExTitle').textContent = `Already in the database for ${t}`;
}
function buildGrid(n) {
  const g = GRIDS[bulkTab];
  $('#grid').innerHTML = `<thead><tr><th class="n">#</th>${g.cols.map(c => `<th style="min-width:${c.w}px">${c.l}${c.req ? ' *' : ''}</th>`).join('')}</tr></thead><tbody></tbody>`;
  addGridRows(n);
}
function addGridRows(n) {
  const g = GRIDS[bulkTab], tb = $('#grid tbody');
  for (let i = 0; i < n; i++) {
    const idx = tb.children.length + 1;
    tb.insertAdjacentHTML('beforeend', `<tr><td class="num">${idx}</td>${g.cols.map(c => `<td data-k="${c.k}"><input ${c.list ? `list="${c.list}"` : ''} ${c.ro ? 'readonly tabindex="-1"' : ''} ${c.n ? 'inputmode="decimal"' : ''} placeholder="${c.ph || ''}"></td>`).join('')}</tr>`);
  }
  $$('#grid tbody tr').forEach((tr, r) => $$('input', tr).forEach((inp, c) => {
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const nx = $('#grid tbody').children[r + 1]; if (nx) $$('input', nx)[c].focus(); } };
    inp.onpaste = e => onGridPaste(e, r, c);
    inp.onchange = () => { if (inp.closest('td').dataset.k === 'machine') onMachineCell(tr); };
  }));
}
// machine chosen -> show its unit and narrow the product list to its section
function onMachineCell(tr) {
  const m = S.m.machineBy[machineFromLabel($('[data-k=machine] input', tr).value)];
  const ui = $('[data-k=unit] input', tr); if (ui) ui.value = m?.unit || '';
  const pi = $('[data-k=product] input', tr); if (!pi) return;
  pi.setAttribute('list', m ? productListId(m) || '' : 'dl-products');
  pi.placeholder = m ? (needsProduct(m) ? stageWord(stagesFor(m)) + ' products' : 'no product') : '';
}
function onGridPaste(e, r0, c0) {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!/[\t\n]/.test(text)) return;
  e.preventDefault();
  const lines = text.replace(/\r/g, '').replace(/\n$/, '').split('\n').map(l => l.split('\t'));
  const cols = GRIDS[bulkTab].cols;
  // old layout guard: pasted block starts with a date/shift where the machine should be
  if (cols[c0]?.k === 'machine' && /^(\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}|day|night)$/i.test((lines[0][0] || '').trim())) {
    $('#gInfo').innerHTML = `<span style="color:var(--bad)">Nothing pasted: the first column looks like a date or shift. Date and shift are now chosen once at the top – copy from the Machine column onwards.</span>`;
    return;
  }
  const tb = $('#grid tbody'); const need = r0 + lines.length - tb.children.length; if (need > 0) addGridRows(need);
  const editable = c => !cols[c].ro;
  lines.forEach((cells, i) => { const tr = tb.children[r0 + i]; const inputs = $$('input', tr); let c = c0;
    cells.forEach(v => { while (c < inputs.length && !editable(c)) c++; if (c < inputs.length) inputs[c++].value = v.trim(); });
    if ($('[data-k=machine] input', tr)) onMachineCell(tr); });
  $('#gInfo').textContent = `Pasted ${lines.length} rows`;
}
async function saveGrid() {
  const g = GRIDS[bulkTab], rows = [], trs = [], problems = [];
  const { date, shift } = S.ctx;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date || '')) { $('#gInfo').textContent = 'Choose a date at the top first.'; return; }
  for (const tr of $$('#grid tbody tr')) {

function toggleProducts(btn, open) {

// Per-product figures for each machine, with the same formulas as the machine rows.
// Plan hours/outputs, output and scrap belong to a product; breakdown minutes are per machine,
// so each shift's breakdown is shared across the products planned on that shift in proportion to planned hours.
function productSplit(rows, plans, outs, hrs, shiftRows, keyOf) {
  const byM = Object.fromEntries(rows.filter(r => !r.idle).map(r => [r.key, r]));
  const SF = Object.fromEntries(shiftRows.map(r => [r.machine_code + '|' + r.prod_date + '|' + r.shift, r]));   // machine facts per shift
  const P = {};
  const get = (m, p) => ((P[m] ||= {})[p || ''] ||= { product_code: p || null, planned_hrs: 0, planned_output: 0, expected_output: 0, actual_output: 0, actual_kg: 0,
    sweet_scrap_kg: 0, material_scrap_kg: 0, ab: 0, breakdown_min: 0, days: {} });
  const day = (x, d, sh) => (x.days[d] ||= {}, x.days[d][sh] ||= { plan: 0, act: 0 });
  for (const l of plans) { const key = keyOf(l.machine_code, l.plan_date); if (!byM[key]) continue; const x = get(key, l.product_code);
    x.planned_hrs += +l.planned_hrs || 0; x.planned_output += +l.planned_output || 0; x.expected_output += +l.expected_output || 0; day(x, l.plan_date, l.shift).plan += +l.planned_output || 0;
    // this line's share of its shift's breakdown (by planned hours) and its expected output after that shift's breakdowns
    const f = SF[l.machine_code + '|' + l.plan_date + '|' + l.shift];
    if (f && +f.planned_hrs > 0) x.breakdown_min += (+f.breakdown_min || 0) * (+l.planned_hrs || 0) / +f.planned_hrs;
    x.ab += (+l.expected_output || 0) * (f?.availability != null ? +f.availability : 1); }
  for (const o of outs) { const key = keyOf(o.machine_code, o.prod_date); if (!byM[key]) continue; const x = get(key, o.product_code);
    x.actual_output += +o.qty || 0; x.actual_kg += +o.output_kg || 0; x.sweet_scrap_kg += +o.sweet_scrap_kg || 0; x.material_scrap_kg += +o.material_scrap_kg || 0; day(x, o.prod_date, o.shift).act += +o.qty || 0; }
  const out = {};
  for (const [m, prods] of Object.entries(P)) {
    const mr = byM[m], mc = S.m.machineBy[mr.machine_code], g = S.m.groupBy[mr.group_code];
    const ctn = /^CT/i.test(mc?.unit || ''), wp = +mc?.wrapper_pct || 0;
    out[m] = Object.values(prods).map(x => {
      x.product_name = S.m.productBy[x.product_code]?.description || (x.product_code || '');
      x.wrapper_waste_eq = wp > 0 ? x.material_scrap_kg / wp : 0;
      x.quality_base = ctn ? x.actual_kg : x.actual_output;
      x.plan_abs_diff = 0; x.mnp = 0; x.pnm = 0;
      for (const shifts of Object.values(x.days)) for (const v of Object.values(shifts)) {
        x.plan_abs_diff += Math.abs(v.plan - v.act);
        if (v.plan === 0 && v.act > 0) x.mnp++; if (v.plan > 0 && v.act === 0) x.pnm++;
      }
      const o = Object.assign(x, sumRatios([x], hrs));
      o.over_105pct = o.efficiency > 1.05;
      o.below_low_limit = g?.oee_low != null && o.efficiency != null && o.efficiency < g.oee_low;
      o.quality_below_limit = g?.quality_limit != null && o.quality != null && o.quality < g.quality_limit;
      return o;
    }).sort((a, b) => b.actual_output - a.actual_output || b.planned_output - a.planned_output);
  }
  return out;
}
function exportOEE() {
  if (!S.oeeRows?.length) return toast('Nothing to export');
  const R = S.oeeRange;
  const out = S.oeeRows.filter(r => !r.idle).map(r => {
    const o = { Period: R.label, From: R.from, To: R.to, Shift: oeePeriod, Machine: r.machine_name, Group: r.group_code, Section: r.department };
    OEE_COLS.forEach(([k, l, d]) => { const v = r[k]; o[l.replace(/\n|­/g, m => m === '\n' ? ' ' : '')] = v == null ? null : Math.round(v * (d === 'p' ? 10000 : 100)) / (d === 'p' ? 10000 : 100); });
    o.Exceptions = [r.mnp && 'Made not planned' + (r.mnp > 1 ? ` (${r.mnp} shifts)` : ''), r.pnm && 'Planned not made' + (r.pnm > 1 ? ` (${r.pnm} shifts)` : ''),
      r.over_105pct && '>105%', r.below_low_limit && 'Below limit', r.quality_below_limit && 'Quality below limit'].filter(Boolean).join(', ');
    return o; });
  const round = (v, d) => v == null ? null : Math.round(v * (d === 'p' ? 10000 : 100)) / (d === 'p' ? 10000 : 100);
  const byProd = [];
  for (const r of S.oeeRows.filter(r => !r.idle)) for (const p of S.oeeProd?.[r.key] || []) {
    const o = { Period: R.label, From: R.from, To: R.to, Shift: oeePeriod, Machine: r.machine_name, Group: r.group_code, Section: r.department,
      'Product code': p.product_code, Product: p.product_name, 'Expected output': round(p.expected_output, 0) };
    OEE_COLS.forEach(([k, l, d]) => { o[l.replace(/\n|\u00ad/g, m => m === '\n' ? ' ' : '')] = round(p[k], d); });
    o.Exceptions = [p.mnp && 'Made not planned', p.pnm && 'Planned not made', p.over_105pct && '>105%', p.below_low_limit && 'Below limit', p.quality_below_limit && 'Quality below limit'].filter(Boolean).join(', ');
    byProd.push(o);
  }
  const ws = XLSX.utils.json_to_sheet(out), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'OEE');
  if (byProd.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(byProd), 'By product');
  XLSX.writeFile(wb, `KSL OEE ${R.file} ${oeePeriod}.xlsx`);
}

      <th style="min-width:190px">Machine</th><th style="min-width:330px">Product</th><th class="n" style="width:95px">Running<br>hours</th><th class="n" style="width:105px">Cleaning /<br>changeover</th>
      <th class="n" style="width:120px">Planned<br>output</th><th style="width:56px">Unit</th><th class="n" style="width:100px">Expected<br>output</th><th class="n" style="width:110px">Unaccounted<br>hours</th>
      <th style="width:40px"></th></tr></thead>${html || `<tbody><tr><td colspan="9" class="muted" style="padding:14px">No plan for this shift.</td></tr></tbody>`}</table></div>
    <div class="muted small" style="margin-top:8px">Expected output = capacity per day × running hours ÷ 24 × product purchasing factor (not for cookers) × machine packing factor.
      Unaccounted hours = shift length (${S.m.shifts.map(s => `${s.code} ${s.hours} h`).join(', ')}) − running − cleaning hours on that machine; red if the machine is planned longer than the shift.</div>
    <h3 style="margin:22px 0 10px">Cooked vs wrapped</h3><div id="pCvW"></div>`;
  if (!ro) {
    $$('[data-add]', body).forEach(b => b.onclick = () => addPlanRow(b.dataset.add));
    $$('tr.prow', body).forEach(bindPlanRow);
  }
  refreshPlanCalcs();
}
function planRowHTML(r, opts, ro) {
  const mc = S.m.machineBy[r.machine], p = S.m.productBy[r.product];
  if (ro) return `<tr class="prow" data-key="${r.key}"><td class="ro">${esc(mc?.name || r.machine)}</td><td class="ro">${esc(p ? productLabel(p) : '')}</td><td class="n ro">${fmt(r.hrs, 2)}</td><td class="n ro">${fmt(r.co, 2)}</td>
    <td class="n ro">${fmt(r.out)}</td><td class="u"></td><td class="n e"></td><td class="n ua"></td><td></td></tr>`;
  return `<tr class="prow" data-key="${r.key}">
    <td data-k="machine"><select>${opts(r.machine)}</select></td>
    <td data-k="product"><input list="${mc ? productListId(mc) : 'dl-products'}" value="${esc(p ? productLabel(p) : (r.productText || ''))}" placeholder="${mc && !needsProduct(mc) ? 'no product' : ''}"></td>
    <td data-k="hrs"><input inputmode="decimal" value="${r.hrs ?? ''}"></td>
    <td data-k="co"><input inputmode="decimal" value="${r.co ?? ''}"></td>
    <td data-k="out"><input inputmode="decimal" class="${r.auto ? 'auto' : ''}" value="${r.out ?? ''}"></td>
    <td class="u"></td><td class="n e"></td><td class="n ua"></td>
    <td><button class="x" type="button" title="Remove this line">×</button></td></tr>`;
}
function addPlanRow(sec) {
  const r = { key: ++PL.seq, id: null, machine: '', product: '', hrs: null, co: null, out: null, auto: true, section: sec };
  PL.rows.push(r); PL.dirty = true;
  drawPlan();
  const tr = $(`tr.prow[data-key="${r.key}"]`); if (tr) $('select', tr).focus();
}
function bindPlanRow(tr) {
  const r = PL.rows.find(x => x.key === +tr.dataset.key);
  const sel = $('[data-k=machine] select', tr), pin = $('[data-k=product] input', tr), hin = $('[data-k=hrs] input', tr), cin = $('[data-k=co] input', tr), oin = $('[data-k=out] input', tr);
  const touch = () => { PL.dirty = true; $$('td', tr).forEach(td => { td.classList.remove('bad'); td.title = ''; }); };
  const autoOut = () => {   // keep the template default in Planned output until the planner types their own figure
    if (!r.auto) return;
    const v = planDefault(S.m.machineBy[r.machine], S.m.productBy[r.product], num(r.hrs));
    r.out = v; oin.value = v ?? ''; oin.classList.add('auto');
  };
  sel.onchange = () => { touch(); r.machine = sel.value; const mc = S.m.machineBy[r.machine];
    pin.setAttribute('list', mc ? productListId(mc) || '' : 'dl-products'); pin.placeholder = mc && !needsProduct(mc) ? 'no product' : '';
    autoOut(); refreshPlanCalcs(); };
  pin.onchange = () => { touch(); const c = productFromLabel(pin.value); r.product = c || ''; r.productText = pin.value;
    if (c) pin.value = productLabel(S.m.productBy[c]); autoOut(); refreshPlanCalcs(); };
  hin.oninput = () => { touch(); r.hrs = hin.value; autoOut(); refreshPlanCalcs(); };
  cin.oninput = () => { touch(); r.co = cin.value; refreshPlanCalcs(); };
  oin.oninput = () => { touch(); r.out = oin.value; r.auto = oin.value === ''; oin.classList.toggle('auto', r.auto); refreshPlanCalcs(); };
  $('.x', tr).onclick = () => { PL.rows = PL.rows.filter(x => x !== r); PL.dirty = true; drawPlan(); };
  [sel, pin, hin, cin, oin].forEach((el, c) => el.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || el.tagName === 'SELECT') return; e.preventDefault();
    let nx = tr.nextElementSibling; while (nx && !nx.classList.contains('prow')) nx = nx.nextElementSibling;
    if (nx) $$('select,input', nx)[c]?.focus();
  }));
}
// live calculations: unit, expected, unaccounted hours, actual, section totals, cooked vs wrapped
function refreshPlanCalcs() {
  const sh = shiftHours(S.ctx.shift);
  const used = {};
  for (const r of PL.rows) if (r.machine) used[r.machine] = (used[r.machine] || 0) + (num(r.hrs) || 0) + (num(r.co) || 0);
  const tot = {};
  for (const r of PL.rows) {
    const tr = $(`tr.prow[data-key="${r.key}"]`);
    const mc = S.m.machineBy[r.machine], p = S.m.productBy[r.product];
    r.unit = p?.uom || mc?.unit || '';
    r.expected = planExpected(mc, p, num(r.hrs));
    r.unacc = mc ? r2(sh - used[r.machine]) : null;
    const sec = sectionOf(r); const t = tot[sec] ||= { lines: 0, out: 0, exp: 0, units: new Set() };
    if (mc) { t.lines++; t.out += num(r.out) || 0; t.exp += r.expected; if (r.unit) t.units.add(r.unit.toUpperCase()); }
    if (!tr) continue;
    $('.u', tr).textContent = r.unit;
    $('.e', tr).textContent = mc ? fmt(r.expected) : '';
    const ua = $('.ua', tr); ua.textContent = r.unacc == null ? '' : fmt(r.unacc, 2); ua.classList.toggle('neg', r.unacc != null && r.unacc < 0);
    ua.title = r.unacc < 0 ? `${mc.name} is planned for ${fmt(used[r.machine], 2)} h – longer than the ${sh} h shift` : '';
  }
  for (const [sec, t] of Object.entries(tot)) { const el = $(`[data-sum="${CSS.escape(sec)}"]`); if (el) el.textContent = `· ${t.lines} line(s) · planned ${fmt(t.out)} · expected ${fmt(t.exp)} ${[...t.units].join('/')}`; }
  drawCookedVsWrapped();
}
// Cooked vs wrapped by product family (name before COOKED / WRAPPED), as in the Planning Template summary
function productFamily(desc) {
  let d = String(desc || '').toUpperCase();
  const i = d.search(/\b(COOKED|WRAPPED)/); if (i < 0) return null;
  d = d.slice(0, i).trim().replace(/\s+(PP|TWIST|PILLOWPACK)$/, '').trim();
  return d.replace('COOL COW CHOCOLATE LOLLIPOPS', 'LARGE CHOCOLATE LOLLIPOPS').replace('COOL COW LOLLIPOPS', 'LARGE MILK LOLLIPOPS');
}
function drawCookedVsWrapped() {
  const box = $('#pCvW'); if (!box) return;
  const fam = {};
  for (const r of PL.rows) {
    const mc = S.m.machineBy[r.machine], p = S.m.productBy[r.product]; if (!mc || !p) continue;
    const kind = mc.department === 'Cooking' ? 'cooked' : mc.department === 'Wrapping' ? 'wrapped' : null; if (!kind) continue;
    const f = productFamily(p.description) || p.description; const x = fam[f] ||= { cooked: 0, wrapped: 0 };
    x[kind] += num(r.out) || 0;
  }
  const rows = Object.entries(fam).sort((a, b) => b[1].cooked - a[1].cooked || b[1].wrapped - a[1].wrapped);
  if (!rows.length) { box.innerHTML = `<div class="panel muted small">Nothing planned on cookers or wrapping machines yet.</div>`; return; }
  box.innerHTML = `<div class="tablewrap" style="max-width:780px"><table><thead><tr><th>Product</th><th class="n">Cooked kg<br>(cookers)</th><th class="n">Wrapped kg<br>(wrapping)</th><th class="n">Cooked − wrapped</th></tr></thead><tbody>
    ${rows.map(([f, x]) => { const d = x.cooked - x.wrapped, pc = x.cooked > 0 ? d / x.cooked : null;
      return `<tr><td>${esc(f)}</td><td class="n">${fmt(x.cooked)}</td><td class="n">${fmt(x.wrapped)}</td><td class="n">${!x.cooked || !x.wrapped ? `<span class="pill a">${x.cooked ? 'not wrapped' : 'not cooked'}</span>` : `${fmt(d)} <span class="muted">(${pct(pc)})</span>`}</td></tr>`; }).join('')}
    </tbody></table></div><div class="muted small" style="margin-top:6px">Planned output by product family this shift. Positive = more cooked than wrapped.</div>`;
}

async function copyPlan() {
  const d = $('#pCopyDate').value, sh = $('#pCopyShift').value;
  if (!d) return planMsg('Choose the date to copy from.', 'warn');
  if (d === S.ctx.date && sh === S.ctx.shift) return planMsg('That is the shift you are planning – choose another one to copy from.', 'warn');
  const btn = $('#pCopy');
  if (PL.rows.length && btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1'; btn.textContent = 'Replace current lines?'; btn.classList.add('warn');
    setTimeout(() => { if (btn.isConnected) { btn.dataset.confirm = ''; btn.textContent = 'Copy'; btn.classList.remove('warn'); } }, 4000); return;
  }
  btn.dataset.confirm = ''; btn.textContent = 'Copy'; btn.classList.remove('warn');
  const { data, error } = await sb.from('plan_lines').select('*').eq('plan_date', d).eq('shift', sh).order('id');
  if (error) return fail(error, 'Copying plan');
  if (!data.length) return planMsg(`There is no plan for ${niceDate(d)} ${sh} to copy.`, 'warn');
  const sameLen = shiftHours(sh) === shiftHours(S.ctx.shift);
  PL.rows = data.filter(r => S.m.machineBy[r.machine_code]?.active).map(r => ({ key: ++PL.seq, id: null, machine: r.machine_code, product: r.product_code || '',
    hrs: sameLen ? r.planned_hrs : null, co: sameLen ? r.changeover_hrs : null, out: sameLen ? r.planned_output : null, auto: !sameLen }));
  PL.dirty = true;
  drawPlan();
  planMsg(`Copied ${PL.rows.length} line(s) from ${niceDate(d)} ${sh}.${sameLen ? '' : ` That shift is a different length, so enter the running and cleaning hours – planned output fills in.`} Check them and press <b>Save plan</b> – nothing is saved yet.`);
}

async function savePlan() {
  const sh = shiftHours(S.ctx.shift), { date, shift } = S.ctx;
  const errs = [], warns = [], keep = [];
  $$('tr.prow td').forEach(td => { td.classList.remove('bad'); td.title = ''; });
  for (const r of PL.rows) {
    const tr = $(`tr.prow[data-key="${r.key}"]`);
    const prodText = (tr && $('[data-k=product] input', tr)?.value.trim()) || '';
    const blank = !r.machine && !prodText && !r.hrs && !r.co && (r.auto || !r.out);
    if (blank && !r.id) continue;
    const bad = [], mark = (k, why) => { bad.push(why); const td = tr && $(`[data-k=${k}]`, tr); if (td) { td.classList.add('bad'); td.title = why; } };
    const mc = S.m.machineBy[r.machine];
    const pcode = prodText ? productFromLabel(prodText) : null;
    if (!mc) mark('machine', 'Machine is required');
    if (mc && needsProduct(mc) && !prodText) mark('product', 'Product is required');
    else if (prodText && pcode === undefined) mark('product', 'Product not recognised – pick it from the list');
    else if (mc && pcode) { const se = productStageError(mc, pcode); if (se) mark('product', se); }
    const hrs = num(r.hrs), co = num(r.co), out = num(r.out);
    if (hrs === null) mark('hrs', 'Running hours are required');
    else if (Number.isNaN(hrs) || hrs < 0 || hrs > 13) mark('hrs', 'Running hours must be a number from 0 to 13');
    if (Number.isNaN(co) || co < 0 || co > 13) mark('co', 'Cleaning hours must be a number from 0 to 13');
    if (out === null) mark('out', 'Planned output is required');
    else if (Number.isNaN(out) || out < 0) mark('out', 'Planned output must be a number (0 or more)');
    if (bad.length) { errs.push(`<b>${esc(mc?.name || ((sectionOf(r) || '') + ' line'))}:</b> ${bad.map(esc).join(' · ')}`); continue; }
    keep.push({ r, rec: { plan_date: date, shift, machine_code: mc.code, product_code: pcode || null, planned_hrs: hrs, changeover_hrs: co || 0, planned_output: out,
      unit: r.unit || null, expected_output: planExpected(mc, S.m.productBy[pcode], hrs), unaccounted_hrs: r.unacc } });
  }
  const btn = $('#pSave');
  const resetBtn = () => { btn.dataset.force = ''; btn.textContent = 'Save plan'; btn.classList.replace('warn', 'primary'); };
  if (errs.length) { resetBtn(); return planMsg(`Fix these before saving:<br>${errs.join('<br>')}`, 'err'); }
  // soft checks – press again to save anyway
  const over = [...new Set(keep.filter(k => k.r.unacc < 0).map(k => S.m.machineBy[k.rec.machine_code].name))];
  if (over.length) warns.push(`Planned longer than the ${sh} h shift: ${over.map(esc).join(', ')}.`);
  const seen = {}, dup = [];
  for (const k of keep) { const key = k.rec.machine_code + '|' + k.rec.product_code; if (seen[key]) dup.push(S.m.machineBy[k.rec.machine_code].name); seen[key] = 1; }
  if (dup.length) warns.push(`Same machine and product on more than one line: ${[...new Set(dup)].map(esc).join(', ')}.`);
  if (warns.length && btn.dataset.force !== '1') {
    btn.dataset.force = '1'; btn.textContent = 'Save anyway'; btn.classList.replace('primary', 'warn');
    return planMsg(warns.join('<br>') + '<br>Press <b>Save anyway</b> to save it as it is.', 'warn');
  }
  resetBtn();
  // inserts / updates (only lines that changed) / deletes
  const same = (a, b) => { const n = v => v == null || v === '' ? null : (isNaN(+v) ? v : +v); return n(a) === n(b); };
  const keptIds = new Set(keep.filter(k => k.r.id).map(k => k.r.id));
  const dels = Object.keys(PL.orig).map(Number).filter(id => !keptIds.has(id));
  const ins = keep.filter(k => !k.r.id).map(k => k.rec);
  const ups = keep.filter(k => k.r.id && ['machine_code', 'product_code', 'planned_hrs', 'changeover_hrs', 'planned_output', 'unit', 'expected_output', 'unaccounted_hrs']
    .some(f => !same(PL.orig[k.r.id][f], k.rec[f])));
  if (!dels.length && !ins.length && !ups.length) { PL.dirty = false; return planMsg('No changes to save.'); }
  btn.disabled = true; btn.textContent = 'Saving…';
  const results = [];
  if (dels.length) results.push(await sb.from('plan_lines').delete().in('id', dels));
  results.push(...await Promise.all(ups.map(k => { const { plan_date, shift: s, ...chg } = k.rec; return sb.from('plan_lines').update(chg).eq('id', k.r.id); })));
  if (ins.length) results.push(await sb.from('plan_lines').insert(ins));
  btn.disabled = false; btn.textContent = 'Save plan';
  const bad = results.find(x => x.error);
  if (bad) { fail(bad.error, 'Saving plan'); return loadPlan(); }
  toast(`Plan saved – ${ins.length} added, ${ups.length} changed, ${dels.length} removed`, 'ok');
  await loadPlan();
}

function exportPlan() {
  const rows = PL.rows.filter(r => S.m.machineBy[r.machine]).map(r => ({ Date: S.ctx.date, Shift: S.ctx.shift, Section: sectionOf(r), Machine: S.m.machineBy[r.machine].name,
    'Product code': r.product || '', Product: S.m.productBy[r.product]?.description || '', 'Running hours': num(r.hrs), 'Cleaning/changeover hours': num(r.co),
    'Planned output': num(r.out), Unit: r.unit, 'Expected output': r.expected, 'Unaccounted hours': r.unacc}));
  if (!rows.length) return toast('Nothing to export');
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Plan'); XLSX.writeFile(wb, `KSL Plan ${S.ctx.date} ${S.ctx.shift}.xlsx`);
}

   USERS (admin)

async function renderUsers() {
  $('#app').innerHTML = `<div class="hint">New people: add them in Supabase → Authentication → Users (tick <b>Auto Confirm User</b>). They appear here as <b>pending</b> – give them a role and press Save.<br>
    <b>Clerk</b>: Bulk entry only; can correct their own entries and Mobile data clerks' entries ·
    <b>Mobile data clerk</b>: Bulk entry only; own entries only ·
    <b>Shift supervisor</b>: Planning (full), OEE (view) ·
    <b>Planner</b>: Planning, OEE, Stoppages · <b>Manager</b>: OEE and Planning, view only · <b>Admin</b>: everything.</div><div id="uBody" class="muted">Loading…</div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at');
  if (error) return fail(error, 'Loading users');
  const roles = ['pending', 'clerk', 'mobile_clerk', 'supervisor', 'planner', 'manager', 'admin'];
  $('#uBody').className = '';
  $('#uBody').innerHTML = `<div class="tablewrap"><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>
    ${data.map(u => `<tr data-u="${u.user_id}"><td>${esc(u.email)}</td><td><input class="u-n" value="${esc(u.full_name || '')}" style="min-width:180px"></td>
      <td><select class="u-r">${roles.map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${esc(ROLE_LABEL[r])}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="u-a" style="width:auto;min-height:0" ${u.active ? 'checked' : ''}></td>
      <td><button class="btn sm u-s">Save</button></td></tr>`).join('')}</tbody></table></div>`;
  $$('#uBody tr[data-u]').forEach(tr => $('.u-s', tr).onclick = async () => {
    const { error } = await sb.from('profiles').update({ full_name: $('.u-n', tr).value.trim(), role: $('.u-r', tr).value, active: $('.u-a', tr).checked }).eq('user_id', tr.dataset.u);
    if (error) return fail(error, 'Saving user'); toast('User saved', 'ok');
  });
}
