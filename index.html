  const [pAmt, setPAmt] = useState("");
  const [pRef, setPRef] = useState("");
  const [pDate, setPDate] = useState(todayStr());
  const [editingVehId, setEditingVehId] = useState(null);
  const [editVeh, setEditVeh] = useState({ make: "", model: "", year: "", rego: "", chassis: "", engineModel: "" });
  const [showMerge, setShowMerge] = useState(false);
  const [mergeTarget, setMergeTarget] = useState("");
  const [showMergeConfirm, setShowMergeConfirm] = useState(false);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const [delVehId, setDelVehId] = useState(null);
  const [editRctId, setEditRctId] = useState(null);

  const [delRctId, setDelRctId] = useState(null);
  const c = data.customers.find((x) => x.id === custId);
  if (!c) return null;
  const vehs = data.vehicles.filter((v) => v.customerId === custId);
  const custJobCount = data.jobs.filter((jb) => jb.customerId === custId).length;
  const custRctCount = (data.receipts || []).filter((r) => r.customerId === custId).length;
  const canDeleteCustomer = vehs.length === 0 && custJobCount === 0 && custRctCount === 0;
  const deleteCustomer = () => {
    if (!canDeleteCustomer) return;
    save({ ...data, customers: data.customers.filter((x) => x.id !== custId) });
    setShowDeleteConfirm(false);
    back();
  };
  const mergeInto = () => {
    if (!mergeTarget) return;
    save({
      ...data,
      vehicles: data.vehicles.map((v) => v.customerId === custId ? { ...v, customerId: mergeTarget } : v),
      jobs: data.jobs.map((j) => j.customerId === custId ? { ...j, customerId: mergeTarget } : j),
      receipts: (data.receipts || []).map((r) => r.customerId === custId ? { ...r, customerId: mergeTarget } : r),
      customers: data.customers.filter((x) => x.id !== custId),
    });
    setShowMergeConfirm(false);
    back();
  };
  const deleteVehicle = (vid) => {
    save({ ...data, vehicles: data.vehicles.filter((x) => x.id !== vid) });
    setDelVehId(null);
  };
  const startEditRct = (r) => {
    setEditRctId(r.id);
    setEditRct({ ref: r.ref || "", date: new Date(r.at).toISOString().slice(0, 10) });
  };
  const saveEditRct = () => {
    if (!editRctId) return;
    save({
      ...data,
      receipts: data.receipts.map((x) => x.id === editRctId ? { ...x, ref: editRct.ref.trim(), at: editRct.date ? dayTs(editRct.date) : x.at } : x),
    });
    setEditRctId(null);
  };
  const deleteReceipt = (id) => {
    save({ ...data, receipts: data.receipts.filter((x) => x.id !== id) });
    setDelRctId(null);
  };
  const addVehicle = () => {
    if (!vMake && !vModel) return;
    save({ ...data, vehicles: [...data.vehicles, { id: uid(), customerId: custId, make: vMake, model: vModel, year: vYear, rego: vRego, chassis: vChassis, engineModel: vEngine, createdAt: Date.now() }] });
    setVMake(""); setVModel(""); setVYear(""); setVRego(""); setVChassis(""); setVEngine("");

    if (!canEditVehicles) return;

      make: v.make || "",
      model: v.model || "",
      year: v.year || "",
      rego: v.rego || "",
      chassis: v.chassis || "",
      engineModel: v.engineModel || "",
    });
  };
  const cancelEditVehicle = () => {
    setEditingVehId(null);
    setEditVeh({ make: "", model: "", year: "", rego: "", chassis: "", engineModel: "" });
  };
  const saveEditVehicle = () => {
    if (!canEditVehicles || !editingVehId) return;
    if (!editVeh.make && !editVeh.model) return;

      ...data,
      vehicles: data.vehicles.map((x) =>
        x.id === editingVehId
          ? { ...x, make: editVeh.make, model: editVeh.model, year: editVeh.year, rego: editVeh.rego, chassis: editVeh.chassis, engineModel: editVeh.engineModel }
          : x

          </div>

function SupplierForm({ data, save, supId, back }) {
  const existing = data.suppliers.find((x) => x.id === supId);
  const [f, setF] = useState(existing || { name: "", phone: "", email: "", address: "", kraPin: "" });
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const submit = () => {
    if (!f.name) return;
    if (existing) save({ ...data, suppliers: data.suppliers.map((s) => s.id === supId ? { ...s, ...f } : s) });
    else save({ ...data, suppliers: [...data.suppliers, { ...f, id: uid(), createdAt: Date.now() }] });
    back();
  };
  const purchCount = existing ? data.purchases.filter((p) => p.supplierId === supId).length : 0;
  const expCount = existing ? (data.expenses || []).filter((e) => e.supplierId === supId).length : 0;
  const payCount = existing ? (data.supplierPayments || []).filter((p) => p.supplierId === supId).length : 0;
  const canDelete = existing && purchCount === 0 && expCount === 0 && payCount === 0;
  const deleteSupplier = () => {
    if (!canDelete) return;
    save({ ...data, suppliers: data.suppliers.filter((x) => x.id !== supId) });
    setShowDeleteConfirm(false);
    back();
  };
  return (
    <div>
      <Btn kind="ghost" small onClick={back}>← Suppliers</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontWeight: 800, fontSize: 16 }}>{existing ? "Edit supplier" : "New supplier"}</div>
        <Label>Supplier name</Label>
        <input style={inpS} value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} />
        <Label>Phone / contact</Label>
        <input style={inpS} placeholder="+254" value={f.phone} onChange={(e) => setF({ ...f, phone: sanitizePhone(e.target.value) })} />
        <Label>Email</Label>
        <input style={inpS} value={f.email || ""} onChange={(e) => setF({ ...f, email: e.target.value })} />
        <Label>Address</Label>
        <input style={inpS} value={f.address} onChange={(e) => setF({ ...f, address: e.target.value })} />
        <Label>KRA PIN</Label>
        <input style={inpS} value={f.kraPin} onChange={(e) => setF({ ...f, kraPin: e.target.value })} />
        <Label>VAT-registered supplier?</Label>
        <select style={selS} value={f.vatRegistered ? "yes" : "no"} onChange={(e) => setF({ ...f, vatRegistered: e.target.value === "yes" })}>
          <option value="no">No — doesn't charge VAT</option>
          <option value="yes">Yes — charges VAT</option>
        </select>

        <div style={{ display: "flex", justifyContent: "center", width: "100%", marginTop: 8 }}>
  	<Btn onClick={submit}>
    	{existing ? "Save changes" : "Add supplier"}
  	</Btn>
	</div>

        {existing && (canDelete ? (
          <Btn kind="danger" small style={{ marginTop: 10 }} onClick={() => setShowDeleteConfirm(true)}>Delete supplier</Btn>
        ) : (
          <div style={{ fontSize: 12, color: T.muted, marginTop: 10 }}>
            Can't delete — linked to {[purchCount && `${purchCount} purchase${purchCount > 1 ? "s" : ""}`, expCount && `${expCount} expense${expCount > 1 ? "s" : ""}`, payCount && `${payCount} payment${payCount > 1 ? "s" : ""}`].filter(Boolean).join(", ")}.
          </div>
        ))}
      </Card>
      <ConfirmModal
        open={showDeleteConfirm}
        title="Delete supplier"
        message={`Delete ${existing?.name || "this supplier"}? This can't be undone.`}
        onYes={deleteSupplier}
        onNo={() => setShowDeleteConfirm(false)}
      />
    </div>
  );
}

// ---------- supplier accounts: payables, payments, statement, cost tracking ----------
// Bills = purchases + expenses linked to a supplier. Payments to suppliers are kept in
// data.supplierPayments ({ id, supplierId, amount, date: "YYYY-MM-DD", ref, note,
// allocations: [{ kind: "purchase"|"expense", id, amount }], createdAt }).
// A bill marked paid by hand (the older paid/unpaid switch) counts as settled in full.
const billAmount = (kind, x) => kind === "purchase"
  ? r2(x.grossAmount ?? (x.items || []).reduce((a, i) => a + Number(i.qty || 0) * Number(i.unitCost || 0), 0))
  : r2(expenseAmount(x));
const billTs = (kind, x) => kind === "purchase"
  ? (x.date || 0)
  : (x.invoiceDate ? dayTs(x.invoiceDate) : (x.createdAt || 0));
const billLabel = (kind, x) => kind === "purchase"
  ? `PO-${x.poNo}${x.invoiceNo ? ` · inv ${x.invoiceNo}` : ""}`
  : `EXP-${x.no ?? "?"}${x.invoiceNo ? ` · inv ${x.invoiceNo}` : ""} — ${x.description || ""}`;
const allocatedTo = (data, kind, id) => r2((data.supplierPayments || []).reduce((a, p) =>
  a + (p.allocations || []).filter((al) => al.kind === kind && al.id === id).reduce((s, al) => s + Number(al.amount || 0), 0), 0));
const billOutstanding = (data, kind, x) => x.paid ? 0 : r2(Math.max(0, billAmount(kind, x) - allocatedTo(data, kind, x.id)));
const supplierBills = (data, supId) => [
  ...(data.purchases || []).filter((p) => p.supplierId === supId).map((x) => ({ kind: "purchase", x })),
  ...(data.expenses || []).filter((e) => e.supplierId === supId).map((x) => ({ kind: "expense", x })),
].map((b) => {
  const amount = billAmount(b.kind, b.x);
  const allocated = allocatedTo(data, b.kind, b.x.id);
  const outstanding = billOutstanding(data, b.kind, b.x);
  return {
    ...b, key: `${b.kind}:${b.x.id}`, id: b.x.id, amount, allocated, outstanding, ts: billTs(b.kind, b.x),
    label: billLabel(b.kind, b.x), dueDate: b.x.dueDate || null,
    overdue: outstanding > 0 && !!b.x.dueDate && dayTs(b.x.dueDate) < Date.now(),
  };
}).sort((a, b) => a.ts - b.ts);
// money paid to the supplier that isn't against any bill yet (advance / overpayment)
const paymentUnallocated = (data, p) => {
  const live = (al) => al.kind === "purchase"
    ? (data.purchases || []).some((x) => x.id === al.id)
    : (data.expenses || []).some((x) => x.id === al.id);
  return r2(Math.max(0, Number(p.amount || 0) - (p.allocations || []).filter(live).reduce((a, al) => a + Number(al.amount || 0), 0)));
};
const supplierCredit = (data, supId) => r2((data.supplierPayments || []).filter((p) => p.supplierId === supId)
  .reduce((a, p) => a + paymentUnallocated(data, p), 0));
const supplierOwed = (data, supId) => r2(supplierBills(data, supId).reduce((a, b) => a + b.outstanding, 0));
const supplierBalance = (data, supId) => r2(supplierOwed(data, supId) - supplierCredit(data, supId));

// Set paid flags on bills from their allocations. Only touches bills fully covered by
// payments, or ones a payment had marked paid (paidVia) — hand-ticked bills are left alone.
const settleFromPayments = (d, supId) => {
  const fix = (kind) => (x) => {
    if (x.supplierId !== supId) return x;
    const amount = billAmount(kind, x);
    const covered = amount > 0 && allocatedTo(d, kind, x.id) >= amount - 0.005;
    if (covered && !x.paid) {
      const last = (d.supplierPayments || []).filter((p) => (p.allocations || []).some((al) => al.kind === kind && al.id === x.id))
        .sort((a, b) => dayTs(b.date) - dayTs(a.date))[0];
      return { ...x, paid: true, paidAt: last?.date || todayStr(), paidRef: last?.ref || "", paidVia: last?.id || "payment", dueDate: null };
    }
    if (!covered && x.paid && x.paidVia) return { ...x, paid: false, paidAt: null, paidRef: "", paidVia: null };
    return x;
  };
  return { ...d, purchases: d.purchases.map(fix("purchase")), expenses: d.expenses.map(fix("expense")) };
};
// spread an amount over the chosen unpaid bills, oldest first
const allocateOldestFirst = (bills, amount) => {
  let remaining = r2(amount);
  const allocations = [];
  bills.filter((b) => b.outstanding > 0).sort((a, b) => a.ts - b.ts).forEach((b) => {
    if (remaining <= 0) return;
    const take = r2(Math.min(b.outstanding, remaining));
    allocations.push({ kind: b.kind, id: b.id, amount: take });
    remaining = r2(remaining - take);
  });
  return { allocations, left: r2(Math.max(0, remaining)) };
};
// apply advances/overpayments already made to this supplier to bills still unpaid
const applySupplierCredit = (d, supId) => {
  let bills = supplierBills(d, supId).filter((b) => b.outstanding > 0);
  const payments = (d.supplierPayments || []).map((p) => {
    if (p.supplierId !== supId) return p;
    const free = paymentUnallocated(d, p);
    if (free <= 0 || !bills.length) return p;
    const { allocations } = allocateOldestFirst(bills, free);
    allocations.forEach((al) => { bills = bills.map((b) => b.id === al.id && b.kind === al.kind ? { ...b, outstanding: r2(b.outstanding - al.amount) } : b); });
    return allocations.length ? { ...p, allocations: [...(p.allocations || []), ...allocations] } : p;
  });
  return settleFromPayments({ ...d, supplierPayments: payments }, supId);
};

// statement lines, oldest first, with running balance (+ = you owe them)
const supplierStatement = (data, supId) => {
  const ev = [];
  supplierBills(data, supId).forEach((b) => {
    ev.push({ ts: b.ts, type: "bill", label: b.label, bill: b.amount, paid: 0, ref: b });
    // paid by hand (no payment recorded) → show that payment too
    const implicit = b.x.paid ? r2(b.amount - b.allocated) : 0;
    if (implicit > 0.005) ev.push({ ts: b.x.paidAt ? dayTs(b.x.paidAt) : b.ts, type: "marked", label: `Paid — ${b.label}${b.x.paidRef ? ` · ${b.x.paidRef}` : ""}`, bill: 0, paid: implicit });
  });
  (data.supplierPayments || []).filter((p) => p.supplierId === supId).forEach((p) => {
    ev.push({ ts: dayTs(p.date), type: "payment", label: `Payment${p.ref ? ` — ${p.ref}` : ""}`, bill: 0, paid: Number(p.amount || 0), ref: p });
  });
  ev.sort((a, b) => a.ts - b.ts || (a.type === "bill" ? -1 : 1));
  let bal = 0;
  return ev.map((e) => { bal = r2(bal + e.bill - e.paid); return { ...e, balance: bal }; });
};

const docHead = (data, title, right) => `<div class="hdr"><div class="shop">${esc(data.shop.name)}</div>
${data.shop.address ? `<div class="sm">${esc(data.shop.address)}</div>` : ""}
${data.shop.phone ? `<div class="sm">Tel: ${esc(data.shop.phone)}</div>` : ""}
${data.shop.kraPin ? `<div class="sm"><b>KRA PIN: ${esc(data.shop.kraPin)}</b></div>` : ""}
<div class="doc-title"><span>${title}</span><span>${right}</span></div></div>`;

function supplierStatementHtml(data, s) {
  const lines = supplierStatement(data, s.id);
  const bal = lines.length ? lines[lines.length - 1].balance : 0;
  const rows = lines.map((e) => `<tr><td>${dateStr(e.ts)}</td><td>${esc(e.label)}</td><td class="r">${e.bill ? money(e.bill) : ""}</td><td class="r">${e.paid ? money(e.paid) : ""}</td><td class="r">${money(e.balance)}</td></tr>`).join("");
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Supplier statement — ${esc(s.name)}</title><style>${DOC_CSS}</style></head><body>
${docHead(data, `SUPPLIER STATEMENT — ${esc(s.name)}`, new Date().toLocaleDateString())}
<table><tr><td><b>Supplier</b></td><td class="r">${esc(s.name)}${s.kraPin ? ` · PIN ${esc(s.kraPin)}` : ""}</td></tr>
${s.phone ? `<tr><td>Contact</td><td class="r">${esc(s.phone)}</td></tr>` : ""}</table>
<table><tr><th>Date</th><th>Detail</th><th class="r">Billed</th><th class="r">Paid</th><th class="r">Balance</th></tr>${rows}
<tr class="tot"><td colspan="4">${bal > 0 ? "BALANCE OWED TO SUPPLIER" : bal < 0 ? "IN CREDIT WITH SUPPLIER" : "SETTLED"}</td><td class="r">${money(Math.abs(bal))}</td></tr></table>
<div class="foot">${esc(data.shop.name)} · Generated ${new Date().toLocaleString()}</div></body></html>`;
}
function supplierPaymentHtml(data, s, p) {
  const rows = (p.allocations || []).map((al) => {
    const x = al.kind === "purchase" ? data.purchases.find((y) => y.id === al.id) : data.expenses.find((y) => y.id === al.id);
    return `<tr><td>${esc(x ? billLabel(al.kind, x) : "(deleted bill)")}</td><td class="r">${money(al.amount)}</td></tr>`;
  }).join("");
  const free = paymentUnallocated(data, p);
  const bal = supplierBalance(data, s.id);
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Payment advice — ${esc(s.name)}</title><style>${DOC_CSS}</style></head><body>
${docHead(data, "PAYMENT ADVICE", dateStr(dayTs(p.date)))}
<table><tr><td><b>Paid to</b></td><td class="r">${esc(s.name)}${s.kraPin ? ` · PIN ${esc(s.kraPin)}` : ""}</td></tr>
<tr><td><b>Amount paid</b></td><td class="r"><b>${money(p.amount)}</b></td></tr>
${p.ref ? `<tr><td>Reference</td><td class="r">${esc(p.ref)}</td></tr>` : ""}
${p.note ? `<tr><td>Note</td><td class="r">${esc(p.note)}</td></tr>` : ""}</table>
<h2>APPLIED TO</h2><table>${rows || ""}${free > 0 ? `<tr><td>On account (advance)</td><td class="r">${money(free)}</td></tr>` : ""}</table>
<h2>ACCOUNT POSITION NOW</h2><table><tr class="tot"><td>${bal > 0 ? "Balance still owed" : bal < 0 ? "In credit with supplier" : "Account settled"}</td><td class="r">${money(Math.abs(bal))}</td></tr></table>
<div class="foot">${esc(data.shop.name)} · Generated ${new Date().toLocaleString()}</div></body></html>`;
}

// VAT-inclusive unit price actually paid on a purchase line, so suppliers compare fairly
const lineUnitPaid = (p, it) => {
  const u = Number(it.unitCost || 0);
  return p.vatMode === "excl" ? r2(u * (1 + Number(p.vatRate || 0) / 100)) : u;
};
const itemKey = (it) => it.stockId ? `s:${it.stockId}` : `n:${String(it.master || it.name || "").trim().toLowerCase()}`;
const priceHistoryFor = (data, supId) => {
  const groups = {};
  (data.purchases || []).filter((p) => p.supplierId === supId).forEach((p) => (p.items || []).forEach((it) => {
    const k = itemKey(it);
    (groups[k] = groups[k] || { key: k, name: it.name || it.master || "—", uom: it.uom || "", buys: [] })
      .buys.push({ ts: p.date || 0, poNo: p.poNo, qty: Number(it.qty || 0), price: lineUnitPaid(p, it) });
  }));
  return Object.values(groups).map((g) => {
    g.buys.sort((a, b) => a.ts - b.ts);
    const last = g.buys[g.buys.length - 1], prev = g.buys.length > 1 ? g.buys[g.buys.length - 2] : null;
    // same item bought from other suppliers — their latest price
    let other = null;
    (data.purchases || []).filter((p) => p.supplierId && p.supplierId !== supId).forEach((p) => (p.items || []).forEach((it) => {
      if (itemKey(it) !== g.key) return;
      if (!other || (p.date || 0) > other.ts) other = { ts: p.date || 0, price: lineUnitPaid(p, it), supplier: p.supplierName || "" };
    }));
    const prices = g.buys.map((b) => b.price);
    return {
      ...g, last, prev, other, qty: r2(g.buys.reduce((a, b) => a + b.qty, 0)),
      min: Math.min(...prices), max: Math.max(...prices),
      change: prev && prev.price ? r2((last.price - prev.price) / prev.price * 100) : null,
    };
  }).sort((a, b) => b.last.ts - a.last.ts);
};

function SupplierDetail({ data, save, supId, back, openEdit, openBill, canManage }) {
  const s = data.suppliers.find((x) => x.id === supId);
  const [pDate, setPDate] = useState(todayStr());
  const [pAmt, setPAmt] = useState("");
  const [pRef, setPRef] = useState("");
  const [pNote, setPNote] = useState("");
  const [picked, setPicked] = useState(null); // null = all unpaid bills
  const [delPay, setDelPay] = useState(null);
  const [openItem, setOpenItem] = useState(null);
  const [showAllHist, setShowAllHist] = useState(false);
  if (!s) return <div><Btn kind="ghost" small onClick={back}>← Suppliers</Btn><div style={{ color: T.muted, marginTop: 12 }}>Supplier not found.</div></div>;

  const ready = window.__supplierPaymentsReady !== false;
  const bills = supplierBills(data, supId);
  const unpaid = bills.filter((b) => b.outstanding > 0);
  const owed = r2(unpaid.reduce((a, b) => a + b.outstanding, 0));
  const credit = supplierCredit(data, supId);
  const balance = r2(owed - credit);
  const overdue = r2(unpaid.filter((b) => b.overdue).reduce((a, b) => a + b.outstanding, 0));
  const now = new Date();
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const yStart = new Date(now.getFullYear(), 0, 1).getTime();
  const spentSince = (t) => r2(bills.filter((b) => b.ts >= t).reduce((a, b) => a + b.amount, 0));
  const spentAll = r2(bills.reduce((a, b) => a + b.amount, 0));
  const months = Array.from({ length: 12 }, (_, i) => {
    const d0 = new Date(now.getFullYear(), now.getMonth() - 11 + i, 1), d1 = new Date(now.getFullYear(), now.getMonth() - 10 + i, 1);
    return { label: d0.toLocaleDateString([], { month: "short", year: "2-digit" }), total: r2(bills.filter((b) => b.ts >= d0.getTime() && b.ts < d1.getTime()).reduce((a, b) => a + b.amount, 0)) };
  });
  const maxMonth = Math.max(1, ...months.map((m) => m.total));
  const payments = (data.supplierPayments || []).filter((p) => p.supplierId === supId);
  const statement = supplierStatement(data, supId);
  const prices = priceHistoryFor(data, supId);

  const chosen = unpaid.filter((b) => picked === null || picked.includes(b.key));
  const amt = r2(Number(pAmt || 0));
  const preview = amt > 0 ? allocateOldestFirst(chosen, amt) : { allocations: [], left: 0 };
  const togglePick = (key) => {
    const cur = picked === null ? unpaid.map((b) => b.key) : picked;
    setPicked(cur.includes(key) ? cur.filter((k) => k !== key) : [...cur, key]);
  };
  const recordPayment = () => {
    if (amt <= 0 || !ready) return;
    const pay = {
      id: uid(), supplierId: supId, amount: amt, date: pDate || todayStr(), ref: pRef.trim(), note: pNote.trim(),
      allocations: preview.allocations, createdAt: Date.now(),
    };
    save(settleFromPayments({ ...data, supplierPayments: [...(data.supplierPayments || []), pay] }, supId));
    setPAmt(""); setPRef(""); setPNote(""); setPicked(null); setPDate(todayStr());
  };
  const deletePayment = () => {
    const d = { ...data, supplierPayments: (data.supplierPayments || []).filter((p) => p.id !== delPay) };
    save(settleFromPayments(d, supId));
    setDelPay(null);
  };
  const hist = [...statement].reverse();
  const shownHist = showAllHist ? hist : hist.slice(0, 25);
  const mini = { fontSize: 12, color: T.muted };

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <Btn kind="ghost" small onClick={back}>← Suppliers</Btn>
        <div style={{ display: "flex", gap: 8 }}>
          <Btn small kind="ghost" onClick={() => downloadDoc(`${s.name} ~ supplier statement.pdf`, supplierStatementHtml(data, s))}>⬇ Statement (PDF)</Btn>
          <Btn small kind="ghost" onClick={() => openEdit(supId)}>✎ Edit details</Btn>
        </div>
      </div>

      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontSize: 20, fontWeight: 800 }}>{s.name}</div>
        <div style={{ color: T.muted, fontSize: 14 }}>
          {[s.phone, s.email, s.address].filter(Boolean).join(" · ")}
        </div>
        <div style={{ color: T.muted, fontSize: 13 }}>
          {[s.kraPin && `PIN ${s.kraPin}`, s.vatRegistered ? "VAT-registered" : "Not VAT-registered"].filter(Boolean).join(" · ")}
        </div>
        {s.phone && (
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <a href={`tel:${s.phone}`} style={{ color: T.accent, fontSize: 13, fontWeight: 700, textDecoration: "none", border: `1px solid ${T.line}`, borderRadius: 6, padding: "5px 12px" }}>📞 Call</a>
            <a href={waLink(s.phone)} target="_blank" rel="noreferrer" style={{ color: T.accent, fontSize: 13, fontWeight: 700, textDecoration: "none", border: `1px solid ${T.line}`, borderRadius: 6, padding: "5px 12px" }}>WhatsApp</a>
          </div>
        )}
      </Card>

      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, margin: "4px 0 8px" }}>
        <StatCard label={balance < 0 ? "In credit" : "You owe"} value={money(Math.abs(balance))}
          color={balance > 0 ? (overdue > 0 ? T.danger : T.accent) : T.ok}
          sub={overdue > 0 ? `${money(overdue)} overdue` : unpaid.length ? `${unpaid.length} unpaid bill${unpaid.length === 1 ? "" : "s"}` : "Nothing outstanding"} />
        <StatCard label="Spent this month" value={money(spentSince(mStart))} sub="Purchases + expenses" />
        <StatCard label="Spent this year" value={money(spentSince(yStart))} sub={String(now.getFullYear())} />
        <StatCard label="All time" value={money(spentAll)} sub={`${bills.length} bill${bills.length === 1 ? "" : "s"} · ${payments.length} payment${payments.length === 1 ? "" : "s"}`} />
      </div>

      {canManage && (
        <Card style={{ padding: 16 }}>
          <div style={{ fontWeight: 800, marginBottom: 6 }}>Record a payment to {s.name}</div>
          {!ready ? (
            <div style={{ fontSize: 13, color: T.danger }}>
              Supplier payments need the latest Google Apps Script backend. Deploy it first, then reopen the app — until then payments can't be saved.
            </div>
          ) : (<>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <input style={{ ...inpS, marginBottom: 0, width: 140, flex: "0 0 auto" }} type="date" title="Date paid" value={pDate} onChange={(e) => setPDate(e.target.value)} />
              <input style={{ ...inpS, marginBottom: 0, flex: 1, minWidth: 110 }} type="number" step="any" min="0" placeholder="Amount" value={pAmt} onChange={(e) => setPAmt(e.target.value)} />
              <input style={{ ...inpS, marginBottom: 0, flex: 1.4, minWidth: 140 }} placeholder="M-Pesa / bank ref / cheque no." value={pRef} onChange={(e) => setPRef(e.target.value)} />
            </div>
            <input style={{ ...inpS, marginTop: 6 }} placeholder="Note (optional)" value={pNote} onChange={(e) => setPNote(e.target.value)} />
            {unpaid.length > 0 && (
              <div style={{ marginTop: 4 }}>
                <div style={mini}>Pay against — oldest first. Untick any bill you're not paying yet.</div>
                {unpaid.map((b) => {
                  const on = picked === null || picked.includes(b.key);
                  const al = preview.allocations.find((x) => x.kind === b.kind && x.id === b.id);
                  return (
                    <label key={b.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderBottom: `1px dashed ${T.line}`, fontSize: 13, cursor: "pointer" }}>
                      <input type="checkbox" checked={on} onChange={() => togglePick(b.key)} />
                      <span style={{ flex: 1 }}>{b.label}<span style={{ color: T.muted }}> · {dateStr(b.ts)}</span></span>
                      <span style={{ fontFamily: T.mono, color: T.muted }}>{money(b.outstanding)}</span>
                      <span style={{ fontFamily: T.mono, width: 110, textAlign: "right", color: al ? T.ok : T.muted }}>{al ? `→ ${money(al.amount)}` : ""}</span>
                    </label>
                  );
                })}
              </div>
            )}
            {amt > 0 && preview.left > 0 && (
              <div style={{ fontSize: 12, color: T.accent, marginTop: 6 }}>
                {money(preview.left)} isn't against any bill — it will be kept as credit with {s.name} and can be applied to future bills.
              </div>
            )}
            <Btn style={{ marginTop: 10 }} onClick={recordPayment}>Record payment{amt > 0 ? ` of ${money(amt)}` : ""}</Btn>
            {credit > 0 && owed > 0 && (
              <Btn small kind="ghost" style={{ marginTop: 10, marginLeft: 8 }} onClick={() => save(applySupplierCredit(data, supId))}>
                Apply {money(credit)} credit to unpaid bills
              </Btn>
            )}
          </>)}
        </Card>
      )}

      <Label>Payables — unpaid bills · {unpaid.length}</Label>
      {!unpaid.length && <div style={{ color: T.muted, fontSize: 13 }}>Nothing owed to {s.name}.</div>}
      {unpaid.map((b) => (
        <Card key={b.key} onClick={canManage ? () => openBill(b.kind, b.id) : undefined}>
          <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
            <div>
              <div style={{ fontWeight: 700 }}>{b.label}</div>
              <div style={mini}>{dateStr(b.ts)} · bill {money(b.amount)}{b.allocated > 0 ? ` · paid ${money(b.allocated)} so far` : ""}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: T.mono, fontWeight: 700 }}>{money(b.outstanding)}</div>
              <div style={{ fontSize: 11, color: b.overdue ? T.danger : T.muted, fontWeight: b.overdue ? 800 : 400 }}>
                {b.overdue ? "OVERDUE" : "Due"}{b.dueDate ? ` ${dateStr(dayTs(b.dueDate))}` : " date not set"}
              </div>
            </div>
          </div>
        </Card>
      ))}

      <Label>Account history · {statement.length}</Label>
      {!statement.length && <div style={{ color: T.muted, fontSize: 13 }}>No purchases, expenses or payments with {s.name} yet.</div>}
      {statement.length > 0 && (
        <Card style={{ padding: 0, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
            <thead><tr style={{ color: T.muted, fontSize: 11, textTransform: "uppercase", letterSpacing: 1 }}>
              <th style={{ textAlign: "left", padding: "8px 10px" }}>Date</th>
              <th style={{ textAlign: "left", padding: "8px 10px" }}>Detail</th>
              <th style={{ textAlign: "right", padding: "8px 10px" }}>Billed</th>
              <th style={{ textAlign: "right", padding: "8px 10px" }}>Paid</th>
              <th style={{ textAlign: "right", padding: "8px 10px" }}>Balance</th>
              <th style={{ width: 70 }}></th>
            </tr></thead>
            <tbody>
              {shownHist.map((e, i) => (
                <tr key={i} style={{ borderTop: `1px solid ${T.line}`, cursor: e.type === "bill" && canManage ? "pointer" : "default" }}
                  onClick={e.type === "bill" && canManage ? () => openBill(e.ref.kind, e.ref.id) : undefined}>
                  <td style={{ padding: "7px 10px", whiteSpace: "nowrap", fontFamily: T.mono, fontSize: 12 }}>{dateStr(e.ts)}</td>
                  <td style={{ padding: "7px 10px" }}>
                    {e.label}
                    {e.type === "payment" && (e.ref.note || (e.ref.allocations || []).length > 0) && (
                      <div style={mini}>{[e.ref.note, (e.ref.allocations || []).map((al) => {
                        const x = al.kind === "purchase" ? data.purchases.find((y) => y.id === al.id) : data.expenses.find((y) => y.id === al.id);
                        return `${x ? (al.kind === "purchase" ? `PO-${x.poNo}` : `EXP-${x.no}`) : "deleted bill"}: ${money(al.amount)}`;
                      }).join(" · ")].filter(Boolean).join(" — ")}{paymentUnallocated(data, e.ref) > 0 ? ` · credit ${money(paymentUnallocated(data, e.ref))}` : ""}</div>
                    )}
                  </td>
                  <td style={{ padding: "7px 10px", textAlign: "right", fontFamily: T.mono }}>{e.bill ? money(e.bill) : ""}</td>
                  <td style={{ padding: "7px 10px", textAlign: "right", fontFamily: T.mono, color: T.ok }}>{e.paid ? money(e.paid) : ""}</td>
                  <td style={{ padding: "7px 10px", textAlign: "right", fontFamily: T.mono, fontWeight: 700, color: e.balance > 0 ? T.text : T.ok }}>{money(e.balance)}</td>
                  <td style={{ padding: "4px 8px", textAlign: "right", whiteSpace: "nowrap" }} onClick={(ev) => ev.stopPropagation()}>
                    {e.type === "payment" && (<>
                      <Btn small kind="ghost" onClick={() => downloadDoc(`${s.name} ~ payment advice ${e.ref.date}.pdf`, supplierPaymentHtml(data, s, e.ref))}>⬇</Btn>
                      {canManage && <Btn small kind="danger" style={{ marginLeft: 4 }} onClick={() => setDelPay(e.ref.id)}>✕</Btn>}
                    </>)}

          {hist.length > 25 && (
