            </div>
          )}
        </Card>
      )}

      <Label>Monthly spend — last 12 months</Label>
      <Card style={{ padding: 14 }}>
        {months.map((m) => (
          <div key={m.label} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12, margin: "3px 0" }}>
            <span style={{ width: 52, color: T.muted, fontFamily: T.mono }}>{m.label}</span>
            <div style={{ flex: 1, background: T.panel2, borderRadius: 3, height: 14 }}>
              <div style={{ width: `${(m.total / maxMonth) * 100}%`, height: "100%", background: T.accent, borderRadius: 3, minWidth: m.total > 0 ? 2 : 0 }} />
            </div>
            <span style={{ width: 110, textAlign: "right", fontFamily: T.mono }}>{m.total ? money(m.total) : "—"}</span>
          </div>
        ))}
      </Card>

      <Label>Item price history · {prices.length}</Label>
      <div style={{ ...mini, marginBottom: 6 }}>Unit prices include VAT where the supplier charged it, so they compare fairly with other suppliers. Tap an item for every purchase.</div>
      {!prices.length && <div style={{ color: T.muted, fontSize: 13 }}>No stock purchases from {s.name} yet.</div>}
      {prices.map((g) => {
        const up = g.change != null && g.change > 0, down = g.change != null && g.change < 0;
        const cheaper = g.other && g.other.price < g.last.price;
        return (
          <Card key={g.key} onClick={() => setOpenItem(openItem === g.key ? null : g.key)}>
            <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 700 }}>{g.name}</div>
                <div style={mini}>
                  Bought {g.buys.length}× · {g.qty}{g.uom ? ` ${g.uom}` : ""} total · range {money(g.min)}–{money(g.max)}
                </div>
                {g.other && (
                  <div style={{ fontSize: 12, color: cheaper ? T.danger : T.muted }}>
                    {g.other.supplier || "Another supplier"}: {money(g.other.price)} on {dateStr(g.other.ts)}{cheaper ? " — cheaper there" : ""}
                  </div>
                )}
              </div>
              <div style={{ textAlign: "right", whiteSpace: "nowrap" }}>
                <div style={{ fontFamily: T.mono, fontWeight: 800 }}>{money(g.last.price)}</div>
                <div style={mini}>last · {dateStr(g.last.ts)}</div>
                {g.change != null && g.change !== 0 && (
                  <div style={{ fontSize: 12, fontWeight: 800, color: up ? T.danger : T.ok }}>{up ? "▲" : "▼"} {Math.abs(g.change)}%</div>
                )}
              </div>
            </div>
            {openItem === g.key && (
              <div style={{ marginTop: 8, borderTop: `1px solid ${T.line}`, paddingTop: 6 }}>
                {[...g.buys].reverse().map((b, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "2px 0", fontFamily: T.mono }}>
                    <span>{dateStr(b.ts)} · PO-{b.poNo} · qty {b.qty}</span><span>{money(b.price)}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>
        );
      })}

      <ConfirmModal
        open={!!delPay}
        title="Delete payment"
        message="Delete this payment? Bills it settled go back to unpaid (unless you marked them paid by hand)."
        onYes={deletePayment}
        onNo={() => setDelPay(null)}
      />
    </div>
  );
}

// purchase invoice attachment viewer (lazy loads from its own key)
function PurchaseAttachment({ p }) {
  const [att, setAtt] = useState(null);
  const [open, setOpen] = useState(false);
  const [errA, setErrA] = useState("");
  if (!p.attach) return null;
  const toggle = async () => {
    if (att) { setOpen(!open); return; }
    try {
      const r = await window.storage.get(`garage-pinv:${p.id}`);
      setAtt(JSON.parse(r.value)); setOpen(true);
    } catch { setErrA("Attachment not found"); }
  };
  return (
    <div style={{ marginTop: 6 }}>
      <Btn small kind="ghost" onClick={toggle}>📎 {open ? "Hide" : "View"} purchase invoice</Btn>
      {errA && <div style={{ fontSize: 12, color: T.danger }}>{errA}</div>}
      {open && att && (att.type === "image"
        ? <img src={att.dataUrl} alt="purchase invoice" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}`, marginTop: 6 }} />
        : <a href={att.dataUrl} download={att.name} style={{ display: "inline-block", marginTop: 6, color: T.accent, fontFamily: T.mono, fontSize: 13 }}>⬇ {att.name}</a>)}
    </div>
  );
}

// ---------- stock + purchases ----------
function StockTab({ data, save, goPurchase, openPurchase, canManage }) {
  const [q, setQ] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ master: "", variant: "", brand: "", subBrand: "", uom: "" });
  const [delId, setDelId] = useState(null);
  const startEdit = (s) => {
    setEditingId(s.id);
    setEditForm({
      master: s.master || s.name || "", variant: s.variant || "", brand: s.brand || "",
      subBrand: s.subBrand || "", uom: s.uom || "",
    });
  };
  const cancelEdit = () => setEditingId(null);
  const saveEdit = () => {
    if (!editingId) return;
    const nm = [editForm.master, editForm.variant, editForm.brand, editForm.subBrand].map((x) => x.trim()).filter(Boolean).join(" ");
    save({
      ...data,
      stock: data.stock.map((x) => x.id === editingId ? {
        ...x,
        name: nm || x.name,
        master: editForm.master.trim() || x.master,
        variant: editForm.variant.trim(),
        brand: editForm.brand.trim(),
        subBrand: editForm.subBrand.trim(),
        uom: editForm.uom.trim(),
      } : x),
    });
    setEditingId(null);
  };
  const deleteStock = (id) => {
    const s = data.stock.find((x) => x.id === id);
    if (!s || s.qty !== 0) { setDelId(null); return; }
    save({
      ...data,
      stock: data.stock.filter((x) => x.id !== id),
      purchases: data.purchases.map((p) => ({
        ...p,
        items: (p.items || []).map((it) => it.stockId === id ? { ...it, stockId: null } : it),
      })),
      jobs: data.jobs.map((j) => ({
        ...j,
        parts: (j.parts || []).map((pt) => pt.stockId === id ? { ...pt, stockId: null, costAtDelete: s.cost } : pt),
      })),
    });
    setDelId(null);
  };
  const isLow = (s) => s.qty === 0 || (Number(s.minQty) > 0 && s.qty <= Number(s.minQty));
  const lowCount = data.stock.filter(isLow).length;
  const supByStock = {};
  data.purchases.forEach((p) => (p.items || []).forEach((it) => {
    if (!it.stockId) return;
    (supByStock[it.stockId] = supByStock[it.stockId] || new Set()).add((p.supplierName || p.supplier || "").toLowerCase());
  }));
  const query = q.trim().toLowerCase();
  const match = (s) => !query ||
    [s.code, s.name, s.master, s.brand, s.subBrand, s.variant, s.uom].some((f) => (f || "").toLowerCase().includes(query)) ||
    [...(supByStock[s.id] || [])].some((n) => n.includes(query));
  const filtered = data.stock.filter(match);
  const brands = [...new Set(filtered.map((s) => s.brand || "— No brand —"))]
    .sort((a, b) => a === "— No brand —" ? 1 : b === "— No brand —" ? -1 : a.localeCompare(b));
  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14, alignItems: "stretch" }}>
        <input style={{ ...inpS, marginBottom: 0, flex: 1 }} placeholder="Search stock — code, brand, spec, supplier…" value={q} onChange={(e) => setQ(e.target.value)} />
        <Btn onClick={goPurchase} style={{ whiteSpace: "nowrap", flexShrink: 0 }}>+ Record purchase</Btn>
      </div>
      {lowCount > 0 && !query && (
        <div style={{ color: T.accent, fontSize: 13, marginBottom: 8, fontWeight: 700 }}>
          ⚠ {lowCount} part{lowCount > 1 ? "s" : ""} at or below minimum — reorder
        </div>
      )}
      {!data.stock.length && <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>Stock is added by recording purchases.</div>}
      {query && !filtered.length && <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>No stock matches &quot;{q}&quot;</div>}
      {brands.map((b) => (
        <div key={b}>
          <div style={{ fontSize: 11, letterSpacing: 1.5, color: T.accent, fontWeight: 800, margin: "10px 0 4px" }}>{b.toUpperCase()}</div>
          {filtered.filter((s) => (s.brand || "— No brand —") === b).map((s) => {
            const low = isLow(s);
            const variantLabel = [s.master || s.name, s.variant, s.subBrand].filter(Boolean).join(" ");
            if (editingId === s.id) {
              return (
                <Card key={s.id}>
                  <div style={{ fontWeight: 800, fontSize: 13, marginBottom: 6, color: T.accent }}>Edit stock item</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <input style={{ ...inpS, flex: 1.5 }} placeholder="Master item" value={editForm.master} onChange={(e) => setEditForm({ ...editForm, master: e.target.value })} />
                    <input style={{ ...inpS, width: 100 }} placeholder="Spec" value={editForm.variant} onChange={(e) => setEditForm({ ...editForm, variant: e.target.value })} />
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <input style={inpS} placeholder="Brand" value={editForm.brand} onChange={(e) => setEditForm({ ...editForm, brand: e.target.value })} />
                    <input style={inpS} placeholder="Sub-brand / part no." value={editForm.subBrand} onChange={(e) => setEditForm({ ...editForm, subBrand: e.target.value })} />
                    <input style={{ ...inpS, width: 76 }} placeholder="UOM" value={editForm.uom} onChange={(e) => setEditForm({ ...editForm, uom: e.target.value })} />
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <Btn small onClick={saveEdit}>Save</Btn>
                    <Btn small kind="ghost" onClick={cancelEdit}>Cancel</Btn>
                  </div>
                </Card>
              );
            }
            return (
              <Card key={s.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontWeight: 700 }}>
                    {variantLabel || s.name}{low && <span style={{ fontSize: 9, fontWeight: 900, background: T.danger, color: "#15130e", padding: "2px 5px", borderRadius: 3, marginLeft: 6, verticalAlign: "middle" }}>LOW</span>}
                  </div>
                  <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>{s.code ? `${s.code} · ` : ""}{money(s.cost)} {s.uom ? `/${s.uom}` : "ea"}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <input style={{ ...inpS, marginBottom: 0, width: 56, padding: "6px 6px", fontSize: 12 }} type="number" placeholder="min"
                    value={s.minQty ?? ""}
                    onChange={(e) => save({ ...data, stock: data.stock.map((x) => x.id === s.id ? { ...x, minQty: e.target.value === "" ? undefined : Number(e.target.value) } : x) })} />
                  <div style={{ fontFamily: T.mono, fontWeight: 800, fontSize: 18, color: low ? T.danger : T.accent }}>{s.qty}{s.uom ? <span style={{ fontSize: 11, color: T.muted }}> {s.uom}</span> : null}</div>
                  {canManage && (
                    <div style={{ display: "flex", gap: 4 }}>
                      <Btn small kind="ghost" onClick={() => startEdit(s)}>✎</Btn>
                      {s.qty === 0 && <Btn small kind="danger" onClick={() => setDelId(s.id)}>🗑</Btn>}
                    </div>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      ))}
      {!query && data.purchases.length > 0 && (<>
        <Label>Purchase history</Label>
        {data.purchases.map((p) => (
          <Card key={p.id}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700 }}>
                PO-{p.poNo}
                {p.paid === false && (
                  <span style={{ marginLeft: 6, fontSize: 9, fontWeight: 900, background: (p.dueDate && dayTs(p.dueDate) < Date.now()) ? T.danger : T.muted, color: "#15130e", padding: "2px 5px", borderRadius: 3, verticalAlign: "middle" }}>{allocatedTo(data, "purchase", p.id) > 0 ? "PART-PAID" : "UNPAID"}</span>
                )}
              </span>
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>{dateStr(p.date)}</span>
                <Btn small kind="ghost" onClick={() => openPurchase(p.id)}>✎ Edit</Btn>
              </span>
            </div>
            <div style={{ fontSize: 14, fontWeight: 700, margin: "2px 0" }}>{p.supplierName || p.supplier || "—"}</div>
            {p.items.map((it, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.muted }}>
                <span>{it.qty}{it.uom ? ` ${it.uom} ` : "× "}{it.name}</span><span style={{ fontFamily: T.mono }}>{money(it.qty * it.unitCost)}</span>
              </div>
            ))}
            {(() => {
              const sum = p.items.reduce((a, i) => a + i.qty * i.unitCost, 0);
              const gross = p.vatMode === "excl" ? r2(sum + Number(p.vatAmount || 0)) : r2(sum);
              return (
                <div style={{ textAlign: "right", fontFamily: T.mono, marginTop: 4 }}>
                  {Number(p.vatAmount) > 0 && <div style={{ color: T.muted, fontSize: 12 }}>incl. VAT {money(p.vatAmount)}</div>}
                  <div style={{ color: T.accent }}>{money(gross)}</div>
                </div>
              );
            })()}
            <PurchaseAttachment p={p} />
          </Card>
        ))}
      </>)}
      <ConfirmModal
        open={!!delId}
        title="Delete stock item"
        message="Delete this stock item? It's at zero quantity. Any past purchases and job parts that used it keep their recorded cost and price — only the live stock entry is removed. This can't be undone."
        onYes={() => deleteStock(delId)}
        onNo={() => setDelId(null)}
      />
    </div>
  );
}

function PurchaseForm({ data, save, back }) {
  const [supplierId, setSupplierId] = useState("");
  const [newSup, setNewSup] = useState({ name: "", phone: "", email: "", kraPin: "", vatRegistered: false });
  const [vatMode, setVatMode] = useState("");
  const [lines, setLines] = useState([]);
  const [existingId, setExistingId] = useState("");
  const [master, setMaster] = useState("");
  const [variant, setVariant] = useState("");
  const [brandSel, setBrandSel] = useState("");
  const [brandNew, setBrandNew] = useState("");
  const brand = brandSel === "__new__" ? brandNew : brandSel;
  const [subBrand, setSubBrand] = useState("");
  const [uom, setUom] = useState("");
  const [qty, setQty] = useState("");
  const [cost, setCost] = useState("");
  const [attach, setAttach] = useState(null);
  const [upErr, setUpErr] = useState("");
  const [invoiceNo, setInvoiceNo] = useState("");
  const [paid, setPaid] = useState(true);
  const [paidAt, setPaidAt] = useState(todayStr());
  const [paidRef, setPaidRef] = useState("");
  const [dueDate, setDueDate] = useState("");
  const fileRef = useRef(null);

  const onPayChange = (patch) => {
    if ("paid" in patch) setPaid(patch.paid);
    if ("paidAt" in patch) setPaidAt(patch.paidAt);
    if ("paidRef" in patch) setPaidRef(patch.paidRef);
    if ("dueDate" in patch) setDueDate(patch.dueDate);
  };

  const addLine = () => {
    const q = r2(Number(qty || 0)), c = Number(cost || 0);
    if (q <= 0) return;
    if (existingId) {
      const s = data.stock.find((x) => x.id === existingId);
      if (!s) return;
      setLines([...lines, { stockId: existingId, name: s.name, uom: s.uom || "", qty: q, unitCost: c || s.cost }]);
    } else {
      if (!master) return;
      const nm = [master, variant, brand, subBrand].map((x) => x.trim()).filter(Boolean).join(" ");
      setLines([...lines, { stockId: null, name: nm, master: master.trim(), variant: variant.trim(), brand: brand.trim(), subBrand: subBrand.trim(), uom: uom.trim(), qty: q, unitCost: c }]);
    }
    setExistingId(""); setMaster(""); setVariant(""); setBrandSel(""); setBrandNew(""); setSubBrand(""); setUom(""); setQty(""); setCost("");
  };

  const onFile = (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setUpErr("");
    pickFile(f, setAttach, setUpErr);
  };

  const savePurchase = () => {
    if (!lines.length) return;
    let suppliers = data.suppliers;
    let sid = supplierId, sname = "";
    if (sid === "__new__") {
      if (!newSup.name) return;
      sid = uid();
      suppliers = [...suppliers, { ...newSup, address: "", id: sid, createdAt: Date.now() }];
      sname = newSup.name;
    } else {
      const s = data.suppliers.find((x) => x.id === sid);
      sname = s?.name || "";
    }
    let stock = [...data.stock];
    let nsc = data.nextStockCode || 1;
    const supSel = data.suppliers.find((x) => x.id === supplierId);
    const autoMode = supplierId === "__new__" ? (newSup.vatRegistered ? "excl" : "none") : (supSel?.vatRegistered ? "excl" : "none");
    const vMode = vatMode || autoMode;
    const vRate = vMode === "none" ? 0 : Number(data.vat?.rate || 16);
    const canReclaim = !!data.vat?.enabled;
    const costEx = (c) => {
      const num = Number(c);
      if (vRate <= 0) return num;
      if (vMode === "incl") return canReclaim ? r2(num / (1 + vRate / 100)) : num;
      if (vMode === "excl") return canReclaim ? num : r2(num * (1 + vRate / 100));
      return num;
    };
    const items = lines.map((l) => {
      if (l.stockId) {
        stock = stock.map((s) => s.id === l.stockId ? { ...s, qty: r2(s.qty + l.qty), cost: costEx(l.unitCost) || s.cost } : s);
        return l;
      }
      const id = uid();
      stock = [...stock, { id, code: stockCodeStr(nsc++), name: l.name, master: l.master || l.name, variant: l.variant || "", brand: l.brand || "", subBrand: l.subBrand || "", uom: l.uom || "", qty: r2(l.qty), cost: costEx(l.unitCost) }];
      return { ...l, stockId: id };
    });
    const sum = r2(lines.reduce((a, l) => a + l.qty * l.unitCost, 0));
    let netAmount = sum, vatAmount = 0, grossAmount = sum;
    if (vMode === "excl") { vatAmount = r2(sum * vRate / 100); grossAmount = r2(sum + vatAmount); }
    if (vMode === "incl") { netAmount = r2(sum / (1 + vRate / 100)); vatAmount = r2(sum - netAmount); }
    const pid = uid();
    if (attach) window.storage.set(`garage-pinv:${pid}`, JSON.stringify(attach)).catch(() => {});
    save({
      ...data, stock, suppliers, nextPO: data.nextPO + 1, nextStockCode: nsc,
      purchases: [{
        id: pid, poNo: data.nextPO, supplierId: sid || null, supplierName: sname,
        date: Date.now(), items, vatMode: vMode, vatRate: vRate, vatAmount, netAmount, grossAmount,
        attach: attach ? { name: attach.name, type: attach.type } : null,
        invoiceNo: invoiceNo.trim(),
        paid, paidAt: paid ? (paidAt || todayStr()) : null, paidRef: paid ? paidRef.trim() : "",
        dueDate: paid ? null : (dueDate || null),
      }, ...data.purchases],
    });
    back();
  };

  return (
    <div>
      <Btn kind="ghost" small onClick={back}>← Stock</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700, fontSize: 16 }}>PURCHASE PO-{data.nextPO}</div>
        <Label>Supplier</Label>
        <select style={selS} value={supplierId} onChange={(e) => setSupplierId(e.target.value)}>
          <option value="">Select supplier…</option>
          {data.suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}{s.kraPin ? ` (PIN ${s.kraPin})` : ""}</option>)}
          <option value="__new__">+ New supplier</option>
        </select>
        {supplierId === "__new__" && (<>
          <input style={inpS} placeholder="Supplier name" value={newSup.name} onChange={(e) => setNewSup({ ...newSup, name: e.target.value })} />
          <div style={{ display: "flex", gap: 8 }}>
            <input style={inpS} placeholder="+254" value={newSup.phone} onChange={(e) => setNewSup({ ...newSup, phone: sanitizePhone(e.target.value) })} />
            <input style={inpS} placeholder="KRA PIN" value={newSup.kraPin} onChange={(e) => setNewSup({ ...newSup, kraPin: e.target.value })} />
          </div>
          <input style={inpS} placeholder="Email" value={newSup.email} onChange={(e) => setNewSup({ ...newSup, email: e.target.value })} />
          <select style={selS} value={newSup.vatRegistered ? "yes" : "no"} onChange={(e) => setNewSup({ ...newSup, vatRegistered: e.target.value === "yes" })}>
            <option value="no">Supplier not VAT-registered</option>
            <option value="yes">Supplier charges VAT</option>
          </select>
        </>)}
        {(() => {
          const sup = data.suppliers.find((x) => x.id === supplierId);
          const auto = supplierId === "__new__" ? (newSup.vatRegistered ? "excl" : "none") : (sup?.vatRegistered ? "excl" : "none");
          const mode = vatMode || auto;
          const rate = Number(data.vat?.rate || 16);
          return (<>
            <Label>VAT on this purchase</Label>
            <select style={selS} value={mode} onChange={(e) => setVatMode(e.target.value)}>
              <option value="none">No VAT (supplier not registered)</option>
              <option value="excl">Prices EXCL. VAT — add {rate}%</option>
              <option value="incl">Prices INCL. VAT — extract {rate}%</option>
            </select>
            {!data.vat?.enabled && mode !== "none" && (
              <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>
                Not VAT-registered yet — this VAT isn't reclaimable, so it's added into the stock cost below.
              </div>
            )}
          </>);
        })()}
        <Label>Add items</Label>
        <select style={selS} value={existingId} onChange={(e) => setExistingId(e.target.value)}>
          <option value="">+ New part</option>
          {data.stock.map((s) => <option key={s.id} value={s.id}>{s.code ? `[${s.code}] ` : ""}{s.name}</option>)}
        </select>
        {!existingId && (<>
          <div style={{ display: "flex", gap: 6 }}>
            <input style={{ ...inpS, flex: 1.5 }} placeholder="Master item (Engine oil)" value={master} onChange={(e) => setMaster(e.target.value)} />
            <input style={{ ...inpS, width: 100 }} placeholder="Spec (20W50)" value={variant} onChange={(e) => setVariant(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <select style={{ ...selS, flex: 1 }} value={brandSel} onChange={(e) => setBrandSel(e.target.value)}>
              <option value="">Brand (e.g. Shell)…</option>
              {[...new Set(data.stock.map((s) => s.brand).filter(Boolean))].sort().map((b) => <option key={b} value={b}>{b}</option>)}
              <option value="__new__">+ New brand</option>
            </select>
            <input style={{ ...inpS }} placeholder="Sub-brand / part no. (R4)" value={subBrand} onChange={(e) => setSubBrand(e.target.value)} />
            <input style={{ ...inpS, width: 76 }} placeholder="UOM" value={uom} onChange={(e) => setUom(e.target.value)} />
          </div>
          {brandSel === "__new__" && (
            <input style={inpS} placeholder="New brand name" value={brandNew} onChange={(e) => setBrandNew(e.target.value)} />
          )}
        </>)}
        <div style={{ display: "flex", gap: 6 }}>
          <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" placeholder={`Qty${uom ? ` (${uom})` : ""}`} value={qty} onChange={(e) => setQty(e.target.value)} />
          <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" placeholder={`Cost per ${uom || (existingId ? (data.stock.find((x) => x.id === existingId)?.uom || "unit") : "unit")}`} value={cost} onChange={(e) => setCost(e.target.value)} />
          <Btn small onClick={addLine}>Add</Btn>
        </div>
        {lines.map((l, i) => (
          <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px dashed ${T.line}`, fontSize: 14, marginTop: 4 }}>
            <span>{l.qty}{l.uom ? ` ${l.uom} ` : "× "}{l.name}</span>
            <span style={{ fontFamily: T.mono }}>
              {money(l.qty * l.unitCost)}
              <button onClick={() => setLines(lines.filter((_, x) => x !== i))} style={{ marginLeft: 10, background: "none", border: "none", color: T.danger, cursor: "pointer", fontWeight: 700 }}>✕</button>
            </span>
          </div>
        ))}
        {lines.length > 0 && (() => {
          const sum = lines.reduce((a, l) => a + l.qty * l.unitCost, 0);
          const sup = data.suppliers.find((x) => x.id === supplierId);
          const auto = supplierId === "__new__" ? (newSup.vatRegistered ? "excl" : "none") : (sup?.vatRegistered ? "excl" : "none");
          const mode = vatMode || auto;
          const r = Number(data.vat?.rate || 16);
          const canReclaim = !!data.vat?.enabled;
          let net = r2(sum), vat = 0, gross = r2(sum);
          if (mode === "excl") { vat = r2(sum * r / 100); gross = r2(sum + vat); }
          if (mode === "incl") { net = r2(sum / (1 + r / 100)); vat = r2(sum - net); }
          const stockCost = canReclaim ? net : gross;
          return (
            <div style={{ textAlign: "right", fontFamily: T.mono, marginTop: 8 }}>
              {vat > 0 && <div style={{ color: T.muted, fontSize: 13 }}>Net {money(net)} · VAT {money(vat)}</div>}
              <div style={{ color: T.accent, fontWeight: 700 }}>TOTAL {money(gross)}</div>
              {vat > 0 && <div style={{ color: T.muted, fontSize: 11 }}>Stock costed at {money(stockCost)} ({canReclaim ? "net of VAT" : "incl. non-reclaimable VAT"})</div>}
            </div>
          );
        })()}
        <Label>Purchase invoice (for accounting / tax)</Label>
        {attach ? (
          <div>
            {attach.type === "image"
              ? <img src={attach.dataUrl} alt="purchase invoice" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
              : <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, fontFamily: T.mono, fontSize: 13 }}>📄 {attach.name}</div>}
            <Btn small kind="danger" style={{ marginTop: 6 }} onClick={() => setAttach(null)}>Remove</Btn>
          </div>
        ) : (<>
          <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{ display: "none" }} onChange={onFile} />
          <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>⬆ Attach invoice (photo or PDF)</Btn>
          {upErr && <div style={{ fontSize: 12, color: T.danger, marginTop: 4 }}>{upErr}</div>}
        </>)}
        <input style={inpS} placeholder="Supplier invoice no. (optional)" value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} />
        <PayStatus paid={paid} paidAt={paidAt} paidRef={paidRef} dueDate={dueDate} onChange={onPayChange} />

	<div style={{ display: "flex", justifyContent: "center", marginTop: 12 }}>
  	<Btn onClick={savePurchase}>Save purchase → stock</Btn>
	</div>

      </Card>
    </div>
  );
}

// ---------- purchase edit (corrects stock by the difference) ----------
function PurchaseEdit({ data, save, pid, back }) {
  const p = data.purchases.find((x) => x.id === pid);
  const [supplierId, setSupplierId] = useState(p?.supplierId || "");
  const [vatMode, setVatMode] = useState(p?.vatMode || "");
  const [date, setDate] = useState(p ? new Date(p.date).toISOString().slice(0, 10) : "");
  const [lines, setLines] = useState(p ? p.items.map((it) => ({ ...it })) : []);
  const [att, setAtt] = useState(undefined);
  const [attChanged, setAttChanged] = useState(false);
  const [existingId, setExistingId] = useState("");
  const [master, setMaster] = useState("");
  const [variant, setVariant] = useState("");
  const [brandSel, setBrandSel] = useState("");
  const [brandNew, setBrandNew] = useState("");
  const brand = brandSel === "__new__" ? brandNew : brandSel;
  const [subBrand, setSubBrand] = useState("");
  const [uom, setUom] = useState("");
  const [qty, setQty] = useState("");
  const [cost, setCost] = useState("");
  const [upErr, setUpErr] = useState("");
  const [invoiceNo, setInvoiceNo] = useState(p?.invoiceNo || "");
  const [paid, setPaid] = useState(p ? p.paid !== false : true);
  const [paidAt, setPaidAt] = useState(p?.paidAt || todayStr());
  const [paidRef, setPaidRef] = useState(p?.paidRef || "");
  const [dueDate, setDueDate] = useState(p?.dueDate || "");
  const fileRef = useRef(null);

  const onPayChange = (patch) => {
    if ("paid" in patch) setPaid(patch.paid);
    if ("paidAt" in patch) setPaidAt(patch.paidAt);
    if ("paidRef" in patch) setPaidRef(patch.paidRef);
    if ("dueDate" in patch) setDueDate(patch.dueDate);
  };

  useEffect(() => {
    let alive = true;
    (async () => {
      if (!p?.attach) { setAtt(null); return; }
      try {
        const r = await window.storage.get(`garage-pinv:${pid}`);
        if (alive) setAtt(JSON.parse(r.value));
      } catch { if (alive) setAtt(null); }
    })();
    return () => { alive = false; };
  }, [pid]);

  if (!p) return null;

  const setLine = (i, patch) => setLines(lines.map((l, x) => x === i ? { ...l, ...patch } : l));

  const addLine = () => {
    const q = r2(Number(qty || 0)), c = Number(cost || 0);
    if (q <= 0) return;
    if (existingId) {
      const s = data.stock.find((x) => x.id === existingId);
      if (!s) return;
      setLines([...lines, { stockId: existingId, name: s.name, uom: s.uom || "", qty: q, unitCost: c || s.cost }]);
    } else {
      if (!master) return;
      const nm = [master, variant, brand, subBrand].map((x) => x.trim()).filter(Boolean).join(" ");
      setLines([...lines, { stockId: null, name: nm, master: master.trim(), variant: variant.trim(), brand: brand.trim(), subBrand: subBrand.trim(), uom: uom.trim(), qty: q, unitCost: c }]);
    }
    setExistingId(""); setMaster(""); setVariant(""); setBrandSel(""); setBrandNew(""); setSubBrand(""); setUom(""); setQty(""); setCost("");
  };

  const onFile = (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setUpErr("");
    pickFile(f, (a) => { setAtt(a); setAttChanged(true); }, setUpErr);
  };

  const saveEdit = () => {
    if (!lines.length) return;
    const dateTs = date ? new Date(date + "T12:00:00").getTime() : p.date;
    let stock = [...data.stock];
    let nsc = data.nextStockCode || 1;
    const lines2 = lines.filter((l) => Number(l.qty) > 0).map((l) => {
      const cleaned = { ...l, qty: r2(Number(l.qty)), unitCost: Number(l.unitCost || 0) };
      if (cleaned.stockId) return cleaned;
      const id = uid();
      stock = [...stock, { id, code: stockCodeStr(nsc++), name: cleaned.name, master: cleaned.master || cleaned.name, variant: cleaned.variant || "", brand: cleaned.brand || "", subBrand: cleaned.subBrand || "", uom: cleaned.uom || "", qty: 0, cost: cleaned.unitCost }];
      return { ...cleaned, stockId: id };
    });
    const oldQ = {}; (p.items || []).forEach((it) => { if (it.stockId) oldQ[it.stockId] = r2((oldQ[it.stockId] || 0) + Number(it.qty || 0)); });
    const newQ = {}; lines2.forEach((it) => { newQ[it.stockId] = r2((newQ[it.stockId] || 0) + Number(it.qty || 0)); });
    const vMode = vatMode || "none";
    const vRate = vMode === "none" ? 0 : Number(data.vat?.rate || 16);
    const canReclaim = !!data.vat?.enabled;
    const costEx = (c) => {
      const num = Number(c);
      if (vRate <= 0) return num;
      if (vMode === "incl") return canReclaim ? r2(num / (1 + vRate / 100)) : num;
      if (vMode === "excl") return canReclaim ? num : r2(num * (1 + vRate / 100));
      return num;
    };
    const sum = r2(lines2.reduce((a, l) => a + l.qty * l.unitCost, 0));
    let netAmount = sum, vatAmount = 0, grossAmount = sum;
    if (vMode === "excl") { vatAmount = r2(sum * vRate / 100); grossAmount = r2(sum + vatAmount); }
    if (vMode === "incl") { netAmount = r2(sum / (1 + vRate / 100)); vatAmount = r2(sum - netAmount); }
    const lastCost = {}; lines2.forEach((it) => { lastCost[it.stockId] = costEx(it.unitCost); });
    const ids = new Set([...Object.keys(oldQ), ...Object.keys(newQ)]);
    stock = stock.map((s) => ids.has(s.id)
      ? { ...s, qty: Math.max(0, r2(s.qty + (newQ[s.id] || 0) - (oldQ[s.id] || 0))), cost: lastCost[s.id] ?? s.cost }
      : s);
    const sup = data.suppliers.find((x) => x.id === supplierId);
    if (attChanged) {
      if (att) window.storage.set(`garage-pinv:${pid}`, JSON.stringify(att)).catch(() => {});
      else window.storage.delete(`garage-pinv:${pid}`).catch(() => {});
    }
    save({
      ...data, stock, nextStockCode: nsc,
      purchases: data.purchases.map((x) => x.id === pid ? {
        ...x, supplierId: supplierId || null, supplierName: sup?.name || x.supplierName || "",
        date: dateTs, items: lines2, vatMode: vMode, vatRate: vRate, vatAmount, netAmount, grossAmount,
        attach: attChanged ? (att ? { name: att.name, type: att.type } : null) : x.attach,
        invoiceNo: invoiceNo.trim(),
        paid, paidAt: paid ? (paidAt || todayStr()) : null, paidRef: paid ? paidRef.trim() : "",
        dueDate: paid ? null : (dueDate || null),
      } : x),
    });
    back();
  };

  const [delBlockedMsg, setDelBlockedMsg] = useState("");
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const deletePurchase = () => {
    const oldQ = {}; (p.items || []).forEach((it) => { if (it.stockId) oldQ[it.stockId] = r2((oldQ[it.stockId] || 0) + Number(it.qty || 0)); });
    const shortfalls = Object.keys(oldQ).map((id) => {
      const s = data.stock.find((x) => x.id === id);
      return { name: s?.name || "a part no longer in stock", after: r2((s?.qty ?? 0) - oldQ[id]) };
    }).filter((x) => x.after < 0);
    if (shortfalls.length) {
      setDelBlockedMsg(`Can't delete — ${shortfalls.map((x) => x.name).join(", ")} ${shortfalls.length > 1 ? "have" : "has"} already been used beyond this purchase's quantity. Remove those usages first.`);
      return;
    }
    setDelBlockedMsg("");
    setShowDeleteConfirm(true);
  };
  const confirmDeletePurchase = () => {
    const oldQ = {}; (p.items || []).forEach((it) => { if (it.stockId) oldQ[it.stockId] = r2((oldQ[it.stockId] || 0) + Number(it.qty || 0)); });
    const stock = data.stock.map((s) => oldQ[s.id] ? { ...s, qty: r2(s.qty - oldQ[s.id]) } : s);
    window.storage.delete(`garage-pinv:${pid}`).catch(() => {});
    save({ ...data, stock, purchases: data.purchases.filter((x) => x.id !== pid) });
    setShowDeleteConfirm(false);
    back();
  };

  return (
    <div>
      <Btn kind="ghost" small onClick={back}>← Stock</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700, fontSize: 16 }}>EDIT PURCHASE PO-{p.poNo}</div>
        <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>
          Corrections adjust stock by the difference. Stock can't go below zero (e.g. if it's already been used on jobs).
        </div>
        <Label>Supplier</Label>
        <select style={selS} value={supplierId} onChange={(e) => setSupplierId(e.target.value)}>
          <option value="">— {p.supplierName || "No supplier"} —</option>
          {data.suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}{s.kraPin ? ` (PIN ${s.kraPin})` : ""}</option>)}
        </select>
        <Label>Purchase date</Label>
        <input style={inpS} type="date" value={date} onChange={(e) => setDate(e.target.value)} />
        <Label>VAT on this purchase</Label>
        <select style={selS} value={vatMode || "none"} onChange={(e) => setVatMode(e.target.value)}>
          <option value="none">No VAT (supplier not registered)</option>
          <option value="excl">Prices EXCL. VAT — add {Number(data.vat?.rate || 16)}%</option>
          <option value="incl">Prices INCL. VAT — extract {Number(data.vat?.rate || 16)}%</option>
        </select>
        {!data.vat?.enabled && vatMode && vatMode !== "none" && (
          <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>
            Not VAT-registered yet — this VAT isn't reclaimable, so it's added into the stock cost.
          </div>
        )}
        <Label>Items</Label>
        {lines.map((l, i) => (
          <div key={i} style={{ borderBottom: `1px dashed ${T.line}`, padding: "6px 0" }}>
            <div style={{ fontSize: 14, fontWeight: 700 }}>{l.name}{l.uom ? <span style={{ color: T.muted, fontWeight: 400 }}> ({l.uom})</span> : ""}</div>
            <div style={{ display: "flex", gap: 6, marginTop: 4, alignItems: "center" }}>
              <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" value={l.qty}
                onChange={(e) => setLine(i, { qty: e.target.value })} placeholder="Qty" />
              <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" value={l.unitCost}
                onChange={(e) => setLine(i, { unitCost: e.target.value })} placeholder="Unit cost" />
              <span style={{ fontFamily: T.mono, fontSize: 13, minWidth: 70, textAlign: "right" }}>{money(Number(l.qty || 0) * Number(l.unitCost || 0))}</span>
              <button onClick={() => setLines(lines.filter((_, x) => x !== i))}
                style={{ background: "none", border: "none", color: T.danger, cursor: "pointer", fontWeight: 700 }}>✕</button>
            </div>
          </div>
        ))}
        <Label>Add item</Label>
        <select style={selS} value={existingId} onChange={(e) => setExistingId(e.target.value)}>
          <option value="">+ New part</option>
          {data.stock.map((s) => <option key={s.id} value={s.id}>{s.code ? `[${s.code}] ` : ""}{s.name}</option>)}
        </select>
        {!existingId && (<>
          <div style={{ display: "flex", gap: 6 }}>
            <input style={{ ...inpS, flex: 1.5 }} placeholder="Master item" value={master} onChange={(e) => setMaster(e.target.value)} />
            <input style={{ ...inpS, width: 100 }} placeholder="Spec" value={variant} onChange={(e) => setVariant(e.target.value)} />
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <select style={{ ...selS, flex: 1 }} value={brandSel} onChange={(e) => setBrandSel(e.target.value)}>
              <option value="">Brand…</option>
              {[...new Set(data.stock.map((s) => s.brand).filter(Boolean))].sort().map((b) => <option key={b} value={b}>{b}</option>)}
              <option value="__new__">+ New brand</option>
            </select>
            <input style={{ ...inpS }} placeholder="Sub-brand / part no." value={subBrand} onChange={(e) => setSubBrand(e.target.value)} />
            <input style={{ ...inpS, width: 76 }} placeholder="UOM" value={uom} onChange={(e) => setUom(e.target.value)} />
          </div>
          {brandSel === "__new__" && (
            <input style={inpS} placeholder="New brand name" value={brandNew} onChange={(e) => setBrandNew(e.target.value)} />
          )}
        </>)}
        <div style={{ display: "flex", gap: 6 }}>
          <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" placeholder="Qty" value={qty} onChange={(e) => setQty(e.target.value)} />
          <input style={{ ...inpS, marginBottom: 0 }} type="number" step="any" min="0" placeholder="Unit cost" value={cost} onChange={(e) => setCost(e.target.value)} />
          <Btn small onClick={addLine}>Add</Btn>
        </div>
        {(() => {
          const sum = lines.reduce((a, l) => a + Number(l.qty || 0) * Number(l.unitCost || 0), 0);
          const mode = vatMode || "none";
          const r = Number(data.vat?.rate || 16);
          let net = r2(sum), vat = 0, gross = r2(sum);
          if (mode === "excl") { vat = r2(sum * r / 100); gross = r2(sum + vat); }
          if (mode === "incl") { net = r2(sum / (1 + r / 100)); vat = r2(sum - net); }
          return (
            <div style={{ textAlign: "right", fontFamily: T.mono, marginTop: 8 }}>
              {vat > 0 && <div style={{ color: T.muted, fontSize: 13 }}>Net {money(net)} · VAT {money(vat)}</div>}
              <div style={{ color: T.accent, fontWeight: 700 }}>TOTAL {money(gross)}</div>
            </div>
          );
        })()}

        <Label>Purchase invoice attachment</Label>
        {att === undefined && p.attach && <div style={{ color: T.muted, fontSize: 13 }}>Loading attachment…</div>}
        {att && (
          <div>
            {att.type === "image"
              ? <img src={att.dataUrl} alt="purchase invoice" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
              : <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, fontFamily: T.mono, fontSize: 13 }}>📄 {att.name}</div>}
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>Replace</Btn>
              <Btn small kind="danger" onClick={() => { setAtt(null); setAttChanged(true); }}>Remove</Btn>
            </div>
          </div>
        )}
        {att === null && <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>⬆ Attach invoice (photo or PDF)</Btn>}
        <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{ display: "none" }} onChange={onFile} />
        {upErr && <div style={{ fontSize: 12, color: T.danger, marginTop: 4 }}>{upErr}</div>}
        <input style={inpS} placeholder="Supplier invoice no. (optional)" value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} />
        <PayStatus paid={paid} paidAt={paidAt} paidRef={paidRef} dueDate={dueDate} onChange={onPayChange} />

        <Btn onClick={saveEdit} style={{ width: "100%", marginTop: 14 }}>Save corrections → adjust stock</Btn>
        <Btn kind="danger" small style={{ marginTop: 10 }} onClick={deletePurchase}>Delete purchase (reverses stock)</Btn>
        {delBlockedMsg && <div style={{ fontSize: 12, color: T.danger, marginTop: 6 }}>{delBlockedMsg}</div>}
      </Card>
      <ConfirmModal
        open={showDeleteConfirm}
        title="Delete purchase"
        message={`Delete PO-${p.poNo}? This reverses the stock it added. This can't be undone.`}
        onYes={confirmDeletePurchase}
        onNo={() => setShowDeleteConfirm(false)}
      />
    </div>
  );
}

// ---------- tools & machinery ----------
function useToolPhotos(toolId) {
  usePhotoSync();
  const owner = "tool:" + toolId;
  const photos = PhotoSync.list(owner)[""] || [];
  useEffect(() => { PhotoSync.ensureLoaded(owner); });
  const save = (next) => photoChanges(owner, "", photos, next);
  return [photos, save];
}

// cost basis for a job part even after its stock row has been deleted — prefers the cost
// frozen on the part at delete time, then falls back to the live stock row, then sell price.
const partCost = (data, p) => {
  if (p.costAtDelete !== undefined && p.costAtDelete !== null) return Number(p.costAtDelete);
  const s = data.stock.find((s2) => s2.id === p.stockId);
  if (s) return Number(s.cost ?? 0);
  return Number(p.price ?? 0);
};

// ---------- expenses / payables ledger ----------
// An expense is money paid out that never touches stock: contracted labour, consumables,
// one-off job parts you won't keep in inventory, or overheads with no job at all.
const expenseAmount = (e) => Number(e.amount || 0);
const isOverdue = (e) => !e.paid && !!e.dueDate && dayTs(e.dueDate) < Date.now();
const payeeLabel = (data, e) => {
  if (e.supplierId) {
    const s = data.suppliers.find((x) => x.id === e.supplierId);
    if (s) return s.name;
  }
  return e.payeeName || "—";
};

function ExpenseForm({ data, save, expId, jobId, back }) {
  const existing = expId ? data.expenses.find((x) => x.id === expId) : null;
  const [description, setDescription] = useState(existing?.description || "");
  const [amount, setAmount] = useState(existing ? String(existing.amount) : "");
  const [supplierId, setSupplierId] = useState(existing?.supplierId || null);
  const [payeeName, setPayeeName] = useState(existing?.payeeName || "");
  const [payeeContact, setPayeeContact] = useState(existing?.payeeContact || "");
  const [invoiceNo, setInvoiceNo] = useState(existing?.invoiceNo || "");
  const [invoiceDate, setInvoiceDate] = useState(existing?.invoiceDate || "");
  const [vatAmount, setVatAmount] = useState(existing?.vatAmount ? String(existing.vatAmount) : "");
  const [paid, setPaid] = useState(existing ? !!existing.paid : true);
  const [paidAt, setPaidAt] = useState(existing?.paidAt || todayStr());
  const [paidRef, setPaidRef] = useState(existing?.paidRef || "");
  const [dueDate, setDueDate] = useState(existing?.dueDate || "");

  const onPayChange = (patch) => {
    if ("paid" in patch) setPaid(patch.paid);
    if ("paidAt" in patch) setPaidAt(patch.paidAt);
    if ("paidRef" in patch) setPaidRef(patch.paidRef);
    if ("dueDate" in patch) setDueDate(patch.dueDate);
  };
  const onPayeeChange = (patch) => {
    if ("supplierId" in patch) setSupplierId(patch.supplierId);
    if ("payeeName" in patch) setPayeeName(patch.payeeName);
    if ("payeeContact" in patch) setPayeeContact(patch.payeeContact);
  };

  const canSave = description.trim() && Number(amount) > 0;
  const doSave = () => {
    if (!canSave) return;
    const rec = {
      id: existing?.id || uid(), no: existing?.no || data.nextExp,
      description: description.trim(), amount: Number(amount),
      jobId: existing ? (existing.jobId ?? null) : (jobId || null),
      supplierId, payeeName: payeeName.trim(), payeeContact: payeeContact.trim(),
      invoiceNo: invoiceNo.trim(), invoiceDate: invoiceDate || null,
      vatAmount: Number(vatAmount || 0),
      paid, paidAt: paid ? (paidAt || todayStr()) : null, paidRef: paid ? paidRef.trim() : "",
      dueDate: paid ? null : (dueDate || null),
      createdAt: existing?.createdAt || Date.now(),
    };
    save({
      ...data,
      nextExp: existing ? data.nextExp : data.nextExp + 1,
      expenses: existing ? data.expenses.map((x) => x.id === existing.id ? rec : x) : [rec, ...data.expenses],
    });
    back();
  };
  const doDelete = () => {
    save({ ...data, expenses: data.expenses.filter((x) => x.id !== existing.id) });
    back();
  };

  return (
    <div>
      <Btn kind="ghost" small onClick={back}>← Back</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700, fontSize: 16 }}>
          {existing ? `EXPENSE EXP-${String(existing.no).padStart(4, "0")}` : "NEW EXPENSE"}
        </div>
        <Label>Description — call it whatever's useful to you</Label>
        <input style={inpS} placeholder="e.g. Bodywork subcontract — Vincent / Fuel / Office rent" value={description} onChange={(e) => setDescription(e.target.value)} />
        <Label>Amount</Label>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={{ ...inpS, flex: 1 }} type="number" step="any" min="0" placeholder="Amount" value={amount} onChange={(e) => setAmount(e.target.value)} />
          <input style={{ ...inpS, flex: 1 }} type="number" step="any" min="0" placeholder="VAT included (optional, your records only)" value={vatAmount} onChange={(e) => setVatAmount(e.target.value)} />
        </div>
        <SupplierOrContact data={data} supplierId={supplierId} payeeName={payeeName} payeeContact={payeeContact} onChange={onPayeeChange} />
        <Label>Invoice / receipt reference</Label>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={{ ...inpS, flex: 1 }} placeholder="Invoice / receipt no." value={invoiceNo} onChange={(e) => setInvoiceNo(e.target.value)} />
          <input style={{ ...inpS, flex: 1 }} type="date" title="Date the invoice is for" value={invoiceDate} onChange={(e) => setInvoiceDate(e.target.value)} />
        </div>
        <PayStatus paid={paid} paidAt={paidAt} paidRef={paidRef} dueDate={dueDate} onChange={onPayChange} />
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <Btn onClick={doSave} style={{ flex: 1 }}>{existing ? "Save changes" : "Add expense"}</Btn>
          {existing && <Btn kind="danger" small onClick={doDelete}>Delete</Btn>}
        </div>
      </Card>
    </div>
  );
}

// jobId: when set, shows only that job's costs (embedded in the job screen).
// Omitted entirely: shows every expense (used by the Finance tab).
function ExpensesList({ data, save, jobId, openAdd, openEdit }) {
  const list = (jobId ? data.expenses.filter((e) => e.jobId === jobId) : data.expenses)
    .slice().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const total = r2(list.reduce((a, e) => a + expenseAmount(e), 0));
  const markPaidQuick = (e) => {
    save({ ...data, expenses: data.expenses.map((x) => x.id === e.id ? { ...x, paid: true, paidAt: todayStr(), dueDate: null } : x) });
  };
  return (
    <div>
      {!list.length && <div style={{ color: T.muted, fontSize: 13, padding: "6px 0" }}>{jobId ? "No costs logged on this job yet." : "No expenses logged yet."}</div>}
      {list.map((e) => {
        const overdue = isOverdue(e);
        return (
          <Card key={e.id} onClick={() => openEdit(e.id)}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontWeight: 700 }}>{e.description}</div>
                <div style={{ fontSize: 12, color: T.muted }}>{payeeLabel(data, e)}{e.invoiceNo ? ` · Inv ${e.invoiceNo}` : ""}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontFamily: T.mono, fontWeight: 700 }}>{money(expenseAmount(e))}</div>
                {e.paid
                  ? <div style={{ fontSize: 11, color: T.ok }}>Paid{e.paidAt ? ` ${dateStr(dayTs(e.paidAt))}` : ""}</div>
                  : <div style={{ fontSize: 11, color: overdue ? T.danger : T.muted, fontWeight: overdue ? 800 : 400 }}>{overdue ? "OVERDUE" : "Due"}{e.dueDate ? ` ${dateStr(dayTs(e.dueDate))}` : ""}</div>}
              </div>
            </div>
            {!e.paid && (
              <div style={{ marginTop: 6 }}>
                <Btn small kind="ghost" onClick={(ev) => { ev.stopPropagation(); markPaidQuick(e); }}>✓ Mark paid today</Btn>
              </div>
            )}
          </Card>
        );
      })}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
        <Btn small onClick={openAdd}>+ {jobId ? "Add cost" : "Add expense"}</Btn>
        {list.length > 0 && <div style={{ fontFamily: T.mono, fontWeight: 700, color: T.accent }}>TOTAL {money(total)}</div>}
      </div>
    </div>
  );
}

function ToolsList({ data, save, openTool, openNew }) {
  const [q, setQ] = useState("");
  const [readings, setReadings] = useState({});
  const supName = (id) => data.suppliers.find((s) => s.id === id)?.name || "";
  const query = q.trim().toLowerCase();
  const match = (t) => !query ||
    [t.code, t.name, t.category, t.brand, t.model, t.serial, t.location, t.status, supName(t.supplierId)]
      .some((f) => (f || "").toLowerCase().includes(query));
  const filtered = (data.tools || []).filter(match);
  const logReading = (t) => {
    const reading = Number(readings[t.id]);
    if (!(reading > 0)) return;
    save({
      ...data,
      tools: data.tools.map((x) => x.id === t.id
        ? { ...x, currentHours: reading, hoursLog: [...(x.hoursLog || []), { at: Date.now(), reading }] }
        : x),
    });
    setReadings({ ...readings, [t.id]: "" });
  };
  return (
    <div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14, alignItems: "stretch" }}>
        <input style={{ ...inpS, marginBottom: 0, flex: 1 }} placeholder="Search tools — code, brand, serial, location…" value={q} onChange={(e) => setQ(e.target.value)} />
        <Btn onClick={openNew} style={{ whiteSpace: "nowrap", flexShrink: 0 }}>+ Add tool / machine</Btn>
      </div>
      {!(data.tools || []).length && <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>No tools registered yet.</div>}
      {query && !filtered.length && <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>No tools match &quot;{q}&quot;</div>}
      {filtered.map((t) => {
        const due = toolDue(t);
        const dueColor = due?.state === "over" ? T.danger : due?.state === "due" ? T.accent : T.muted;
        return (
          <Card key={t.id}>
            <div onClick={() => openTool(t.id)} style={{ cursor: "pointer" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontWeight: 700 }}>{t.name}</span>
                {due && due.state !== "ok" && (
                  <span style={{ fontSize: 9, fontWeight: 900, background: dueColor, color: "#15130e", padding: "2px 6px", borderRadius: 3 }}>
                    {due.state === "over" ? "SERVICE OVERDUE" : "SERVICE DUE"}
                  </span>
                )}
              </div>
              <div style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>
                {t.code} · {[t.brand, t.model].filter(Boolean).join(" ")}{t.serial ? ` · SN ${t.serial}` : ""}
              </div>
              <div style={{ fontSize: 13, color: T.muted }}>
                {[t.category, t.location, t.status].filter(Boolean).join(" · ")}
                {due && <span style={{ color: dueColor, fontFamily: T.mono }}> · {due.label}</span>}
              </div>
            </div>
            {t.serviceType === "hours" && (
              <div style={{ display: "flex", gap: 6, marginTop: 8, alignItems: "center" }} onClick={(e) => e.stopPropagation()}>
                <span style={{ fontFamily: T.mono, fontSize: 12, color: T.muted }}>meter {t.currentHours || 0} h</span>
                <input style={{ ...inpS, marginBottom: 0, width: 110 }} type="number" step="any" min="0" placeholder="New reading"
                  value={readings[t.id] || ""} onChange={(e) => setReadings({ ...readings, [t.id]: e.target.value })} />
                <Btn small onClick={() => logReading(t)}>Log hrs</Btn>
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

function ToolForm({ data, save, toolId, back }) {
  const existing = (data.tools || []).find((x) => x.id === toolId);
  const [f, setF] = useState(existing || {
    name: "", category: "", brand: "", model: "", serial: "", location: "", status: "In service",
    serviceType: "none", intervalMonths: "", nextServiceDue: null, serviceIntervalHours: "",
    currentHours: 0, lastServiceHours: 0, purchaseDate: "", supplierId: "", cost: "", notes: "",
  });
  const [dueDate, setDueDate] = useState(existing?.nextServiceDue ? new Date(existing.nextServiceDue).toISOString().slice(0, 10) : "");
  const [photos, savePhotos] = useToolPhotos(toolId || "new");
  const [att, setAtt] = useState(undefined);
  const [attChanged, setAttChanged] = useState(false);
  const [upErr, setUpErr] = useState("");
  const fileRef = useRef(null);

  useEffect(() => {
    let alive = true;
    (async () => {
      if (!existing?.attach) { setAtt(null); return; }
      try {
        const r = await window.storage.get(`garage-toolatt:${toolId}`);
        if (alive) setAtt(JSON.parse(r.value));
      } catch { if (alive) setAtt(null); }
    })();
    return () => { alive = false; };
  }, [toolId]);

  const onFile = (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setUpErr("");
    pickFile(file, (a) => { setAtt(a); setAttChanged(true); }, setUpErr);
  };

  const submit = () => {
    if (!f.name) return;
    const nextDue = f.serviceType === "date" && dueDate ? new Date(dueDate + "T12:00:00").getTime() : (f.serviceType === "date" ? f.nextServiceDue : null);
    const id = existing ? toolId : uid();
    if (attChanged) {
      if (att) window.storage.set(`garage-toolatt:${id}`, JSON.stringify(att)).catch(() => {});
      else window.storage.delete(`garage-toolatt:${id}`).catch(() => {});
    }
    const rec = {
      ...f, nextServiceDue: nextDue,
      attach: attChanged ? (att ? { name: att.name, type: att.type } : null) : (existing?.attach || null),
    };
    if (existing) {
      save({ ...data, tools: data.tools.map((x) => x.id === toolId ? { ...x, ...rec } : x) });
    } else {
      save({
        ...data, nextToolCode: (data.nextToolCode || 1) + 1,
        tools: [...(data.tools || []), { ...rec, id, code: toolCodeStr(data.nextToolCode || 1), createdAt: Date.now(), hoursLog: [], serviceLog: [] }],
      });
    }
    back();
  };

  const markServiced = () => {
    if (!existing) return;
    const now = Date.now();
    let patch = { lastServicedAt: now, serviceLog: [...(existing.serviceLog || []), { at: now, reading: existing.serviceType === "hours" ? Number(existing.currentHours || 0) : undefined }] };
    if (existing.serviceType === "hours") patch.lastServiceHours = Number(existing.currentHours || 0);
    if (existing.serviceType === "date") {
      const m = Number(existing.intervalMonths || f.intervalMonths || 0);
      if (m > 0) { const d = new Date(); d.setMonth(d.getMonth() + m); patch.nextServiceDue = d.getTime(); setDueDate(d.toISOString().slice(0, 10)); }
      else patch.nextServiceDue = null;
    }
    save({ ...data, tools: data.tools.map((x) => x.id === toolId ? { ...x, ...patch } : x) });
  };

  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
  const deleteTool = () => {
    PhotoSync.removeOwner("tool:" + toolId);
    window.storage.delete(`garage-toolph:${toolId}`).catch(() => {});
    window.storage.delete(`garage-toolatt:${toolId}`).catch(() => {});
    save({ ...data, tools: data.tools.filter((x) => x.id !== toolId) });
    setShowDeleteConfirm(false);
    back();
  };

  const due = existing ? toolDue(existing) : null;

  return (
    <div>
      <Btn kind="ghost" small onClick={back}>← Tools</Btn>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <div style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700, fontSize: 16 }}>
          {existing ? `${existing.code} — EDIT` : `NEW TOOL ${toolCodeStr(data.nextToolCode || 1)}`}
        </div>
        {due && due.state !== "ok" && (
          <div style={{ marginTop: 6, color: due.state === "over" ? T.danger : T.accent, fontWeight: 700, fontSize: 13 }}>
            🔧 {due.label}
          </div>
        )}
        <Label>Name / description</Label>
        <input style={inpS} placeholder="e.g. Air compressor 500L" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} />
        <Label>Category</Label>
        <select style={selS} value={f.category} onChange={(e) => setF({ ...f, category: e.target.value })}>
          <option value="">Select…</option>
          {TOOL_CATS.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={inpS} placeholder="Brand" value={f.brand} onChange={(e) => setF({ ...f, brand: e.target.value })} />
          <input style={inpS} placeholder="Model" value={f.model} onChange={(e) => setF({ ...f, model: e.target.value })} />
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={inpS} placeholder="Serial number" value={f.serial} onChange={(e) => setF({ ...f, serial: e.target.value })} />
          <input style={inpS} placeholder="Location / assigned to" value={f.location} onChange={(e) => setF({ ...f, location: e.target.value })} />
        </div>
        <Label>Status</Label>
        <select style={selS} value={f.status} onChange={(e) => setF({ ...f, status: e.target.value })}>
          {TOOL_STATUS.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>

        <Label>Service schedule</Label>
        <select style={selS} value={f.serviceType} onChange={(e) => setF({ ...f, serviceType: e.target.value })}>
          <option value="none">No schedule</option>
          <option value="date">Date-based (e.g. lift, calibration)</option>
          <option value="hours">Working-hours based (e.g. compressor)</option>
        </select>
        {f.serviceType === "date" && (
          <div style={{ display: "flex", gap: 6 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: T.muted, marginBottom: 2 }}>Next service due</div>
              <input style={inpS} type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} />
            </div>
            <div style={{ width: 120 }}>
              <div style={{ fontSize: 11, color: T.muted, marginBottom: 2 }}>Interval (months)</div>
              <input style={inpS} type="number" min="0" placeholder="e.g. 6" value={f.intervalMonths ?? ""} onChange={(e) => setF({ ...f, intervalMonths: e.target.value })} />
            </div>
          </div>
        )}
        {f.serviceType === "hours" && (
          <div style={{ display: "flex", gap: 6 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: T.muted, marginBottom: 2 }}>Service every (hours)</div>
              <input style={inpS} type="number" step="any" min="0" placeholder="e.g. 500" value={f.serviceIntervalHours ?? ""} onChange={(e) => setF({ ...f, serviceIntervalHours: e.target.value })} />
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, color: T.muted, marginBottom: 2 }}>Current meter (hours)</div>
              <input style={inpS} type="number" step="any" min="0" value={f.currentHours ?? ""} onChange={(e) => setF({ ...f, currentHours: e.target.value })} />
            </div>
          </div>
        )}
        {existing && f.serviceType !== "none" && (
          <Btn small onClick={markServiced}>✓ Mark serviced now</Btn>
        )}
        {existing && f.serviceType === "hours" && (existing.hoursLog || []).length > 0 && (
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 11, color: T.muted, textTransform: "uppercase", letterSpacing: 1 }}>Hours log</div>
            {[...existing.hoursLog].slice(-5).reverse().map((h, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontFamily: T.mono, fontSize: 12, color: T.muted, padding: "3px 0" }}>
                <span>{dateTimeStr(h.at)}</span><span>{h.reading} h</span>
              </div>
            ))}
          </div>
        )}
        {existing && (existing.serviceLog || []).length > 0 && (
          <div style={{ marginTop: 8 }}>
            <div style={{ fontSize: 11, color: T.muted, textTransform: "uppercase", letterSpacing: 1 }}>Service history</div>
            {[...existing.serviceLog].slice(-5).reverse().map((s, i) => (
              <div key={i} style={{ fontFamily: T.mono, fontSize: 12, color: T.muted, padding: "3px 0" }}>
                Serviced {dateTimeStr(s.at)}{s.reading !== undefined ? ` at ${s.reading} h` : ""}
              </div>
            ))}
          </div>
        )}

        <Label>Purchase details</Label>
        <div style={{ display: "flex", gap: 6 }}>
          <input style={inpS} type="date" value={f.purchaseDate || ""} onChange={(e) => setF({ ...f, purchaseDate: e.target.value })} />
          <input style={inpS} type="number" step="any" min="0" placeholder="Cost" value={f.cost ?? ""} onChange={(e) => setF({ ...f, cost: e.target.value })} />
        </div>
        <select style={selS} value={f.supplierId || ""} onChange={(e) => setF({ ...f, supplierId: e.target.value })}>
          <option value="">Supplier…</option>
          {data.suppliers.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <Label>Receipt / invoice</Label>
        {att === undefined && existing?.attach && <div style={{ color: T.muted, fontSize: 13 }}>Loading attachment…</div>}
        {att && (
          <div>
            {att.type === "image"
              ? <img src={att.dataUrl} alt="receipt" style={{ width: "100%", borderRadius: 8, border: `1px solid ${T.line}` }} />
              : <div style={{ background: T.panel2, border: `1px solid ${T.line}`, borderRadius: 8, padding: 12, fontFamily: T.mono, fontSize: 13 }}>📄 {att.name}</div>}
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>Replace</Btn>
              <Btn small kind="danger" onClick={() => { setAtt(null); setAttChanged(true); }}>Remove</Btn>
            </div>
          </div>
        )}
        {att === null && <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>⬆ Attach receipt (photo or PDF)</Btn>}
        <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{ display: "none" }} onChange={onFile} />
        {upErr && <div style={{ fontSize: 12, color: T.danger, marginTop: 4 }}>{upErr}</div>}

        {existing && (<>
          <Label>Photos (tool + serial plate)</Label>
          <PhotoGrid photos={photos}
            onAdd={(added) => savePhotos([...photos, ...added])}
            onRemove={(id) => savePhotos(photos.filter((p) => p.id !== id))} />
        </>)}

        <Label>Notes</Label>
        <textarea style={{ ...inpS, resize: "vertical" }} rows={2} value={f.notes || ""} onChange={(e) => setF({ ...f, notes: e.target.value })} />
	
	<div style={{ display: "flex", justifyContent: "center", width: "100%", marginTop: 8 }}>
  	<Btn onClick={submit}>
    	{existing ? "Save changes" : "Add tool"}
  	</Btn>
	</div>

        {existing && <Btn kind="danger" small style={{ marginTop: 10 }} onClick={() => setShowDeleteConfirm(true)}>Delete tool</Btn>}
        {!existing && <div style={{ fontSize: 12, color: T.muted, marginTop: 8 }}>Photos and hours logging become available after saving.</div>}
      </Card>
      <ConfirmModal
        open={showDeleteConfirm}
        title="Delete tool"
        message={`Delete ${existing?.name || "this tool"}? This can't be undone.`}
        onYes={deleteTool}
        onNo={() => setShowDeleteConfirm(false)}
      />
    </div>
  );
}

// ---------- invoices ----------
function InvoicesTab({ data, jobTotal, openInvoice, openCustomer }) {
  const [q, setQ] = useState("");
  const jobs = Array.isArray(data?.jobs) ? data.jobs : [];
  const done = jobs.filter((j) => (j.status === "done" || j.status === "invoiced") && !j.legacy);
  if (!done.length && !(data.receipts || []).length) {
    return (
      <div style={{ color: T.muted, textAlign: "center", padding: 30 }}>
        Invoices appear here once jobs are marked DONE or INVOICED. Payments and deposits can be recorded any time — on the customer's page, or on the job card itself.
      </div>
    );
  }
  const paidOf = (j) => paidOnJob(data, j.id);
  const query = q.trim().toLowerCase();
  const customers = Array.isArray(data?.customers) ? data.customers : [];
  const vehicles = Array.isArray(data?.vehicles) ? data.vehicles : [];
  const filtered = !query ? done : done.filter((jr) => {
    try {
      const j = normalizeJob(jr);
      const c = customers.find((x) => x.id === j.customerId);
      const v = vehicles.find((x) => x.id === j.vehicleId);
      const hay = [
        j.invNo ? invNoStr(j.invNo) : "",
        String(j.invNo ?? ""),
        String(j.jobNo ?? ""),
        j.title || "",
        c?.name || "",
        v?.make || "",
        v?.model || "",
        v?.rego || "",
      ].join(" ").toLowerCase();
      return hay.includes(query);
    } catch (_) {
      return false;
    }
  });
  return (
    <div>
      <input
        style={{ ...inpS, marginBottom: 14 }}
        placeholder="Search invoice no, customer, vehicle, number plate…"
        value={q}
        onChange={(e) => setQ(e.target.value)}
      />
      {query && (
        <div style={{ fontSize: 11, letterSpacing: 1.5, color: T.muted, fontWeight: 800, margin: "0 0 6px" }}>
          RESULTS · {filtered.length}
        </div>
      )}
      {query && !filtered.length && (
        <div style={{ color: T.muted, textAlign: "center", padding: 20 }}>
          No invoices match &quot;{q}&quot;
        </div>
      )}
      {filtered.map((jr) => {
        const j = normalizeJob(jr);
        const t = jobTotal(j);
        const c = customers.find((x) => x.id === j.customerId);
        const v = vehicles.find((x) => x.id === j.vehicleId);
        const paid = paidOf(j);
        const ps = t.total > 0 && paid >= t.total ? { l: "PAID", c: T.ok } : paid > 0 ? { l: "PARTIAL", c: T.accent } : { l: "UNPAID", c: T.danger };
        return (
          <Card key={j.id} onClick={() => openInvoice(j.id)}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <span style={{ fontFamily: T.mono, color: T.accent, fontWeight: 700 }}>{j.invNo ? invNoStr(j.invNo) : `#${j.jobNo}`}</span>
              <span>
                <span style={{ fontSize: 10, letterSpacing: 1, fontWeight: 800, color: "#15130e", background: ps.c, padding: "3px 8px", borderRadius: 3, marginRight: 6 }}>{ps.l}</span>
                <StatusPill status={j.status} />
              </span>
            </div>
            <div style={{ fontWeight: 700, margin: "4px 0" }}>{j.title}</div>
            <div style={{ color: T.muted, fontSize: 13 }}>{c?.name} · {v ? `${v.make} ${v.model}${v.rego ? " · " + v.rego : ""}` : ""}</div>
            <div style={{ fontFamily: T.mono, fontSize: 14, marginTop: 6, textAlign: "right" }}>
              <span style={{ color: T.accent }}>{money(t.total)}</span>
              {paid > 0 && paid < t.total && <span style={{ color: T.danger }}> · owes {money(t.total - paid)}</span>}
            </div>
          </Card>
        );
      })}
    </div>
