// ---------- VAT report ----------
function VatReport({ data, jobTotal, back }) {
  const now = new Date();
  const [month, setMonth] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`);
  const [y, m] = month.split("-").map(Number);
  const start = new Date(y, m - 1, 1).getTime(), end = new Date(y, m, 1).getTime();
  const inRange = (ts) => ts >= start && ts < end;
  const sales = data.jobs.filter((j) => j.status === "invoiced" && j.invoicedAt && inRange(j.invoicedAt))
    .map((j) => ({ j: normalizeJob(j), t: jobTotal(j) }));
  const outputVat = r2(sales.reduce((a, x) => a + x.t.vat, 0));
  const purch = data.purchases.filter((pp) => inRange(pp.date));
  const inputVat = r2(purch.reduce((a, pp) => a + Number(pp.vatAmount || 0), 0));
  const net = r2(outputVat - inputVat);
  const dl = () => {
    const salesRows = sales.map((x) => `<tr><td>${x.j.invNo ? invNoStr(x.j.invNo) : "#" + x.j.jobNo}</td><td class="r">${money(x.t.subtotal)}</td><td class="r">${money(x.t.vat)}</td></tr>`).join("");
    const purchRows = purch.map((pp) => `<tr><td>PO-${pp.poNo} ${esc(pp.supplierName || "")}</td><td class="r">${money(pp.netAmount ?? pp.items.reduce((a, i) => a + i.qty * i.unitCost, 0))}</td><td class="r">${money(pp.vatAmount || 0)}</td></tr>`).join("");
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>VAT ${month}</title><style>${DOC_CSS}</style></head><body>
<div class="hdr"><div class="shop">${esc(data.shop.name)}</div>${data.shop.kraPin ? `<div class="sm"><b>KRA PIN: ${esc(data.shop.kraPin)}</b></div>` : ""}
<div class="doc-title"><span>VAT SUMMARY — ${month}</span><span>${new Date().toLocaleDateString()}</span></div></div>
<h2>OUTPUT VAT (SALES)</h2><table><tr><th>Invoice</th><th class="r">Net</th><th class="r">VAT</th></tr>${salesRows}<tr class="tot"><td>Total output VAT</td><td></td><td class="r">${money(outputVat)}</td></tr></table>
<h2>INPUT VAT (PURCHASES)</h2><table><tr><th>Purchase</th><th class="r">Net</th><th class="r">VAT</th></tr>${purchRows}<tr class="tot"><td>Total input VAT</td><td></td><td class="r">${money(inputVat)}</td></tr></table>
<h2>SUMMARY</h2><table><tr class="tot"><td>${net >= 0 ? "VAT PAYABLE" : "VAT CREDIT"}</td><td class="r">${money(Math.abs(net))}</td></tr></table>
<div class="foot">Prepared from garage records — reconcile against eTIMS/iTax before filing.</div></body></html>`;
    downloadDoc(`vat-${month}.pdf`, html);
  };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between" }}>
        <Btn kind="ghost" small onClick={back}>← Invoices</Btn>
        <Btn small onClick={dl}>⬇ Download VAT summary</Btn>
      </div>
      <Card style={{ marginTop: 12, padding: 16 }}>
        <Label>Month</Label>
        <input style={inpS} type="month" value={month} onChange={(e) => setMonth(e.target.value)} />
        <div style={{ fontFamily: T.mono, fontSize: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0" }}><span>Output VAT (sales)</span><span>{money(outputVat)}</span></div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "4px 0" }}><span>Input VAT (purchases)</span><span>−{money(inputVat)}</span></div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderTop: `2px solid ${T.line}`, fontWeight: 800, fontSize: 17, color: net >= 0 ? T.danger : T.ok }}>
            <span>{net >= 0 ? "VAT PAYABLE" : "VAT CREDIT"}</span><span>{money(Math.abs(net))}</span>
          </div>
        </div>
        <Label>Sales in {month} · {sales.length}</Label>
        {sales.map((x) => (
          <div key={x.j.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0", borderBottom: `1px dashed ${T.line}` }}>
            <span>{x.j.invNo ? invNoStr(x.j.invNo) : `#${x.j.jobNo}`} {x.j.title}</span>
            <span style={{ fontFamily: T.mono }}>VAT {money(x.t.vat)}</span>
          </div>
        ))}
        {!sales.length && <div style={{ color: T.muted, fontSize: 13 }}>No invoices this month.</div>}
        <Label>Purchases in {month} · {purch.length}</Label>
        {purch.map((pp) => (
          <div key={pp.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13, padding: "3px 0", borderBottom: `1px dashed ${T.line}` }}>
            <span>PO-{pp.poNo} {pp.supplierName || ""}</span>
            <span style={{ fontFamily: T.mono }}>VAT {money(pp.vatAmount || 0)}</span>
          </div>
        ))}
        {!purch.length && <div style={{ color: T.muted, fontSize: 13 }}>No purchases this month.</div>}
      </Card>
    </div>
  );
}

// ---------- finance ----------
function FinanceTab({ data, save, jobTotal, view, setView }) {
  const now = new Date();
  const [month, setMonth] = useState(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`);
  const [y, m] = month.split("-").map(Number);
  const start = new Date(y, m - 1, 1).getTime(), end = new Date(y, m, 1).getTime();
  const inRange = (ts) => ts >= start && ts < end;

  if (view.type === "expense") {
    return <ExpenseForm data={data} save={save} expId={view.id} back={() => setView({ type: "list" })} />;
  }
  if (view.type === "purchase") {
    return <PurchaseEdit data={data} save={save} pid={view.id} back={() => setView({ type: "list" })} />;
  }

  const invoicedThisMonth = data.jobs.filter((j) => j.status === "invoiced" && j.invoicedAt && inRange(j.invoicedAt));
  const revenueMonth = r2(invoicedThisMonth.reduce((a, j) => a + jobTotal(j).subtotal, 0));
  const partsCostMonth = r2(invoicedThisMonth.reduce((a, j) =>
    a + (j.parts || []).reduce((s, p) => s + Number(p.qty || 0) * partCost(data, p), 0), 0));
  const expensesThisMonth = data.expenses.filter((e) => inRange(e.createdAt || 0));
  const expensesMonthTotal = r2(expensesThisMonth.reduce((a, e) => a + expenseAmount(e), 0));
  const profitMonth = r2(revenueMonth - partsCostMonth - expensesMonthTotal);
  const receiptsMonth = r2((data.receipts || []).filter((r) => inRange(r.at || 0)).reduce((a, r) => a + Number(r.amount || 0), 0));

  const custIds = [...new Set(data.jobs.map((j) => j.customerId).filter(Boolean))];
  const receivables = r2(custIds.reduce((a, cid) => a + Math.max(0, customerBalance(data, jobTotal, cid)), 0));

  const stockValue = r2(data.stock.reduce((a, s) => a + Number(s.qty || 0) * Number(s.cost || 0), 0));

  const payables = [
    ...data.expenses.filter((e) => billOutstanding(data, "expense", e) > 0).map((e) => ({
      kind: "expense", id: e.id, label: e.description, payee: payeeLabel(data, e), amount: billOutstanding(data, "expense", e), dueDate: e.dueDate,
      part: allocatedTo(data, "expense", e.id) > 0,
    })),
    ...data.purchases.filter((p) => billOutstanding(data, "purchase", p) > 0).map((p) => ({
      kind: "purchase", id: p.id, label: `PO-${p.poNo}`, payee: p.supplierName || "—",
      amount: billOutstanding(data, "purchase", p), dueDate: p.dueDate,
      part: allocatedTo(data, "purchase", p.id) > 0,
    })),
  ].map((x) => ({ ...x, overdue: !!x.dueDate && dayTs(x.dueDate) < Date.now() }))
   .sort((a, b) => (a.dueDate ? dayTs(a.dueDate) : Infinity) - (b.dueDate ? dayTs(b.dueDate) : Infinity));
  const totalPayable = r2(payables.reduce((a, x) => a + x.amount, 0));
  const totalOverdue = r2(payables.filter((x) => x.overdue).reduce((a, x) => a + x.amount, 0));

  return (
    <div>
      <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: 1, marginBottom: 4 }}>Finance</div>
      <div style={{ fontSize: 13, color: T.muted, marginBottom: 10 }}>Revenue, profit and payables for your records.</div>
      <input style={{ ...inpS, maxWidth: 160 }} type="month" value={month} onChange={(e) => setMonth(e.target.value)} />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 12, marginBottom: 20 }}>
        <StatCard label="Revenue invoiced" value={money(revenueMonth)} sub={`${invoicedThisMonth.length} job${invoicedThisMonth.length === 1 ? "" : "s"} · excl. VAT · ${month}`} />
        <StatCard label="Payments received" value={money(receiptsMonth)} color={T.ok} sub={month} />
        <StatCard label="Net profit" value={money(profitMonth)} color={profitMonth < 0 ? T.danger : T.ok} sub="Revenue − parts cost − expenses" />
        <StatCard label="Outstanding" value={money(receivables)} color={receivables > 0 ? T.accent : T.ok} sub="Owed to you, right now" />
        <StatCard label="Stock value" value={money(stockValue)} sub="At cost, right now" />
        <StatCard label="You owe" value={money(totalPayable)} color={totalOverdue > 0 ? T.danger : T.accent}
          sub={totalOverdue > 0 ? `${money(totalOverdue)} overdue` : "Unpaid purchases + expenses"} />
      </div>

      <Label>Payables — what you owe · {payables.length}</Label>
      {!payables.length && <div style={{ color: T.muted, fontSize: 13 }}>Nothing outstanding.</div>}
      {payables.map((x) => (
        <Card key={`${x.kind}-${x.id}`} onClick={() => setView(x.kind === "expense" ? { type: "expense", id: x.id } : { type: "purchase", id: x.id })}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontWeight: 700 }}>{x.label}</div>
              <div style={{ fontSize: 12, color: T.muted }}>{x.payee}{x.part ? " · part-paid, balance shown" : ""}</div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: T.mono, fontWeight: 700 }}>{money(x.amount)}</div>
              <div style={{ fontSize: 11, color: x.overdue ? T.danger : T.muted, fontWeight: x.overdue ? 800 : 400 }}>
                {x.overdue ? "OVERDUE" : "Due"}{x.dueDate ? ` ${dateStr(dayTs(x.dueDate))}` : " date not set"}
              </div>
            </div>
          </div>
        </Card>
      ))}

      <div style={{ marginTop: 16 }}>
        <Label>Expenses · {data.expenses.length}</Label>
        <ExpensesList data={data} save={save}
          openAdd={() => setView({ type: "expense", id: null })}
          openEdit={(id) => setView({ type: "expense", id })} />
      </div>
    </div>
  );
}

function StaffModule({ session, initialStaff, onStaffChange }) {
  // Show cached / prefetched staff immediately — never wait on a blank screen
  const [staff, setStaffList] = useState(() => {
    if (Array.isArray(initialStaff) && initialStaff.length) return initialStaff;
    const cached = getStaffListCache();
    return Array.isArray(cached) ? cached : [];
  });
  const [q, setQ] = useState("");
  const [adding, setAdding] = useState(false);
  const [f, setF] = useState({ firstName: "", lastName: "", email: "", role: "Technician" });
  const [msg, setMsg] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [refreshing, setRefreshing] = useState(false);
  const [removeTarget, setRemoveTarget] = useState(null); // staff row pending removal confirm

  const applyList = (list) => {
    const next = Array.isArray(list) ? list : [];
    setStaffList(next);
    setStaffListCache(next);
    if (typeof onStaffChange === "function") onStaffChange(next);
  };

  const load = async (silent) => {
    if (!silent && !staff.length) setRefreshing(true);
    try {
      const res = await gsFetch({ method: "POST", body: { action: "listStaff", session } });
      if (res.error) { if (!staff.length) setErr(res.error); }
      else applyList(res.staff || []);
    } catch (e) {
      if (!staff.length) setErr(e.message || "Failed to load staff");
    } finally { setRefreshing(false); }
  };
  useEffect(() => { load(true); }, []);

  const query = q.trim().toLowerCase();
  const filtered = !query ? staff : staff.filter(s =>
    (s.firstName || "").toLowerCase().includes(query) ||
    (s.lastName || "").toLowerCase().includes(query) ||
    (s.email || "").toLowerCase().includes(query)
  );

  const add = async () => {
    setErr(""); setMsg("");
    if (!f.firstName.trim() || !f.lastName.trim() || !f.email.trim()) { setErr("All fields are required"); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) { setErr("Enter a valid email address"); return; }
    const sess = session || getSession();
    if (!sess) { setErr("Not authenticated — please sign out and sign in again."); return; }
    setBusy(true);
    const pending = {
      id: "tmp-" + Date.now(),
      firstName: f.firstName.trim(),
      lastName: f.lastName.trim(),
      email: f.email.trim().toLowerCase(),
      role: f.role === "Admin" ? "Admin" : "Technician",
      status: "inactive",
    };
    // Show the new account immediately while the server works
    applyList([pending, ...staff.filter(s => s.email !== pending.email)]);
    setAdding(false);
    const formSnapshot = { ...f };
    setF({ firstName: "", lastName: "", email: "", role: "Technician" });
    try {
      const res = await gsFetch({ method: "POST", body: { action: "addStaff", session: sess, ...formSnapshot } });
      if (res.error) {
        applyList(staff.filter(s => s.id !== pending.id));
        setErr(res.error);
        setAdding(true);
        setF(formSnapshot);
      } else {
        if (res.staff) {
          applyList([res.staff, ...staff.filter(s => s.email !== res.staff.email && s.id !== pending.id)]);
        }
        setMsg(res.emailSent ? "Staff added. Invitation email sent (link valid 1 hour)." : "Staff added but email could not be sent — use Resend invite.");
      }
    } catch (e) {
      applyList(staff.filter(s => s.id !== pending.id));
      setErr(e.message || "Failed");
      setAdding(true);
      setF(formSnapshot);
    } finally { setBusy(false); }
  };

  const resend = async (id) => {
    if (!confirm("Send a password set link to this user? Previous invite links for this account will stop working.")) return;
    setErr(""); setMsg("");
    const sess = session || getSession();
    if (!sess) { setErr("Not authenticated — please sign out and sign in again."); return; }
    try {
      const res = await gsFetch({ method: "POST", body: { action: "resendPasswordSet", session: sess, staffId: id } });
      if (res.error) setErr(res.error);
      else setMsg(res.emailSent ? "Invitation sent. The link is valid for 1 hour." : "Request saved but email could not be sent — check MailApp quotas.");
    } catch (e) { setErr(e.message); }
  };

  const me = getStaff(); // current signed-in staff (cannot self-deactivate / self-remove)

  // Optimistic activate / deactivate — UI updates immediately
  const toggle = async (id, status) => {
    setErr(""); setMsg("");
    if (me && String(id) === String(me.id)) {
      setErr("You cannot deactivate your own account.");
      return;
    }
    const nextStatus = status === "active" ? "deactivated" : "active";
    const action = status === "active" ? "deactivateStaff" : "activateStaff";
    const prev = staff;
    const optimistic = staff.map(s => s.id === id ? { ...s, status: nextStatus } : s);
    applyList(optimistic);
    try {
      const res = await gsFetch({ method: "POST", body: { action, session: session || getSession(), staffId: id } });
      if (res && res.error) {
        applyList(prev);
        setErr(res.error);
      }
    } catch (e) {
      applyList(prev);
      setErr(e.message || "Could not update status");
    }
  };

  const requestRemove = (s) => {
    setErr(""); setMsg("");
    if (me && s && String(s.id) === String(me.id)) {
      setErr("You cannot remove your own account.");
      return;
    }
    setRemoveTarget(s);
  };

  const confirmRemove = async () => {
    const target = removeTarget;
    setRemoveTarget(null);
    if (!target) return;
    setErr(""); setMsg("");
    if (me && String(target.id) === String(me.id)) {
      setErr("You cannot remove your own account.");
      return;
    }
    const prev = staff;
    // Remove from list immediately
    applyList(staff.filter(s => s.id !== target.id));
    try {
      const res = await gsFetch({ method: "POST", body: { action: "deleteStaff", session: session || getSession(), staffId: target.id } });
      if (res && res.error) {
        applyList(prev);
        setErr(res.error);
      } else {
        setMsg("Staff account removed.");
      }
    } catch (e) {
      applyList(prev);
      setErr(e.message || "Could not remove staff");
    }
  };

  const statusLabel = (st) => {
    if (st === "active") return { text: "ACTIVE", color: T.ok };
    if (st === "deactivated") return { text: "DEACTIVATED", color: T.danger };
    return { text: "INACTIVE", color: "#e8920e" }; // awaiting password set
  };

  return (
    <div>
      <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
        <input style={{ ...inpS, marginBottom: 0, flex: 1 }} placeholder="Search staff by name or email…" value={q} onChange={(e) => setQ(e.target.value)} />
        <Btn small onClick={() => { setAdding(!adding); setErr(""); setMsg(""); }}>{adding ? "Cancel" : "+ Add New Staff"}</Btn>
      </div>
      {msg && <div style={{ color: T.ok, fontSize: 13, marginBottom: 8 }}>{msg}</div>}
      {err && <div style={{ color: T.danger, fontSize: 13, marginBottom: 8 }}>{err}</div>}
      {adding && (
        <Card style={{ padding: 14, marginBottom: 12 }}>
          <div style={{ fontWeight: 800, marginBottom: 8 }}>New staff account</div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={inpS} placeholder="First name" value={f.firstName} onChange={(e) => setF({ ...f, firstName: e.target.value })} />
            <input style={inpS} placeholder="Last name" value={f.lastName} onChange={(e) => setF({ ...f, lastName: e.target.value })} />
          </div>
          <input style={inpS} type="email" placeholder="Email address" value={f.email} onChange={(e) => setF({ ...f, email: e.target.value })} />
          <Label>Role</Label>
          <select style={selS} value={f.role} onChange={(e) => setF({ ...f, role: e.target.value })}>
            <option value="Technician">Technician</option>
            <option value="Admin">Admin</option>
          </select>
          <div style={{ fontSize: 12, color: T.muted, marginBottom: 8 }}>An invitation email with a password-set link will be sent. Account stays inactive until they set a password.</div>
          
	<div style={{ display: "flex", justifyContent: "center" }}>
  	<Btn onClick={add}>{busy ? "Saving…" : "Submit — send invitation"}</Btn>
	</div>

        </Card>
      )}
      {!filtered.length && (
        <div style={{ color: T.muted, textAlign: "center", padding: 24 }}>
          {refreshing ? "Refreshing staff list…" : (q.trim() ? "No staff match your search." : "No staff accounts yet.")}
        </div>
      )}
      {!!filtered.length && refreshing && (
        <div style={{ color: T.muted, fontSize: 12, marginBottom: 8 }}>Refreshing…</div>
      )}
      {filtered.map(s => {
        const st = statusLabel(s.status);
        return (
        <Card key={s.id}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontWeight: 700 }}>{s.firstName} {s.lastName}</div>
              <div style={{ fontSize: 13, color: T.muted }}>{s.email}</div>
              <div style={{ fontSize: 12, marginTop: 4 }}>
                <span style={{ fontWeight: 800, color: s.role === "Admin" ? T.accent : T.muted }}>{s.role}</span>
                {" · "}
                <span style={{ color: st.color, fontWeight: 700 }}>{st.text}</span>
              </div>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, alignItems: "flex-end" }}>
              {(() => {
                const isSelf = me && String(s.id) === String(me.id);
                return (
                  <>
                    {/* Active: Deactivate (not for self) */}
                    {s.status === "active" && !isSelf && (
                      <Btn small kind="ghost" onClick={() => toggle(s.id, s.status)}>Deactivate</Btn>
                    )}
                    {/* Deactivated: Activate */}
                    {s.status === "deactivated" && (
                      <Btn small kind="ghost" onClick={() => toggle(s.id, s.status)}>Activate</Btn>
                    )}
                    {/* Inactive (password never set): Resend invite */}
                    {s.status === "inactive" && (
                      <Btn small kind="ghost" onClick={() => resend(s.id)}>Resend invite</Btn>
                    )}
                    {/* Remove — not for own account */}
                    {!isSelf && (
                      <Btn small kind="danger" onClick={() => requestRemove(s)}>Remove</Btn>
                    )}
                    {isSelf && (
                      <div style={{ fontSize: 11, color: T.muted, fontWeight: 700, marginTop: 2 }}>You</div>
                    )}
                  </>
                );
              })()}
            </div>
          </div>
        </Card>
        );
      })}
      <ConfirmModal
        open={!!removeTarget}
        title="Remove staff account"
        message={removeTarget
          ? `Remove this staff account? ${removeTarget.firstName || ""} ${removeTarget.lastName || ""} (${removeTarget.email || ""}) will be permanently deleted.`
          : "Remove this staff account?"}
        onYes={confirmRemove}
        onNo={() => setRemoveTarget(null)}
      />
    </div>
  );
}

function SetupModule({ data, save }) {
  const [s, setS] = useState({ ...data.shop });
  const [vatEnabled, setVatEnabled] = useState(!!data.vat?.enabled);
  const [vatRate, setVatRate] = useState(String(data.vat?.rate ?? 16));
  const [ioMsg, setIoMsg] = useState("");
  const fileRef = useRef(null);

  const exportAll = async () => {
    setIoMsg("Preparing backup…");
    const extra = {};
    try {
      const l = await window.storage.list("garage-");
      for (const k of (l?.keys || [])) {
        if (k === KEY || k === SESSION_KEY || k === STAFF_KEY || k === STAFF_LIST_KEY || isSyncInternalKey(k)) continue;
        try { const r = await window.storage.get(k); extra[k] = r.value; } catch {}
      }
    } catch {}
    const payload = JSON.stringify({ exportedAt: new Date().toISOString(), data, extra });
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const d = new Date();
    a.href = url;
    a.download = `garage-backup-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 800);
    setIoMsg("Backup downloaded.");
    save({ ...data, lastBackupAt: Date.now() });
  };

  const importAll = async (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    try {
      const text = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result); r.onerror = () => rej(new Error("read failed"));
        r.readAsText(file);
      });
      const parsed = JSON.parse(text);
      if (!parsed.data || !Array.isArray(parsed.data.jobs)) { setIoMsg("That doesn't look like a garage backup file."); return; }
      for (const [k, v] of Object.entries(parsed.extra || {})) {
        if (k === KEY || k === SESSION_KEY || k === STAFF_KEY || k === STAFF_LIST_KEY || isSyncInternalKey(k)) continue;
        try { await window.storage.set(k, v); } catch {}
      }
      save(prepData(parsed.data));
      setIoMsg(`Restored backup from ${parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : "unknown date"}.`);
    } catch { setIoMsg("Couldn't read that file."); }
  };

  return (
    <Card style={{ padding: 16 }}>
      <div style={{ fontSize: 16, color: T.muted, marginBottom: 10, fontFamily: T.mono }}>GARAGE SETTINGS</div>
      <Label>Shop name</Label>
      <input style={inpS} value={s.name} onChange={(e) => setS({ ...s, name: e.target.value })} />
      <Label>Phone / contact</Label>
      <input style={inpS} placeholder="+254" value={s.phone} onChange={(e) => setS({ ...s, phone: sanitizePhone(e.target.value) })} />
      <Label>Address</Label>
      <input style={inpS} value={s.address} onChange={(e) => setS({ ...s, address: e.target.value })} />
      <Label>KRA PIN</Label>
      <input style={inpS} value={s.kraPin} onChange={(e) => setS({ ...s, kraPin: e.target.value })} />
      <Label>VAT (KRA)</Label>
      <select style={selS} value={vatEnabled ? "yes" : "no"} onChange={(e) => setVatEnabled(e.target.value === "yes")}>
        <option value="no">Not VAT registered</option>
        <option value="yes">VAT registered — charge VAT on invoices</option>
      </select>
      {vatEnabled && <input style={inpS} type="number" step="any" placeholder="VAT rate % (16)" value={vatRate} onChange={(e) => setVatRate(e.target.value)} />}
      <div style={{ fontSize: 11, color: T.muted, marginBottom: 6 }}>Applies to new invoices from when it's switched on.</div>
      <div style={{ display: "flex", justifyContent: "center", width: "100%", marginTop: 8 }}>
  <Btn onClick={() => save({ ...data, shop: s, vat: { enabled: vatEnabled, rate: Number(vatRate || 16) } })}>
    Save details
  </Btn>
</div>
      <Label>Local backup (optional safety net)</Label>
      <div style={{ display: "flex", gap: 8 }}>
        <Btn small kind="ghost" onClick={exportAll}>⬇ Export all data</Btn>
        <Btn small kind="ghost" onClick={() => fileRef.current?.click()}>⬆ Restore from backup</Btn>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importAll} />
      </div>
      {ioMsg && <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>{ioMsg}</div>}
    </Card>
  );
}

function SettingsModule({ data, save, session, initialStaff, onStaffChange }) {

  return (
    <div>
      <div style={{ display: "flex", gap: 4, marginBottom: 14, background: T.panel2, borderRadius: 8, padding: 4, border: `1px solid ${T.line}` }}>
        {[{ id: "staff", label: "Staff" }, { id: "setup", label: "Setup" }].map(x => (

// ---------- app ----------
function GarageManager() {
  // Auth deep-links from email:
  //   Preferred (mail-safe):  ?gm=verify&t=TOKEN  |  ?gm=setpassword&t=…  |  ?gm=resetpassword&t=…
  //   Legacy hash:            #/verify/TOKEN      |  #/setpassword/…      |  #/resetpassword/…
  // Query params survive Gmail/Outlook in-app browsers; hash fragments often do not.
  const parseAuthRoute = () => {
    try {
      const sp = new URLSearchParams(window.location.search || "");
      const gm = (sp.get("gm") || "").toLowerCase().trim();
      const t = (sp.get("t") || "").trim();
      if (t && (gm === "verify" || gm === "setpassword" || gm === "resetpassword")) {
        return { screen: gm, token: t };
      }
    } catch (_) {}
    const h = (window.location.hash || "").replace(/^#\/?/, "");
    const parts = h.split("/");
    if (parts[0] === "setpassword" && parts[1]) return { screen: "setpassword", token: parts[1] };
    if (parts[0] === "resetpassword" && parts[1]) return { screen: "resetpassword", token: parts[1] };
    if (parts[0] === "verify" && parts[1]) return { screen: "verify", token: parts[1] };
    return null;
  };

  /** Clear ?gm=&t= and #/… from the address bar after auth links are consumed. */
  const clearAuthUrl = () => {
    try {
      const url = window.location.pathname || "/";
      window.history.replaceState(null, "", url);
    } catch (_) {
      try { window.location.hash = ""; } catch (__) {}
    }
  };

  const [authScreen, setAuthScreen] = useState(() => {
    const h = parseAuthRoute();
    if (h) return h;
    if (getSession() && getStaff()) return null;
    // Instant: use cache so we never flash "Checking setup…". Background refresh may switch screens.
    const cached = getHasAdminCache();
    if (cached === false) return { screen: "setupAdmin" };
    return { screen: "login" };
  });
  const [currentStaff, setCurrentStaff] = useState(() => getStaff());
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [view, setView] = useState({ type: "list" });
  const [err, setErr] = useState(null);
  const [savedAt, setSavedAt] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const [staffStats, setStaffStats] = useState(null);
  const [staffList, setStaffList] = useState(() => {
    const cached = getStaffListCache();
    return Array.isArray(cached) ? cached : [];
  });
  const writeTimer = useRef(null);
  const dataRef = useRef(null);
  const pollRef = useRef(null);
  // writingRef: a save request is in flight. Edits made meanwhile set againRef
  // and are sent as soon as it returns — never as a second overlapping request.
  const writingRef = useRef(false);
  // dirtyRef: true whenever there's a local edit that hasn't been confirmed
  // saved to the server yet. Fresh server copies never overwrite such edits —
  // they're re-applied on top (see applyServer).
  const dirtyRef = useRef(false);
  // baseRef: the last copy of the data confirmed by the server — a save sends
  // only the difference between it and what's on screen.
  const baseRef = useRef(null);
  // readyRef: nothing is sent until the first server copy has arrived and any
  // unsaved edits have been re-applied on top of it.
  const readyRef = useRef(false);
  // syncEpochRef: bumped whenever a save starts or finishes, so a background
  // check that was already in flight doesn't apply an out-of-date copy.
  const syncEpochRef = useRef(0);
  const againRef = useRef(false);
  useEffect(() => { dataRef.current = data; }, [data]);

  useEffect(() => {
    const onRoute = () => {
      const h = parseAuthRoute();
      if (h) setAuthScreen(h);
    };
    window.addEventListener("hashchange", onRoute);
    window.addEventListener("popstate", onRoute);
    return () => {
      window.removeEventListener("hashchange", onRoute);
      window.removeEventListener("popstate", onRoute);
    };
  }, []);

  // Background admin-status check (no blocking "Checking setup…" screen)
  useEffect(() => {
    const scr = authScreen?.screen;
    if (scr !== "login" && scr !== "setupAdmin") return;
    if (getSession()) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await gsFetch({ query: { action: "adminStatus" } });
        if (cancelled) return;
        const has = !!(res && res.hasAdmin);
        setHasAdminCache(has);
        if (!has && scr === "login") setAuthScreen({ screen: "setupAdmin" });
        else if (has && scr === "setupAdmin") setAuthScreen({ screen: "login" });
      } catch (_) {
        // Keep current screen on network error — cache already chose login or setup
      }
    })();
    return () => { cancelled = true; };
  }, [authScreen?.screen]);

  // ---- persistence of the sync state on this device ----
  const persistLocal = (d) => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
  // While nothing is unsaved the confirmed copy equals what's on screen, so
  // store a marker instead of a second full copy (keeps phone storage small).
  const baseStoredRef = useRef(""); // "=" (marker) or "full" — avoids rewriting a big copy on every keystroke
  const persistBase = (sameAsLocal) => {
    try {
      if (sameAsLocal) { localStorage.setItem(BASE_KEY, "="); baseStoredRef.current = "="; }
      else { localStorage.setItem(BASE_KEY, JSON.stringify(baseRef.current)); baseStoredRef.current = "full"; }
    } catch { baseStoredRef.current = ""; }
  };
  const clearPending = () => { try { localStorage.removeItem(PENDING_KEY); } catch {} };
  const storedAttIndex = () => { try { return localStorage.getItem(ATT_INDEX_KEY) || ""; } catch { return ""; } };
  const storeAttIndex = (idx) => { try { if (idx) localStorage.setItem(ATT_INDEX_KEY, stableStr(idx)); } catch {} };

  // A fresh server copy arrived: make it the confirmed base and re-apply any
  // edits made here that the server doesn't have yet. `sent` is the change set
  // the server just confirmed (after a save) — treated as already confirmed so
  // the server's version of those records wins (e.g. a renumbered job).
  const applyServer = (server, sent) => {
    const local = dataRef.current;
    let base = baseRef.current;
    if (sent && base) base = applyDelta(base, sent);
    const merged = local && base ? rebaseOnto(server, base, local) : server;
    baseRef.current = server;
    const pendingDelta = computeDelta(server, merged);
    const clean = deltaIsEmpty(pendingDelta);
    if (!local || stableStr(merged) !== stableStr(local)) {
      dataRef.current = merged;
      setData(merged);
    }
    persistLocal(merged);
    persistBase(clean);
    return clean;
  };

  // Load garage data once authenticated — show local cache immediately, then refresh from Sheets
  useEffect(() => {
    if (authScreen) return;
    if (!getSession()) { setAuthScreen({ screen: "login" }); return; }
    if (dataRef.current) return;
    let cancelled = false;
    readyRef.current = false;
    (async () => {
      // 1) Instant UI from local cache (if any)
      let cached = null;
      try {
        const r = await window.storage.get(KEY);
        cached = prepData(JSON.parse(r.value));
        if (!cancelled && !dataRef.current) {
          dataRef.current = cached;
          setData(cached);
          setSavedAt(Date.now());
        }
      } catch {}
      let storedBase = null;
      try {
        const b = localStorage.getItem(BASE_KEY);
        if (b === "=") storedBase = cached;
        else if (b) storedBase = prepData(JSON.parse(b));
      } catch {}
      let pending = false;
      try { pending = localStorage.getItem(PENDING_KEY) === "1"; } catch {}
      let firstRun = false;
      try { firstRun = localStorage.getItem(SYNC_V2_KEY) !== "1"; } catch {}

      // 2) Fresh data from Google Sheets
      try {
        const { data: remote, attIndex } = await gsLoad(false);
        if (cancelled) return;
        storeAttIndex(attIndex);
        // edits made on the cached copy while this was loading
        const local = dataRef.current;
        if (firstRun || !storedBase) {
          // This device last ran the old version (or lost its sync record):
          // never push its old copy over the server. Keep a backup of it,
          // recover only what's safe, and start from the server's copy.
          if (pending && local) { try { localStorage.setItem(SYNC_BACKUP_KEY, JSON.stringify({ at: Date.now(), data: local })); } catch {} }
          baseRef.current = remote;
          const recovered = applyDelta(remote, recoveryDelta(remote, local, pending));
          dataRef.current = recovered;
          setData(recovered);
          persistLocal(recovered);
          // attachments added here during the outage that the server never got
          if (firstRun) {
            try {
              Object.keys(localStorage).filter((k) => window.isSyncedAttKey(k) && !(attIndex && attIndex[k])).forEach((k) => window.markAttDirty(k));
            } catch {}
          }
          try { localStorage.setItem(SYNC_V2_KEY, "1"); } catch {}
        } else {
          // Normal case: re-apply any unsaved edits from last time on top of
          // the server's copy (instead of overwriting either one).
          baseRef.current = storedBase;
          applyServer(remote);
        }
        readyRef.current = true;
        setSavedAt(Date.now());
        setErr(null);
        if (!deltaIsEmpty({ ...computeDelta(baseRef.current, dataRef.current), att: attDelta() })) {
          dirtyRef.current = true;
          try { localStorage.setItem(PENDING_KEY, "1"); } catch {}
          persistBase(false);
          scheduleWrite(0);
        } else {
          dirtyRef.current = false;
          clearPending();
          persistBase(true);
        }
      } catch (e) {
        if (cancelled) return;
        const msg = String(e.message || e || "Load failed");
        if (dataRef.current) {
          // Already showing cache — soft warning only; saving waits until the
          // server copy has loaded, then retries.
          setErr("Could not refresh from server — showing last saved data. " + msg);
          return;
        }
        if (/authenticated|Session expired|Not authenticated/i.test(msg)) {
          setSession(""); setStaff(null); setCurrentStaff(null);
          setAuthScreen({ screen: "login" });
        } else {
          setErr(msg);
        }
      }
    })();
    return () => { cancelled = true; };
  }, [authScreen]);

  // photo uploads/downloads run in the background once signed in
  useEffect(() => {
    if (!authScreen && getSession()) PhotoSync.init();
  }, [authScreen]);

  // If the first load failed (offline), keep trying — the app can't save
  // until it has the server's copy to merge into.
  useEffect(() => {
    if (authScreen || !getSession()) return;
    const t = setInterval(async () => {
      if (readyRef.current || !dataRef.current) return;
      try {
        const { data: remote, attIndex } = await gsLoad(false);
        if (readyRef.current) return;
        storeAttIndex(attIndex);
        let storedBase = null;
        try {
          const b = localStorage.getItem(BASE_KEY);
          if (b === "=") storedBase = JSON.parse(localStorage.getItem(KEY) || "null");
          else if (b) storedBase = JSON.parse(b);
        } catch {}
        let firstRun = false;
        try { firstRun = localStorage.getItem(SYNC_V2_KEY) !== "1"; } catch {}
        if (firstRun || !storedBase) {
          let pending = false;
          try { pending = localStorage.getItem(PENDING_KEY) === "1"; } catch {}
          baseRef.current = remote;
          const recovered = applyDelta(remote, recoveryDelta(remote, dataRef.current, pending));
          dataRef.current = recovered;
          setData(recovered);
          persistLocal(recovered);
          try { localStorage.setItem(SYNC_V2_KEY, "1"); } catch {}
        } else {
          baseRef.current = prepData(storedBase);
          applyServer(remote);
        }
        readyRef.current = true;
        setErr(null);
        setSavedAt(Date.now());
        scheduleWrite(0);
      } catch {}
    }, 15000);
    return () => clearInterval(t);
  }, [authScreen]);

  useEffect(() => {
    if (authScreen || !getSession()) return;
    const poll = async () => {
      if (document.visibilityState !== "visible") return;
      if (!readyRef.current || writeTimer.current || writingRef.current) return;
      const epoch = syncEpochRef.current;
      try {
        let res = await gsLoad(true);
        // attachments changed elsewhere — fetch them once
        if (res.attIndex && stableStr(res.attIndex) !== storedAttIndex()) {
          res = await gsLoad(false);
          storeAttIndex(res.attIndex);
        }
        // a save started or finished meanwhile — this copy may be stale
        if (epoch !== syncEpochRef.current || writingRef.current || writeTimer.current) return;
        applyServer(res.data);
      } catch {}
    };
    pollRef.current = setInterval(poll, 12000);
    return () => clearInterval(pollRef.current);
  }, [authScreen]);

  // Prefetch staff list for Admin (dashboard stats + instant Settings display)
  useEffect(() => {
    if (authScreen) return;
    if (!getSession() || !currentStaff || currentStaff.role !== "Admin") return;
    (async () => {
      try {
        const res = await gsFetch({ method: "POST", body: { action: "listStaff", session: getSession() } });
        if (Array.isArray(res.staff)) {
          const total = res.staff.length;
          const active = res.staff.filter((s) => s.status === "active").length;
          const inactive = total - active;
          setStaffStats({ total, active, inactive });
          setStaffList(res.staff);
          setStaffListCache(res.staff);
        }
      } catch {}
    })();
  }, [authScreen, currentStaff]);

  const RETRY_DELAY = 5000;
  const scheduleWrite = (delay) => {
    clearTimeout(writeTimer.current);
    writeTimer.current = setTimeout(() => {
      writeTimer.current = null;
      writeNow();
    }, delay);
  };

  // Send whatever differs between the confirmed copy and what's on screen.
  const writeNow = async () => {
    if (writingRef.current) { againRef.current = true; return; }
    if (!getSession()) return;
    if (!readyRef.current || !baseRef.current || !dataRef.current) return; // first load still pending; it saves afterwards
    const delta = computeDelta(baseRef.current, dataRef.current);
    const att = attDelta();
    if (att.up.length || att.del.length) delta.att = att;
    if (deltaIsEmpty(delta)) {
      dirtyRef.current = false;
      clearPending();
      persistBase(true);
      return;
    }
    writingRef.current = true;
    syncEpochRef.current++;
    let failed = false;
    try {
      const res = await gsSaveDelta(delta);
      if (delta.att) clearAttDirty([...delta.att.up.map((a) => a.key), ...delta.att.del]);
      if (res.attIndex) storeAttIndex(res.attIndex);
      applyServer(res.data, delta);
      setSavedAt(Date.now());
      setErr(null);
    } catch (e) {
      failed = true;
      setErr("Offline — retrying in the background. Your changes are kept. (" + (e.message || e) + ")");
    } finally {
      writingRef.current = false;
      syncEpochRef.current++;
    }
    const again = againRef.current;
    againRef.current = false;
    if (failed) { scheduleWrite(RETRY_DELAY); return; }
    const rest = computeDelta(baseRef.current, dataRef.current);
    const restAtt = attDelta();
    if (again || !deltaIsEmpty(rest) || restAtt.up.length || restAtt.del.length) {
      scheduleWrite(0);
    } else {
      dirtyRef.current = false;
      clearPending();
      persistBase(true);
    }
  };

  const save = (next) => {
    setData(next);
    dataRef.current = next;
    dirtyRef.current = true;
    // Written synchronously, immediately — not after the debounce below — so
    // even closing the tab the instant you edit can't lose it: the next time
    // the app opens, these edits are re-applied on top of the server's copy.
    persistLocal(next);
    try { localStorage.setItem(PENDING_KEY, "1"); } catch {}
    // the confirmed copy only needs writing out when it stops matching the screen
    if (baseStoredRef.current !== "full" && baseRef.current) persistBase(false);
    if (writingRef.current) { againRef.current = true; return; }
    scheduleWrite(600);
  };

  // Retry sooner than the 5s backoff as soon as the browser reports the
  // connection is back, instead of waiting out whatever delay was in progress.
  useEffect(() => {
    const onOnline = () => {
      if (dirtyRef.current && !writingRef.current && dataRef.current) scheduleWrite(0);
    };
    window.addEventListener("online", onOnline);
    return () => window.removeEventListener("online", onOnline);
  }, []);

  useEffect(() => {
    const flush = () => {
      if (writeTimer.current && dataRef.current) {
        clearTimeout(writeTimer.current);
        writeTimer.current = null;
        writeNow();
      }
    };
    document.addEventListener("visibilitychange", flush);
    window.addEventListener("pagehide", flush);
    return () => {
      document.removeEventListener("visibilitychange", flush);
      window.removeEventListener("pagehide", flush);
    };
  }, []);

  const logout = () => {
    setSession("");
    setStaff(null);
    setCurrentStaff(null);
    setData(null);
    setHasAdminCache(true); // signed-out user implies an admin account exists
    setAuthScreen({ screen: "login" });
    clearAuthUrl();
  };

  // ---- Auth screens ----
  if (authScreen?.screen === "setupAdmin") {
    return <FirstAdminSetupScreen onDone={() => setAuthScreen({ screen: "login" })} />;
  }
  if (authScreen?.screen === "login") {
    return <LoginScreen successMsg={authScreen.successMsg} onLogin={(s) => {
      setHasAdminCache(true);
      setCurrentStaff(s);
      clearAuthUrl();
      setAuthScreen(null);
    }} onForgot={() => setAuthScreen({ screen: "forgot" })} />;
  }
  if (authScreen?.screen === "forgot") {
    return <ForgotPasswordScreen onBack={() => setAuthScreen({ screen: "login" })} />;
  }
  if (authScreen?.screen === "setpassword") {
    return <SetPasswordScreen token={authScreen.token} mode="set" onDone={() => { clearAuthUrl(); setAuthScreen({ screen: "login" }); }} />;
  }
  if (authScreen?.screen === "resetpassword") {
    return <SetPasswordScreen token={authScreen.token} mode="reset" onDone={() => { clearAuthUrl(); setAuthScreen({ screen: "login" }); }} />;
  }
  if (authScreen?.screen === "verify") {
    return <VerifyAdminScreen token={authScreen.token} onDone={(successMsg) => {
      setHasAdminCache(true);
      clearAuthUrl();
      setAuthScreen({ screen: "login", successMsg: successMsg || "The account has been successfully verified. You can now log in." });
    }} />;
  }

  if (!data)
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: err ? T.danger : T.muted, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: T.sans, padding: 24, textAlign: "center", flexDirection: "column", gap: 12 }}>
        <div style={{ fontSize: 18, fontWeight: 800, color: T.accent }}>GARAGE MANAGER</div>
        <div>{err || "Loading workshop…"}</div>
        {!err && <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>Connecting to database — this can take a few seconds on first open.</div>}
        {err && (
          <Btn kind="ghost" onClick={() => { setSession(""); setStaff(null); setCurrentStaff(null); setAuthScreen({ screen: "login" }); setData(null); setErr(null); }}>
            ← Back to login
          </Btn>
        )}
      </div>
    );

  const jobTotal = (jr) => {
    const j = normalizeJob(jr, data.laborRate);
    const parts = (j.parts || []).reduce((s, p) => s + Number(p.price ?? p.cost ?? 0) * Number(p.qty || 1), 0);
    const work = (j.workItems || []).reduce((s, w) => s + Number(w.amount || 0), 0);
    const labor = (j.labour || []).reduce((s, l) => s + Number(l.amount || 0), 0);
    const charges = (j.charges || []).reduce((s, c) => s + Number(c.amount || 0), 0);
    const subtotal = r2(parts + work + labor + charges);
    const vatRate = j.vatRate !== undefined ? Number(j.vatRate) : (data.vat?.enabled ? Number(data.vat.rate || 16) : 0);
    const vat = r2(subtotal * vatRate / 100);
    return { parts, work, labor, charges, subtotal, vatRate, vat, total: r2(subtotal + vat) };
  };

  const isAdmin = currentStaff?.role === "Admin";
  const tabs = [
    { id: "dashboard", label: "Dashboard" },
    { id: "jobs", label: "Jobs" }, { id: "customers", label: "Customers" },
    { id: "stock", label: "Stock" }, { id: "tools", label: "Tools" }, { id: "suppliers", label: "Suppliers" },
    { id: "invoices", label: "Invoices" },
  ];
  if (isAdmin) tabs.push({ id: "finance", label: "Finance" });
  if (isAdmin) tabs.push({ id: "settings", label: "Settings" });

  const openJobs = data.jobs.filter((j) => j.status !== "invoiced").length;
  const goTab = (id) => { setTab(id); setView({ type: "list" }); setNavOpen(false); };
  const confirmLogout = () => {
    if (window.confirm("Are you sure you want to sign out?")) logout();
  };

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.text, fontFamily: T.sans, display: "flex", flexDirection: "column" }}>
      {/* Mobile top bar */}
      <div className="gm-topbar" style={{
        display: "none", alignItems: "center", gap: 12, padding: "12px 14px",
        background: T.panel2, borderBottom: `2px solid ${T.accent}`, position: "sticky", top: 0, zIndex: 50,
      }}>
        <button onClick={() => setNavOpen(true)} style={{
          background: T.panel, border: `1px solid ${T.line}`, borderRadius: 6, color: T.text,
          width: 40, height: 40, fontSize: 18, cursor: "pointer", fontWeight: 900,
        }}>☰</button>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 14, fontWeight: 900, letterSpacing: 1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{data.shop.name}</div>
          <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>{currentStaff ? `${currentStaff.firstName} · ${currentStaff.role}` : ""}</div>
        </div>
        <button onClick={confirmLogout} title="Sign out" aria-label="Sign out" style={{
          background: "rgba(208,91,74,0.15)", color: T.danger, border: `1px solid ${T.danger}`, borderRadius: 6,
          width: 40, height: 40, padding: 0, cursor: "pointer", display: "inline-flex",
          alignItems: "center", justifyContent: "center", flexShrink: 0,
        }}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>

      <div className={"gm-overlay" + (navOpen ? " show" : "")} onClick={() => setNavOpen(false)} />

      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
      <div className={"gm-sidebar" + (navOpen ? " open" : "")} style={{
        width: 210, flexShrink: 0, background: T.panel2, borderRight: `1px solid ${T.line}`,
        display: "flex", flexDirection: "column", minHeight: "100vh", position: "sticky", top: 0,
      }}>
        <div style={{ padding: "18px 16px 12px", borderBottom: `2px solid ${T.accent}` }}>
          <div style={{ fontSize: 15, fontWeight: 900, letterSpacing: 1.2, lineHeight: 1.25 }}>{data.shop.name}</div>
          <div style={{ fontSize: 10, color: err ? T.danger : T.muted, fontFamily: T.mono, marginTop: 4 }}>
            {err ? "⚠ " + err : `● live${savedAt ? " · " + new Date(savedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""}`}
          </div>
          {currentStaff && (
            <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
              {currentStaff.firstName} · <span style={{ color: T.accent }}>{currentStaff.role}</span>
            </div>
          )}
        </div>
        <div style={{ padding: "10px 8px", flex: 1 }}>
          {tabs.map((t2) => (
            <button key={t2.id} onClick={() => goTab(t2.id)}
              style={{
                display: "block", width: "100%", textAlign: "left", padding: "11px 12px", marginBottom: 2,
                borderRadius: 6, border: "none", cursor: "pointer", fontFamily: T.sans,
                background: tab === t2.id ? T.accent : "transparent",
                color: tab === t2.id ? "#181205" : T.muted, fontWeight: 800, fontSize: 13,
              }}>{t2.label}</button>
          ))}
        </div>
        
      </div>

	
<div className="gm-main" style={{ flex: 1, minWidth: 0, paddingBottom: 40, width: "100%", display: "flex", flexDirection: "column" }}>
  {/* Desktop top strip: module title left, sign out stacked right */}
  <div style={{
    display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 16,
    padding: "10px 20px", borderBottom: `1px solid ${T.line}`, background: T.panel2,
  }}>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 18, fontWeight: 900, letterSpacing: 0.5, color: T.text }}>
        {(tabs.find((t) => t.id === tab) || {}).label || ""}
      </div>
    </div>
    
    {currentStaff && (
      <button 
        className="gm-desktop-signout"
        onClick={confirmLogout} 
        style={{
          background: "rgba(208,91,74,0.15)", 
          color: T.danger, 
          border: `1px solid ${T.danger}`,
          borderRadius: 6, 
          padding: "8px 14px", 
          fontWeight: 800, 
          fontSize: 13,
          fontFamily: T.sans, 
          cursor: "pointer", 
          display: "inline-flex",
          alignItems: "center",
          gap: 8,
        }}
      >
        <svg 
          width="16" 
          height="16" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth="2" 
          strokeLinecap="round" 
          strokeLinejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Sign Out
      </button>
    )}
  </div>


        {(() => {
          const dueTools = (data.tools || []).map((t) => ({ t, d: toolDue(t) })).filter((x) => x.d && x.d.state !== "ok");
          if (!dueTools.length) return null;
          const anyOver = dueTools.some((x) => x.d.state === "over");
          return (
            <div style={{ background: anyOver ? "#3a1710" : "#39290e", color: anyOver ? T.danger : T.accent, fontSize: 12, fontWeight: 700, padding: "8px 16px", textAlign: "center", borderBottom: `1px solid ${anyOver ? T.danger : T.accent}` }}>
              🔧 {dueTools.length} tool{dueTools.length > 1 ? "s" : ""} {anyOver ? "overdue for" : "due for"} service — see Tools
            </div>
          );
        })()}

      <div style={{ maxWidth: "100%", margin: 0, padding: "16px 20px 24px", width: "100%", boxSizing: "border-box", flex: 1 }}>
        {tab === "dashboard" && <Dashboard data={data} jobTotal={jobTotal} staffStats={staffStats} isAdmin={isAdmin} />}
        {tab === "jobs" && view.type === "list" && <JobsList data={data} jobTotal={jobTotal} openJob={(id) => setView({ type: "job", id })} openNew={() => setView({ type: "newjob" })} />}
        {tab === "jobs" && view.type === "newjob" && <NewJob data={data} save={save} done={(id) => setView({ type: "job", id })} cancel={() => setView({ type: "list" })} />}
        {tab === "jobs" && view.type === "job" && <JobDetail data={data} save={save} jobId={view.id} back={() => setView({ type: "list" })} jobTotal={jobTotal} openReport={(id) => setView({ type: "report", id })} canEditVehicles={currentStaff?.role !== "Technician"} />}
        {tab === "jobs" && view.type === "report" && <FullReport data={data} jobId={view.id} back={() => setView({ type: "job", id: view.id })} jobTotal={jobTotal} />}
        {tab === "customers" && view.type === "list" && <CustomersList data={data} openCustomer={(id) => setView({ type: "customer", id })} openNew={() => setView({ type: "custform" })} />}
        {tab === "customers" && view.type === "customer" && <CustomerDetail data={data} save={save} custId={view.id} back={() => setView({ type: "list" })} openJob={(id) => { setTab("jobs"); setView({ type: "job", id }); }} openEdit={(id) => setView({ type: "custform", id })} jobTotal={jobTotal} canEditVehicles={currentStaff?.role !== "Technician"} />}
        {tab === "customers" && view.type === "custform" && <CustomerForm data={data} save={save} custId={view.id} back={() => setView(view.id ? { type: "customer", id: view.id } : { type: "list" })} />}
        {tab === "stock" && view.type === "list" && <StockTab data={data} save={save} goPurchase={() => setView({ type: "purchase" })} openPurchase={(id) => setView({ type: "pedit", id })} canManage={currentStaff?.role !== "Technician"} />}
        {tab === "stock" && view.type === "purchase" && <PurchaseForm data={data} save={save} back={() => setView({ type: "list" })} />}
        {tab === "stock" && view.type === "pedit" && <PurchaseEdit data={data} save={save} pid={view.id} back={() => setView({ type: "list" })} />}
        {tab === "tools" && view.type === "list" && <ToolsList data={data} save={save} openTool={(id) => setView({ type: "toolform", id })} openNew={() => setView({ type: "toolform" })} />}
        {tab === "tools" && view.type === "toolform" && <ToolForm data={data} save={save} toolId={view.id} back={() => setView({ type: "list" })} />}
        {tab === "suppliers" && view.type === "list" && <SuppliersList data={data} openSupplier={(id) => setView({ type: "supplier", id })} openNew={() => setView({ type: "supform" })} />}
        {tab === "suppliers" && view.type === "supplier" && <SupplierDetail data={data} save={save} supId={view.id} back={() => setView({ type: "list" })} openEdit={(id) => setView({ type: "supform", id })} openBill={(kind, id) => setView({ type: kind === "purchase" ? "suppurchase" : "supexpense", id, supId: view.id })} canManage={currentStaff?.role !== "Technician"} />}
        {tab === "suppliers" && view.type === "supform" && <SupplierForm data={data} save={save} supId={view.id} back={() => setView(view.id && data.suppliers.some((x) => x.id === view.id) ? { type: "supplier", id: view.id } : { type: "list" })} />}
        {tab === "suppliers" && view.type === "suppurchase" && <PurchaseEdit data={data} save={save} pid={view.id} back={() => setView({ type: "supplier", id: view.supId })} />}
        {tab === "suppliers" && view.type === "supexpense" && <ExpenseForm data={data} save={save} expId={view.id} back={() => setView({ type: "supplier", id: view.supId })} />}
        {tab === "invoices" && view.type === "list" && (<>
          {(data.vat?.enabled || data.jobs.some((j) => j.vatRate > 0)) && (
            <div style={{ textAlign: "right", marginBottom: 8 }}>
              <Btn small kind="ghost" onClick={() => setView({ type: "vatreport" })}>VAT report →</Btn>
            </div>
          )}
          <InvoicesTab data={data} jobTotal={jobTotal} openInvoice={(id) => setView({ type: "invoice", id })} openCustomer={(cid) => { setTab("customers"); setView({ type: "customer", id: cid }); }} />
        </>)}
        {tab === "invoices" && view.type === "vatreport" && <VatReport data={data} jobTotal={jobTotal} back={() => setView({ type: "list" })} />}
        {tab === "invoices" && view.type === "invoice" && <InvoiceDetail data={data} save={save} jobId={view.id} back={() => setView({ type: "list" })} jobTotal={jobTotal} />}
        {tab === "finance" && isAdmin && <FinanceTab data={data} save={save} jobTotal={jobTotal} view={view} setView={setView} />}
        {tab === "settings" && isAdmin && <SettingsModule data={data} save={save} session={getSession()} initialStaff={staffList} onStaffChange={(list) => { setStaffList(list); const total = list.length; const active = list.filter((s) => s.status === "active").length; setStaffStats({ total, active, inactive: total - active }); }} />}
      </div>
      </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<GarageManager />);
</script>
</body>
</html>
