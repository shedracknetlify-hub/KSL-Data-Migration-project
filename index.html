}

// live calculations: unit, expected, unaccounted hours, section totals, cooked vs wrapped
function refreshPlanCalcs() {
  const sh = shiftHours(S.ctx.shift);
  const used = {};
  for (const r of PL.rows) for (const l of rowLines(r)) used[l.machine] = (used[l.machine] || 0) + (num(r.hrs) || 0) + (num(r.co) || 0);
  const tot = {};
  for (const r of PL.rows) {
    const tr = $(`tr.prow[data-key="${r.key}"]`), p = S.m.productBy[r.product], fs = mfields(r);
    r.calc = {}; r.unit = '';
    for (const x of fs) { const mc = S.m.machineBy[r[x.f]]; if (!mc) continue;
      r.calc[x.f] = { unit: p?.uom || mc.unit || '', expected: planExpected(mc, p, num(r.hrs)), unacc: r2(sh - used[mc.code]) };
      r.unit ||= r.calc[x.f].unit; }
    for (const l of rowLines(r)) { const mc = S.m.machineBy[l.machine]; if (!mc) continue;
      const t = tot[mc.department] ||= { lines: 0, out: 0, exp: 0, units: new Set() };
      t.lines++; t.out += num(l.out) || 0; t.exp += r.calc[l.f].expected; if (r.calc[l.f].unit) t.units.add(r.calc[l.f].unit.toUpperCase()); }
    if (!tr) continue;
    $('.u', tr).textContent = r.unit;
    const se = $$('.e .sub', tr), su = $$('.ua .sub', tr);
    fs.forEach((x, i) => { const c = r.calc[x.f], mc = S.m.machineBy[r[x.f]];
      if (se[i]) se[i].textContent = c ? fmt(c.expected) : '';
      if (su[i]) { su[i].textContent = c ? fmt(c.unacc, 2) : ''; su[i].classList.toggle('neg', !!c && c.unacc < 0);
        su[i].title = c && c.unacc < 0 ? `${mc.name} is planned for ${fmt(used[mc.code], 2)} h – longer than the ${sh} h shift` : ''; } });
  }
  // Cooking total = cookers only (the Uniplast and cooling conveyor carry the same output, so it isn't added three times)
  for (const [sec, t] of Object.entries(tot)) { const el = $(`[data-sum="${CSS.escape(sec)}"]`);
    if (el) el.textContent = `· ${t.lines} ${sec === 'Cooking' ? 'cooker' : 'machine line'}(s) · planned ${fmt(t.out)} · expected ${fmt(t.exp)} ${[...t.units].join('/')}`; }
  drawCookedVsWrapped();
}
// Cooked vs wrapped by product family (name before COOKED / WRAPPED), as in the Planning Template summary
function productFamily(desc) {
  let d = String(desc || '').toUpperCase();
  const i = d.search(/\b(COOKED|WRAPPED)/); if (i < 0) return null;
  d = d.slice(0, i).trim().replace(/\s+(PP|TWIST|PILLOWPACK)$/, '').trim();
  return d.replace('COOL COW CHOCOLATE LOLLIPOPS', 'LARGE CHOCOLATE LOLLIPOPS').replace('COOL COW LOLLIPOPS', 'LARGE MILK LOLLIPOPS');
}
function drawCookedVsWrapped() {
  const box = $('#pCvW'); if (!box) return;
  const fam = {};
  for (const r of PL.rows) for (const l of rowLines(r)) {
    const mc = S.m.machineBy[l.machine], p = S.m.productBy[r.product]; if (!mc || !p) continue;
    const kind = mc.department === 'Cooking' ? 'cooked' : mc.department === 'Wrapping' ? 'wrapped' : null; if (!kind) continue;
    const f = productFamily(p.description) || p.description; const x = fam[f] ||= { cooked: 0, wrapped: 0 };
    x[kind] += num(l.out) || 0;
  }
  const rows = Object.entries(fam).sort((a, b) => b[1].cooked - a[1].cooked || b[1].wrapped - a[1].wrapped);
  if (!rows.length) { box.innerHTML = `<div class="panel muted small">Nothing planned on cookers or wrapping machines yet.</div>`; return; }
  box.innerHTML = `<div class="tablewrap" style="max-width:780px"><table><thead><tr><th>Product</th><th class="n">Cooked kg<br>(cookers)</th><th class="n">Wrapped kg<br>(wrapping)</th><th class="n">Cooked − wrapped</th></tr></thead><tbody>
    ${rows.map(([f, x]) => { const d = x.cooked - x.wrapped, pc = x.cooked > 0 ? d / x.cooked : null;
      return `<tr><td>${esc(f)}</td><td class="n">${fmt(x.cooked)}</td><td class="n">${fmt(x.wrapped)}</td><td class="n">${!x.cooked || !x.wrapped ? `<span class="pill a">${x.cooked ? 'not wrapped' : 'not cooked'}</span>` : `${fmt(d)} <span class="muted">(${pct(pc)})</span>`}</td></tr>`; }).join('')}
    </tbody></table></div><div class="muted small" style="margin-top:6px">Planned output by product family this shift. Positive = more cooked than wrapped.</div>`;
}

async function copyPlan() {
  const d = $('#pCopyDate').value, sh = $('#pCopyShift').value;
  if (!d) return planMsg('Choose the date to copy from.', 'warn');
  if (d === S.ctx.date && sh === S.ctx.shift) return planMsg('That is the shift you are planning – choose another one to copy from.', 'warn');
  const btn = $('#pCopy');
  if (PL.rows.length && btn.dataset.confirm !== '1') {
    btn.dataset.confirm = '1'; btn.textContent = 'Replace current lines?'; btn.classList.add('warn');
    setTimeout(() => { if (btn.isConnected) { btn.dataset.confirm = ''; btn.textContent = 'Copy'; btn.classList.remove('warn'); } }, 4000); return;
  }
  btn.dataset.confirm = ''; btn.textContent = 'Copy'; btn.classList.remove('warn');
  const { data, error } = await sb.from('plan_lines').select('*').eq('plan_date', d).eq('shift', sh).order('id');
  if (error) return fail(error, 'Copying plan');
  if (!data.length) return planMsg(`There is no plan for ${niceDate(d)} ${sh} to copy.`, 'warn');
  const sameLen = shiftHours(sh) === shiftHours(S.ctx.shift);
  const cp = planRowsFrom(data.filter(r => S.m.machineBy[r.machine_code]?.active), false, sameLen);   // cooking groups found on the original hours/output
  PL.rows = cp.rows;
  PL.dirty = true; PL.date = S.ctx.date; PL.shift = S.ctx.shift;
  drawPlan();
  const loose = PL.rows.filter(r => r.kind === 'single' && ['Forming', 'Cooling'].includes(sectionOf(r))).length;
  planMsg(`Copied ${PL.rows.length} line(s) from ${niceDate(d)} ${sh}${cp.groups ? `, including ${cp.groups} cooking line(s) (cooker + Uniplast + cooling)` : ''}.${loose ? ` ${loose} Uniplast / cooling line(s) didn't match a cooker and show as <b>Not grouped</b> in Cooking.` : ''}${sameLen ? '' : ` That shift is a different length, so enter the running and cleaning hours – planned output fills in.`} Check them and press <b>Save plan</b> – nothing is saved yet.`);
}

async function savePlan() {
  const sh = shiftHours(S.ctx.shift), { date, shift } = S.ctx;
  const errs = [], warns = [], keep = [];
  comboClose();
  $$('tr.prow td, tr.prow .mf').forEach(el => { el.classList.remove('bad'); el.title = ''; });
  refreshPlanCalcs();
  for (const r of PL.rows) {
    const tr = $(`tr.prow[data-key="${r.key}"]`), fs = mfields(r);
    const texts = Object.fromEntries(fs.map(x => [x.f, (tr && $(`.mf[data-f="${x.f}"] input`, tr)?.value.trim()) || '']));
    const prodText = (tr && $('[data-k=product] input', tr)?.value.trim()) || '';
    const blank = fs.every(x => !texts[x.f]) && !prodText && !r.hrs && !r.co && (r.auto || !r.out);
    if (blank && !r.id) continue;
    const bad = [], mark = (k, why) => { bad.push(why);
      const el = tr && (fs.some(x => x.f === k) ? $(`.mf[data-f="${k}"]`, tr) : $(`[data-k=${k}]`, tr)); if (el) { el.classList.add('bad'); el.title = why; } };
    const mcs = [];
    for (const x of fs) {
      const what = x.label || 'Machine', mc = S.m.machineBy[r[x.f]];
      if (!texts[x.f]) { if (!x.optional) mark(x.f, `${what} is required`); }
      else if (!mc || mc.department !== x.dept || mc.name !== texts[x.f]) mark(x.f, `${what} not recognised – pick it from the list`);
      else mcs.push(mc);
    }
    if (r.kind === 'wrap' && r.machine && r.m2 && r.machine === r.m2) mark('m2', 'Machine 2 is the same as Machine 1');
    const pcode = prodText ? productFromLabel(prodText) : null;
    const needs = mcs.length ? mcs.some(needsProduct) : !!STAGES_BY_SECTION[sectionOf(r)];
    if (needs && !prodText) mark('product', 'Product is required');
    else if (prodText && pcode === undefined) mark('product', 'Product not recognised – pick it from the list');
    else if (pcode) { const se = mcs.map(mc => productStageError(mc, pcode)).find(Boolean); if (se) mark('product', se); }
    const hrs = num(r.hrs), co = num(r.co), out = num(r.out);
    if (hrs === null) mark('hrs', 'Running hours are required');
    else if (Number.isNaN(hrs) || hrs < 0 || hrs > 13) mark('hrs', 'Running hours must be a number from 0 to 13');
    if (Number.isNaN(co) || co < 0 || co > 13) mark('co', 'Cleaning hours must be a number from 0 to 13');
    if (out === null) mark('out', 'Planned output is required');
    else if (Number.isNaN(out) || out < 0) mark('out', 'Planned output must be a number (0 or more)');
    if (bad.length) { errs.push(`<b>${esc(rowName(r))}:</b> ${bad.map(esc).join(' · ')}`); continue; }
    for (const l of rowLines(r)) {
      const mc = S.m.machineBy[l.machine], c = r.calc[l.f];
      keep.push({ r, id: l.id, rec: { plan_date: date, shift, machine_code: mc.code, product_code: pcode || null, planned_hrs: hrs, changeover_hrs: co || 0,
        planned_output: l.out, unit: c.unit || null, expected_output: planExpected(mc, S.m.productBy[pcode], hrs), unaccounted_hrs: c.unacc } });
    }
  }
  const btn = $('#pSave');
  const resetBtn = () => { btn.dataset.force = ''; btn.textContent = 'Save plan'; btn.classList.replace('warn', 'primary'); };
  if (errs.length) { resetBtn(); return planMsg(`Fix these before saving:<br>${errs.join('<br>')}`, 'err'); }
  // soft checks – press again to save anyway
  const over = [...new Set(keep.filter(k => k.rec.unaccounted_hrs < 0).map(k => S.m.machineBy[k.rec.machine_code].name))];
  if (over.length) warns.push(`Planned longer than the ${sh} h shift: ${over.map(esc).join(', ')}.`);
  const seen = {}, dup = [];
  for (const k of keep) { const key = k.rec.machine_code + '|' + k.rec.product_code; if (seen[key]) dup.push(S.m.machineBy[k.rec.machine_code].name); seen[key] = 1; }
  if (dup.length) warns.push(`Same machine and product on more than one line: ${[...new Set(dup)].map(esc).join(', ')}.`);
  if (warns.length && btn.dataset.force !== '1') {
    btn.dataset.force = '1'; btn.textContent = 'Save anyway'; btn.classList.replace('primary', 'warn');
    return planMsg(warns.join('<br>') + '<br>Press <b>Save anyway</b> to save it as it is.', 'warn');
  }
  resetBtn();
  // inserts / updates (only lines that changed) / deletes
  const same = (a, b) => { const n = v => v == null || v === '' ? null : (isNaN(+v) ? v : +v); return n(a) === n(b); };
  const keptIds = new Set(keep.filter(k => k.id).map(k => Number(k.id)));
  const dels = Object.keys(PL.orig).map(Number).filter(id => !keptIds.has(id));
  const ins = keep.filter(k => !k.id).map(k => k.rec);
  const ups = keep.filter(k => k.id && ['machine_code', 'product_code', 'planned_hrs', 'changeover_hrs', 'planned_output', 'unit', 'expected_output', 'unaccounted_hrs']
    .some(f => !same(PL.orig[k.id][f], k.rec[f])));
  if (!dels.length && !ins.length && !ups.length) { PL.dirty = false; return planMsg('No changes to save.'); }
  btn.disabled = true; btn.textContent = 'Saving…';
  const results = [];
  if (dels.length) results.push(await sb.from('plan_lines').delete().in('id', dels));
  results.push(...await Promise.all(ups.map(k => { const { plan_date, shift: s, ...chg } = k.rec; return sb.from('plan_lines').update(chg).eq('id', k.id); })));
  if (ins.length) results.push(await sb.from('plan_lines').insert(ins));
  btn.disabled = false; btn.textContent = 'Save plan';
  const bad = results.find(x => x.error);
  if (bad) { fail(bad.error, 'Saving plan'); PL.dirty = false; return loadPlan(); }
  toast(`Plan saved – ${ins.length} added, ${ups.length} changed, ${dels.length} removed`, 'ok');
  PL.dirty = false;
  await loadPlan();
}

function exportPlan() {
  refreshPlanCalcs();
  const rows = [];
  for (const r of PL.rows) for (const l of rowLines(r)) { const mc = S.m.machineBy[l.machine]; if (!mc) continue; const c = r.calc[l.f];
    rows.push({ Date: S.ctx.date, Shift: S.ctx.shift, Section: mc.department, Machine: mc.name,
      'Product code': r.product || '', Product: S.m.productBy[r.product]?.description || '', 'Running hours': num(r.hrs), 'Cleaning/changeover hours': num(r.co),
      'Planned output': num(l.out), Unit: c.unit, 'Expected output': c.expected, 'Unaccounted hours': c.unacc }); }
  if (!rows.length) return toast('Nothing to export');
  const ws = XLSX.utils.json_to_sheet(rows), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Plan'); XLSX.writeFile(wb, `KSL Plan ${S.ctx.date} ${S.ctx.shift}.xlsx`);
}

/* =========================================================
   USERS (admin)
   ========================================================= */
async function renderUsers() {
  $('#app').innerHTML = `<div class="hint"><b>Adding someone:</b> Supabase → Authentication → Users → <b>Add user → Create new user</b>. Type their email and a <b>temporary password</b>, tick <b>Auto Confirm User</b>, and give them the temporary password. They appear here as <b>pending</b> – give them a role and press Save. The first time they log in, the app makes them choose their own password.<br>
    <b>Forgotten password:</b> they press <i>Forgot your password?</i> on the log-in screen and get an email link. If they can't get email, set them a temporary password below.<br>
    <b>Clerk</b>: Bulk entry and SAP summary; can correct their own entries and Mobile data clerks' entries ·
    <b>Mobile data clerk</b>: Bulk entry only; own entries only ·
    <b>Shift supervisor</b>: Planning (full), OEE (view) ·
    <b>Planner</b>: Planning, OEE, Stoppages · <b>Manager</b>: OEE and Planning, view only · <b>Admin</b>: everything.</div><div id="uBody" class="muted">Loading…</div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at');
  if (error) return fail(error, 'Loading users');
  const roles = ['pending', 'clerk', 'mobile_clerk', 'supervisor', 'planner', 'manager', 'admin'];
  const hasPw = data.some(u => 'password_set' in u);      // false until 11_passwords.sql is run
  $('#uBody').className = '';
  $('#uBody').innerHTML = `<div class="tablewrap"><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th>${hasPw ? '<th>Password</th>' : ''}<th></th></tr></thead><tbody>
    ${data.map(u => `<tr data-u="${u.user_id}"><td>${esc(u.email)}</td><td><input class="u-n" value="${esc(u.full_name || '')}" style="min-width:180px"></td>
      <td><select class="u-r">${roles.map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${esc(ROLE_LABEL[r])}</option>`).join('')}</select></td>
      <td><input type="checkbox" class="u-a" style="width:auto;min-height:0" ${u.active ? 'checked' : ''}></td>
      ${hasPw ? `<td><label class="small" style="display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" class="u-p" style="width:auto;min-height:0" ${u.password_set === false ? 'checked' : ''}> Must choose new password at next log-in</label></td>` : ''}
      <td><button class="btn sm u-s">Save</button></td></tr>`).join('')}</tbody></table></div>
    ${hasPw ? `<div class="panel" style="margin-top:14px;max-width:760px">
      <h3 style="font-size:16px;margin-bottom:4px">Set a temporary password</h3>
      <div class="muted small" style="margin-bottom:10px">For someone who has forgotten their password and can't use the email link. Tell them the temporary password; they must choose their own when they next log in.</div>
      <div class="toolbar" style="margin:0">
        <div class="field" style="flex:1 1 220px"><label for="tpU">Person</label><select id="tpU"><option value="">Choose…</option>${data.map(u => `<option value="${u.user_id}">${esc(u.full_name && u.full_name !== u.email ? `${u.full_name} (${u.email})` : u.email)}</option>`).join('')}</select></div>
        <div class="field" style="flex:1 1 180px"><label for="tpP">Temporary password</label><input id="tpP" type="text" autocomplete="off" spellcheck="false" placeholder="At least ${PW_MIN} characters"></div>
        <button class="btn" id="tpGen" type="button">Make one up</button>
        <button class="btn primary" id="tpSet" type="button">Set temporary password</button>
      </div><div id="tpMsg" style="margin-top:10px"></div></div>` : ''}`;
  $$('#uBody tr[data-u]').forEach(tr => $('.u-s', tr).onclick = async () => {
    const upd = { full_name: $('.u-n', tr).value.trim(), role: $('.u-r', tr).value, active: $('.u-a', tr).checked };
    if ($('.u-p', tr)) upd.password_set = !$('.u-p', tr).checked;
    const { error } = await sb.from('profiles').update(upd).eq('user_id', tr.dataset.u);
    if (error) return fail(error, 'Saving user'); toast('User saved', 'ok');
  });
  if (!hasPw) return;
  $('#tpGen').onclick = () => {      // easy to read out: no 0/O, 1/l/I
    const L = 'abcdefghjkmnpqrstuvwxyz', D = '23456789', r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
    let p = ''; for (let i = 0; i < 6; i++) p += L[r(L.length)]; for (let i = 0; i < 4; i++) p += D[r(D.length)];
    $('#tpP').value = p[0].toUpperCase() + p.slice(1);
  };
  $('#tpSet').onclick = async () => {
    const uid = $('#tpU').value, pw = $('#tpP').value.trim(), out = (t, k) => { $('#tpMsg').innerHTML = `<div class="msg ${k}">${t}</div>`; };
    if (!uid) return out('Choose the person first.', 'err');
    if (pw.length < PW_MIN) return out(`The temporary password must be at least ${PW_MIN} characters.`, 'err');
    const u = data.find(x => x.user_id === uid);
    const btn = $('#tpSet'); btn.disabled = true;
    const { error } = await sb.rpc('admin_set_temp_password', { target: uid, temp_password: pw });
    btn.disabled = false;
    if (error) return out('Could not set the password: ' + esc(error.message), 'err');
    out(`Done. <b>${esc(u.email)}</b> can now log in with <b class="mono">${esc(pw)}</b> and will be asked to choose their own password.`, 'ok');
    const box = $(`#uBody tr[data-u="${uid}"] .u-p`); if (box) box.checked = true;
    if (uid === S.user.id) toast('That was your own login – you will be asked for a new password next time you log in.', '');
  };
}

start().catch(e => { console.error(e); renderLogin('Could not start: ' + e.message); });
